<title>Klausurduell</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one-column iOS-style app, large titles, floating Liquid-Glass tab bar over a slow ambient light field. */
:root{
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Inter", "Segoe UI", system-ui, sans-serif;
  --bg:#eef1f6; --ink:#0d1220; --ink-2:#4a5368; --ink-3:#8a93a6;
  --glass:rgba(255,255,255,.52); --glass-strong:rgba(255,255,255,.72); --glass-soft:rgba(255,255,255,.34);
  --edge:rgba(255,255,255,.75); --edge-2:rgba(255,255,255,.25); --hair:rgba(13,18,32,.08);
  --shadow:0 18px 40px -18px rgba(28,40,80,.28), 0 2px 6px -2px rgba(28,40,80,.08);
  --spec:rgba(255,255,255,.85);
  --accent:#0a7cff; --accent-ink:#ffffff;
  --ok:#1fa64a; --ok-soft:rgba(52,199,89,.16); --bad:#e5342a; --bad-soft:rgba(255,69,58,.14); --warn:#f59e0b;
  --blob1:#7cc4ff; --blob2:#9be7d0; --blob3:#ffc4a3; --blob4:#c7b8ff;
  --scrim:rgba(10,14,25,.28);
  --c-hydro:#1aa3e0; --c-phys:#5e5ce6; --c-bsk:#f08a00; --c-bauko:#ef4136; --c-binf:#22a556; --c-stat:#a64fd9; --c-dap:#d9467a;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#07090f; --ink:#f3f5fa; --ink-2:#b3bacb; --ink-3:#7b8397;
  --glass:rgba(40,46,62,.42); --glass-strong:rgba(56,63,84,.62); --glass-soft:rgba(30,35,48,.32);
  --edge:rgba(255,255,255,.18); --edge-2:rgba(255,255,255,.05); --hair:rgba(255,255,255,.08);
  --shadow:0 20px 44px -18px rgba(0,0,0,.7), 0 2px 6px -2px rgba(0,0,0,.4);
  --spec:rgba(255,255,255,.22);
  --accent:#2f8cff; --ok:#34c759; --ok-soft:rgba(52,199,89,.3); --bad:#ff5a4f; --bad-soft:rgba(255,69,58,.26);
  --blob1:#1d4f9a; --blob2:#0f5d55; --blob3:#6b2f3a; --blob4:#3a2c7a; --scrim:rgba(0,0,0,.5);
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#07090f; --ink:#f3f5fa; --ink-2:#b3bacb; --ink-3:#7b8397;
  --glass:rgba(40,46,62,.42); --glass-strong:rgba(56,63,84,.62); --glass-soft:rgba(30,35,48,.32);
  --edge:rgba(255,255,255,.18); --edge-2:rgba(255,255,255,.05); --hair:rgba(255,255,255,.08);
  --shadow:0 20px 44px -18px rgba(0,0,0,.7), 0 2px 6px -2px rgba(0,0,0,.4);
  --spec:rgba(255,255,255,.22);
  --accent:#2f8cff; --ok:#34c759; --ok-soft:rgba(52,199,89,.3); --bad:#ff5a4f; --bad-soft:rgba(255,69,58,.26);
  --blob1:#1d4f9a; --blob2:#0f5d55; --blob3:#6b2f3a; --blob4:#3a2c7a; --scrim:rgba(0,0,0,.5);
  color-scheme:dark }

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.4;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;letter-spacing:-.011em}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
svg{display:block}

/* ambient light field */
.ambient{position:fixed;inset:-20%;z-index:0;pointer-events:none;filter:blur(60px) saturate(140%);opacity:.95}
.ambient i{position:absolute;border-radius:50%;opacity:.75;animation:drift 26s ease-in-out infinite alternate}
.ambient i:nth-child(1){width:55vmax;height:55vmax;left:-5%;top:-8%;background:var(--blob1)}
.ambient i:nth-child(2){width:46vmax;height:46vmax;right:-8%;top:10%;background:var(--blob2);animation-delay:-8s}
.ambient i:nth-child(3){width:50vmax;height:50vmax;left:15%;bottom:-15%;background:var(--blob3);animation-delay:-14s}
.ambient i:nth-child(4){width:36vmax;height:36vmax;right:10%;bottom:5%;background:var(--blob4);animation-delay:-20s}
.ambient.tint i:nth-child(1),.ambient.tint i:nth-child(4){background:var(--tint,var(--blob1));opacity:.42}
@keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(4%,6%) scale(1.08)}100%{transform:translate(-5%,2%) scale(.95)}}

/* glass material */
.glass{position:relative;background:var(--glass);border:1px solid var(--edge-2);
  -webkit-backdrop-filter:blur(26px) saturate(185%);backdrop-filter:blur(26px) saturate(185%);
  box-shadow:inset 0 1px 0 var(--edge), inset 0 -1px 0 var(--edge-2), var(--shadow);isolation:isolate}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;
  background:linear-gradient(150deg,var(--spec) 0%,transparent 34%,transparent 66%,rgba(255,255,255,.08) 100%);opacity:.55}
.press{transition:transform .35s cubic-bezier(.2,.9,.25,1.25), background-color .2s, box-shadow .2s}
.press:active{transform:scale(.965)}

/* shell */
.app{position:relative;z-index:1;max-width:620px;margin:0 auto;min-height:100%;
  padding-left:max(18px, env(safe-area-inset-left, 0px));padding-right:max(18px, env(safe-area-inset-right, 0px));
  padding-block:calc(18px + env(safe-area-inset-top, 0px)) 140px}
.view{display:flex;flex-direction:column;gap:26px;animation:viewIn .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes viewIn{from{opacity:.0;transform:translateY(10px)}to{opacity:1;transform:none}}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:10px}
.eyebrow{font-size:13px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em}
h1{font-size:34px;line-height:1.08;font-weight:800;letter-spacing:-.03em;margin:4px 0 0;text-wrap:balance}
h2{font-size:21px;font-weight:700;letter-spacing:-.022em;margin:0}
.sec{display:flex;flex-direction:column;gap:12px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;padding:0 4px}
.sec-h small{color:var(--ink-3);font-size:14px}
.round{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none}
.round svg{width:20px;height:20px}

/* today hero */
.hero{border-radius:30px;padding:22px;display:grid;grid-template-columns:auto 1fr;gap:16px 20px;align-items:center}
.ring{position:relative;width:118px;height:118px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .num b{font-size:30px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.ring .num span{font-size:12px;color:var(--ink-3);font-weight:600}
.hero-t{display:flex;flex-direction:column;gap:6px;min-width:0}
.hero-t .lbl{font-size:15px;color:var(--ink-2)}
.hero-t .big{font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:6px 10px;border-radius:99px;background:var(--glass-soft);border:1px solid var(--edge-2)}
.chip svg{width:14px;height:14px}
.cta{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:58px;border-radius:20px;
  background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 88%,white) 0%,var(--accent) 100%);color:var(--accent-ink);
  font-size:17px;font-weight:700;letter-spacing:-.01em;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45), inset 0 -1px 0 rgba(0,0,0,.12), 0 14px 30px -12px color-mix(in srgb,var(--accent) 70%,transparent)}
.cta svg{width:20px;height:20px}
.cta[disabled]{opacity:.45;pointer-events:none}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:12px;text-align:left;min-height:122px}
.tile .round{width:36px;height:36px}
.tile b{font-size:16px;font-weight:700;letter-spacing:-.015em}
.tile span{font-size:13px;color:var(--ink-2)}

/* subject icon */
.ico{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex:none;color:#fff;
  background:linear-gradient(160deg,color-mix(in srgb,var(--c) 75%,white) 0%,var(--c) 70%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 8px 16px -8px var(--c)}
.ico svg{width:24px;height:24px}
.ico.sm{width:34px;height:34px;border-radius:10px}.ico.sm svg{width:19px;height:19px}

/* subject rows */
.list{border-radius:24px;overflow:hidden}
.row{display:flex;align-items:center;gap:14px;padding:14px 16px;width:100%;text-align:left}
.row+.row{border-top:1px solid var(--hair)}
.row .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.row .t b{font-size:16px;font-weight:650;letter-spacing:-.015em}
.row .t small{font-size:13px;color:var(--ink-3)}
.bar{height:6px;border-radius:99px;background:var(--hair);overflow:hidden}
.bar>div{height:100%;border-radius:inherit;background:var(--c,var(--accent));transition:width .8s cubic-bezier(.2,.8,.2,1)}
.row .pct{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink-2);min-width:42px;text-align:right}
.chev{width:9px;height:15px;color:var(--ink-3);flex:none}

/* stats */
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:2px}
.stat b{font-size:26px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--ink-3);font-weight:600}
.panel{border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:14px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:120px}
.week .col{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.week .b{width:100%;max-width:26px;border-radius:8px;background:var(--hair);position:relative;overflow:hidden;min-height:6px}
.week .b>div{position:absolute;inset:auto 0 0 0;background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 70%,white),var(--accent));border-radius:inherit}
.week .col span{font-size:11.5px;color:var(--ink-3);font-weight:600}
.week .col.today span{color:var(--accent)}
.boxes{display:flex;flex-direction:column;gap:10px}
.boxrow{display:grid;grid-template-columns:92px 1fr 36px;gap:10px;align-items:center;font-size:14px}
.boxrow span:last-child{text-align:right;color:var(--ink-2);font-variant-numeric:tabular-nums;font-weight:600}
.boxrow .bar{height:10px}
.legend{font-size:13px;color:var(--ink-3);line-height:1.5}
.link{color:var(--accent);font-weight:600;font-size:15px;padding:12px 4px;text-align:left}
.link.danger{color:var(--bad)}

/* tab bar */
.tabbar{position:fixed;z-index:20;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom, 0px));
  width:min(420px, calc(100% - 32px - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px)));height:66px;border-radius:33px;
  display:grid;grid-template-columns:repeat(4,1fr);padding:5px}
.tabbar .pill{position:absolute;top:5px;bottom:5px;left:5px;width:calc((100% - 10px)/4);border-radius:28px;
  background:var(--glass-strong);box-shadow:inset 0 1px 0 var(--edge),0 4px 12px -6px rgba(0,0,0,.25);
  transition:transform .55s cubic-bezier(.3,1.35,.4,1)}
.tab{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-size:10.5px;font-weight:600;color:var(--ink-2);border-radius:28px;white-space:nowrap}
.tab svg{width:23px;height:23px}
.tab.on{color:var(--accent)}

/* sheets */
.scrim{position:fixed;inset:0;z-index:40;background:var(--scrim);opacity:0;transition:opacity .3s}
.scrim.show{opacity:1}
.sheet{position:fixed;z-index:41;left:50%;bottom:0;width:min(620px,100%);transform:translate(-50%,105%);
  border-radius:30px 30px 0 0;padding:10px max(20px, env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px, env(safe-area-inset-right,0px));
  transition:transform .5s cubic-bezier(.2,.9,.25,1);max-height:88%;overflow:auto;background:var(--glass-strong)}
.sheet.show{transform:translate(-50%,0)}
.grab{width:38px;height:5px;border-radius:9px;background:var(--ink-3);opacity:.45;margin:2px auto 14px}
.sheet{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.sheet.drag{transition:none}
.sheet .sx{position:absolute;top:12px;right:14px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--glass-soft);border:1px solid var(--edge-2);color:var(--ink-2);z-index:2}
.sheet .sx svg{width:15px;height:15px}
body.locked{position:fixed;left:0;right:0;overflow:hidden}
.sheet h2{margin-bottom:4px;padding-right:38px}
.sheet .sub{color:var(--ink-2);font-size:15px;margin:0 0 16px}
.topic{display:flex;align-items:center;gap:12px;padding:13px 4px;border-top:1px solid var(--hair);width:100%;text-align:left}
.topic b{flex:1;font-weight:600}
.topic small{color:var(--ink-3);font-variant-numeric:tabular-nums}
.btnrow{display:flex;gap:10px;margin-top:16px}
.btn2{flex:1;height:52px;border-radius:16px;font-weight:700;background:var(--glass-soft);border:1px solid var(--edge-2)}
.btn2.danger{background:var(--bad);color:#fff;border:0}

/* v1.6: Vorlesungsfolien */
.more>svg:not(.chev){width:17px;height:17px;flex:none}.more{white-space:nowrap}
.folview{position:fixed;inset:0;z-index:70;background:#0b0c10;display:flex;flex-direction:column;color:#fff}
.folview[hidden]{display:none}
.folhead{display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px}
.folhead .t{flex:1;min-width:0}.folhead b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.folhead small{color:rgba(255,255,255,.65);font-size:12.5px}
.folhead button{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center;color:#fff;flex:none}
.folhead button svg{width:18px;height:18px}
.folimg{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y pinch-zoom}
.folimg img{width:100%;max-width:1400px;height:auto;display:block;background:#fff;border-radius:6px}
.folimg.zoom{align-items:flex-start;justify-content:flex-start}.folimg.zoom img{width:230%;max-width:none}
.folnav{display:flex;gap:10px;padding:10px 14px calc(14px + env(safe-area-inset-bottom,0px))}
.folnav button{flex:1;height:48px;border-radius:14px;background:rgba(255,255,255,.14);color:#fff;font-weight:700}
.folnav button:disabled{opacity:.35}
.folrow{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:11px 2px;border-top:1px solid var(--hair)}
.folrow .nr{font-size:12px;font-weight:750;color:var(--ink-3);min-width:56px;font-variant-numeric:tabular-nums}
.folrow b{flex:1;font-weight:600;font-size:14.5px}
/* v1.6: Formeln, Plan, Probeklausur, Schwachstellen */
.fsearch{width:100%;height:46px;border-radius:14px;padding:0 14px;font:inherit;font-size:16px;color:var(--ink);background:var(--glass-soft);border:1px solid var(--edge-2);outline:none;margin:4px 0 10px}
.fsearch:focus{border-color:var(--accent)}
.fchips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:4px;scrollbar-width:none}
.fchips button{flex:none;padding:7px 11px;border-radius:99px;font-size:13px;font-weight:650;background:var(--glass-soft);border:1px solid var(--edge-2)}
.fchips button.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.fgrp{margin:16px 0 4px;font-size:13px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em}
.fitem{padding:12px 2px;border-top:1px solid var(--hair)}
.fitem b{display:block;font-size:15px;margin-bottom:4px}
.fx{font-size:15.5px;font-weight:600;padding:9px 12px;border-radius:12px;background:color-mix(in srgb,var(--c,var(--accent)) 10%,transparent);font-variant-numeric:tabular-nums;line-height:1.5;word-break:break-word}
.fitem p{margin:6px 0 0;font-size:13.5px;color:var(--ink-2);line-height:1.45}
.plan{border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:10px}
.prow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.prow .t b{font-size:15px}.prow .t small{display:block;color:var(--ink-3);font-size:12.5px}
.prow .n{font-weight:750;font-variant-numeric:tabular-nums}
.pbar{grid-column:2/4;height:6px;border-radius:9px;background:var(--hair);overflow:hidden}.pbar div{height:100%;border-radius:9px;background:var(--c)}
.optrow{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}
.optrow button{padding:9px 13px;border-radius:99px;font-size:14px;font-weight:650;background:var(--glass-soft);border:1px solid var(--edge-2)}
.optrow button.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.qtimer{font-variant-numeric:tabular-nums}
.qtimer.low{color:var(--bad)}
.opt.sel{outline:2px solid var(--accent);outline-offset:-2px}
.ttable{width:100%;border-collapse:collapse;font-size:14px}
.ttable td{padding:8px 4px;border-top:1px solid var(--hair)}.ttable td:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:650}
.rexp{font-size:13.5px;color:var(--ink-2);margin-top:4px}
.rexp summary{color:var(--accent);font-weight:650;cursor:pointer;list-style:none}
.weak .row small{color:var(--ink-3)}
/* v1.6: Selbst rechnen */
.calcbox{border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:10px;margin-top:12px}
.cin{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;padding:10px 12px;border-radius:14px;border:1.5px solid var(--edge-2);background:var(--glass-soft);font-variant-numeric:tabular-nums;text-align:left;width:100%}
.cin.on{border-color:var(--accent)}
.cin.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent)}
.cin.shown{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,transparent)}
.cin .cl{font-weight:650;font-size:14.5px}
.cin .cv{font-size:17px;font-weight:600;min-height:22px;word-break:break-all}
.cin .cv.ph{color:var(--ink-3);font-weight:500}
.cin .cu{color:var(--ink-2);font-size:14px}
.cprev{font-size:13px;color:var(--ink-3);margin:-4px 4px 0;min-height:16px;font-variant-numeric:tabular-nums}
.cmsg{font-size:14px;line-height:1.45;padding:8px 12px;border-radius:12px;background:var(--glass-soft)}
.cmsg.no{background:var(--bad-soft);color:var(--ink)}
.cmsg.ok{background:color-mix(in srgb,var(--ok) 14%,transparent)}
.cmsg b{font-weight:650}
.keys{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.keys button{height:44px;border-radius:12px;background:var(--glass-soft);border:1px solid var(--edge-2);font-size:16px;font-weight:600;color:var(--ink)}
.keys button.fn{font-size:13.5px;color:var(--ink-2)}
.keys button.op{color:var(--accent)}
.keys button.wide{grid-column:span 2}
.cvals{display:flex;flex-wrap:wrap;gap:6px}
.cvals button{font-size:12.5px;padding:6px 9px;border-radius:99px;background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent);font-weight:650;font-variant-numeric:tabular-nums}
.modebtn{display:flex;gap:14px;align-items:center;width:100%;text-align:left;padding:14px;border-radius:18px;margin-top:10px}
.modebtn b{display:block;font-size:16px}.modebtn small{color:var(--ink-2);font-size:13.5px;line-height:1.4}
.modebtn .round{background:var(--glass-soft)}
/* v1.6: Reihenfolge per Ziehen */
.pchip,.slot.filled{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.ghost{position:fixed;z-index:50;pointer-events:none;margin:0;opacity:.96;transform:scale(1.04);box-shadow:0 14px 34px rgba(0,0,0,.28);transition:none}
.lift{opacity:.3}
.slot.over{border-color:var(--c);border-style:solid;background:color-mix(in srgb,var(--c) 10%,transparent)}

function hash(s){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return (h>>>0).toString(36)}
FRAGEN.forEach(q => q.id = q.f + "-" + hash(q.q + (q.a ? q.a[0] : "") + (q.steps ? q.steps[0] : "") + (q.pairs ? q.pairs[0][0] : "")));
/* v1.2: Umformulierungen und Bilder nach der ID-Vergabe anwenden (Lernstand bleibt) */
if (typeof EXTRA !== "undefined") FRAGEN.forEach(q => { const x = EXTRA[q.q]; if (x) Object.assign(q, x); });
/* v1.4: Korrekturen nach Frage-ID (Text, Typ, Antworten, Erklärung) – Lernstand bleibt */
if (typeof KORREKTUR !== "undefined") FRAGEN.forEach(q => { const x = KORREKTUR[q.id]; if (x) Object.assign(q, x); });
if (typeof ORDNE_ZU !== "undefined") FRAGEN.forEach(q => { if (q.q === "Ordne zu.") { const k = q.f === "binf" ? (q.pairs[0][0] === "JDK" ? "binf_tools" : "binf_typ") : q.f; if (ORDNE_ZU[k]) q.q = ORDNE_ZU[k]; } });
const BYID = Object.fromEntries(FRAGEN.map(q => [q.id, q]));
/* v1.3: Lösungsweg-Aufgaben */
const AUFG = typeof AUFGABEN !== "undefined" ? AUFGABEN : [];
const ABYID = Object.fromEntries(AUFG.map(a => [a.id, a]));
/* v1.5: Korrekturen auch für Aufgaben; „weg: true“ entfernt eine Frage oder Aufgabe ganz */
if (typeof KORREKTUR !== "undefined") AUFG.forEach(a => { const x = KORREKTUR[a.id]; if (x) Object.assign(a, x); });
const ALLQ = FRAGEN.filter(q => !q.weg), ALLA = AUFG.filter(a => !a.weg);

/* storage */
const APP_VERSION = "1.5";
const KEY = "klausurduell.v1";
let S = {cards:{}, days:{}, aufg:{}};
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch(e) {}
if(!S.aufg) S.aufg = {};
if(!S.notes) S.notes = []; if(!S.hide) S.hide = {}; if(!S.df) S.df = {};
/* v1.5: ausgeblendete Fragen/Aufgaben aus allen Listen nehmen (Lernstand bleibt erhalten) */
function applyHidden(){ FRAGEN.length = 0; ALLQ.forEach(q => { if(!S.hide[q.id]) FRAGEN.push(q); }); AUFG.length = 0; ALLA.forEach(a => { if(!S.hide[a.id]) AUFG.push(a); }); }
applyHidden();
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} }
const dayKey = (d=new Date()) => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const dayNum = (d=new Date()) => Math.floor((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()))/864e5);
const today = () => S.days[dayKey()] || {n:0,r:0};
function card(id){ return S.cards[id]; }
function boxOf(id){ const c = card(id); return c ? c.b : 0; }
function isDue(id){ const c = card(id); return c && c.due <= dayNum(); }
function streak(){
  let n=0; const d=new Date();
  if(!(S.days[dayKey(d)]||{}).n) d.setDate(d.getDate()-1);
  while((S.days[dayKey(d)]||{}).n){ n++; d.setDate(d.getDate()-1); }
  return n;
}
function tDue(id){ const c = S.aufg[id]; return c && c.due <= dayNum(); }
function nextTask(not){
  const pool = AUFG.filter(a => a.id !== not);
  const due = pool.filter(a => tDue(a.id)).sort((x,y) => S.aufg[x.id].b - S.aufg[y.id].b);
  if (due.length) return due[0];
  const fresh = pool.filter(a => !S.aufg[a.id]);
  if (fresh.length) { const lastF = not && ABYID[not] ? ABYID[not].f : null; const other = fresh.filter(a => a.f !== lastF); return (other.length ? other : fresh)[0]; }
  return pool.slice().sort((x,y) => S.aufg[x.id].due - S.aufg[y.id].due)[0] || null;
}
function tStatus(a){
  const c = S.aufg[a.id];
  if (!c) return `<span class="st new">Neu</span>`;
  if (tDue(a.id)) return `<span class="st due">Fällig</span>`;
  return `<span class="st${c.best>=1?" ok":""}">${Math.round(c.best*100)} %</span>`;
}
const tMin = a => Math.max(2, Math.round(a.schritte.length * .6));
function mastery(list){ if(!list.length) return 0; return list.reduce((a,q)=>a+boxOf(q.id),0)/(list.length*5); }
const qsOf = f => FRAGEN.filter(q => q.f === f);
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]} return a; }
function wrongNow(){ return FRAGEN.filter(q => { const c=card(q.id); return c && c.last===false; }); }
function interleave(list){
  const g={}; list.forEach(q=>(g[q.f]=g[q.f]||[]).push(q));
  const keys=shuffle(Object.keys(g)); const out=[];
  while(out.length<list.length) keys.forEach(k=>{ if(g[k].length) out.push(g[k].shift()); });
  return out;
}
function buildSession(pool, n){
  const due = shuffle(pool.filter(q=>isDue(q.id))).sort((a,b)=>boxOf(a.id)-boxOf(b.id));
  const fresh = shuffle(pool.filter(q=>!card(q.id)));
  let set = due.slice(0, Math.ceil(n*.6));
  set = set.concat(fresh.slice(0, n-set.length));
  if (set.length < n) set = set.concat(due.slice(set.length).slice(0, n-set.length));
  if (set.length < n) { const rest = shuffle(pool.filter(q=>!set.includes(q))).sort((a,b)=>boxOf(a.id)-boxOf(b.id)); set = set.concat(rest.slice(0, n-set.length)); }
  return interleave(set.slice(0,n));
}

/* ring */
function ring(p, size, w, colorA, colorB, inner){
  const r=(size-w)/2, c=2*Math.PI*r, id="g"+Math.random().toString(36).slice(2,7);
  return `<div class="ring" style="width:${size}px;height:${size}px"><svg viewBox="0 0 ${size} ${size}"><defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:${colorA}"/><stop offset="1" style="stop-color:${colorB}"/></linearGradient></defs>
  <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" style="stroke:var(--hair)" stroke-width="${w}"/>
  <circle class="arc" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="url(#${id})" stroke-width="${w}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c}" data-off="${c*(1-Math.min(1,Math.max(0,p)))}" style="transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)"/></svg>
  <div class="num">${inner}</div></div>`;
}
function animateRings(root=document){ requestAnimationFrame(()=>requestAnimationFrame(()=>root.querySelectorAll(".arc").forEach(a=>a.style.strokeDashoffset=a.dataset.off))); }
const icon = (f, sm) => `<div class="ico${sm?" sm":""}" style="--c:${cssC(f)}">${SVG(ICON[f],1.8)}</div>`;

/* views */

const DAYS = ["So","Mo","Di","Mi","Do","Fr","Sa"];
const MONTHS = ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];

    </div>
    <button class="cta press" data-act="start-mix">${I.play}Training starten · 10 Fragen</button>
    <div class="tiles">
      <button class="tile glass press" data-act="start-wrong" ${w?"":"disabled style='opacity:.55'"}><div class="round" style="background:var(--bad-soft);color:var(--bad)">${I.redo}</div><div><b>Fehler wiederholen</b><br><span>${w ? `${w} ${w===1?"Frage":"Fragen"} offen` : "Gerade nichts offen"}</span></div></button>
      <button class="tile glass press" data-act="start-quick"><div class="round" style="background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)">${I.bolt}</div><div><b>Schnelle Runde</b><br><span>5 Fragen, gemischt</span></div></button>
      <button class="tile glass press" data-act="exam"><div class="round" style="background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)">${I.clock}</div><div><b>Probeklausur</b><br><span>Mit Zeitlimit, Auswertung am Ende</span></div></button>

    </div>
    ${planCard()}
    ${weakCard(3)}
    ${AUFG.length ? `<div class="sec"><div class="sec-h"><h2>Lösungsweg</h2><small>${AUFG.length} Aufgaben</small></div>${taskFeature(nextTask())}</div>` : ""}
    <div class="sec"><div class="sec-h"><h2>Deine Fächer</h2><small>${FRAGEN.length} Fragen</small></div>${subjectList()}</div>
  </div>`;
}
function taskFeature(a){
  if(!a) return "";
  const c = S.aufg[a.id];
  return `<button class="feature glass press" data-act="task" data-id="${a.id}">${icon(a.f)}<div class="t"><span class="eyebrow">${c ? (tDue(a.id) ? "Wiederholen" : "Nochmal üben") : "Neue Aufgabe"}</span><b>${esc(a.titel)}</b><small>${FACH[a.f].n} · ${a.schritte.length} Schritte · ca. ${tMin(a)} Min.</small></div><span class="round">${I.play}</span></button>`;
}
function taskRow(a){
  return `<button class="row press" data-act="task" data-id="${a.id}"><div class="t"><b>${esc(a.titel)}</b><small>${esc(a.s)} · ${a.schritte.length} Schritte</small></div>${tStatus(a)}${I.chev}</button>`;
}
function vAufgaben(){
  const solved = AUFG.filter(a => S.aufg[a.id]).length;
  const fs = ORDER.filter(f => AUFG.some(a => a.f === f));
  return `<div class="view">
    <div class="head"><div><div class="eyebrow">Lösungsweg-Trainer</div><h1>Aufgaben</h1></div><div class="chip glass">${solved}/${AUFG.length} gelöst</div></div>
    <p class="legend" style="margin:-12px 4px 0">Übungsaufgaben Schritt für Schritt: Bei jedem Schritt wählst du aus vier Möglichkeiten, was du als Nächstes tun würdest. Die Zwischenergebnisse rechnet die App vor – du entscheidest nur den Weg. Falsch gewählt? Dann gibt es eine Erklärung und einen zweiten Versuch.</p>
    ${AUFG.length ? taskFeature(nextTask()) : `<div class="panel glass"><p class="empty">Noch keine Aufgaben vorhanden.</p></div>`}
    ${fs.map(f => { const l = AUFG.filter(a => a.f === f); return `<div class="sec"><div class="sec-h"><h2 style="display:flex;align-items:center;gap:10px">${icon(f,true)}${FACH[f].n}</h2><small>${l.length} ${l.length===1?"Aufgabe":"Aufgaben"}</small></div><div class="list glass">${l.map(taskRow).join("")}</div></div>`; }).join("")}
  </div>`;
}
function subjectList(){
  return `<div class="list glass">${ORDER.map(f=>{const qs=qsOf(f), m=mastery(qs);
    return `<button class="row press" data-act="subject" data-f="${f}">${icon(f)}<div class="t"><b>${FACH[f].n}</b><small>${qs.length} Fragen · ${FACH[f].k}</small><div class="bar" style="--c:${cssC(f)}"><div style="width:${Math.round(m*100)}%"></div></div></div><span class="pct">${Math.round(m*100)} %</span>${I.chev}</button>`}).join("")}</div>`;
}
function vFaecher(){
  return `<div class="view">
    <div class="head"><div><div class="eyebrow">Wintersemester 26/27</div><h1>Fächer</h1></div></div>
    <p class="legend" style="margin:-12px 4px 0">Tippe ein Fach an, um nach Thema zu üben. Die Fragen sind zum Merken gedacht – Begriffe, Zusammenhänge und das Vorgehen bei Rechenwegen. Selbst rechnen kannst du freiwillig bei den Lösungsweg-Aufgaben.</p>
    ${subjectList()}
    <button class="row glass press" style="border-radius:22px;border:0" data-act="formeln"><div class="round" style="background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok);width:36px;height:36px">${I.sigma}</div><div class="t"><b>Formelsammlung</b><small>${FORM.length} Formeln aus allen Fächern, durchsuchbar</small></div>${I.chev}</button>
    <div class="sec"><div class="sec-h"><h2>Fragetypen</h2></div>
      <div class="list glass">${[["mc","Auswahl","Eine von vier Antworten ist richtig."],["wf","Wahr oder falsch","Eine Aussage prüfen."],["ord","Reihenfolge","Schritte eines Vorgehens ordnen."],["pair","Zuordnen","Begriffe und Bedeutungen verbinden."]].map(([t,n,d])=>`<div class="row"><div class="round" style="background:var(--glass-soft);width:36px;height:36px"><b style="font-size:13px">${FRAGEN.filter(q=>q.typ===t).length}</b></div><div class="t"><b>${n}</b><small>${d}</small></div></div>`).join("")}<button class="row press" data-tab="aufgaben"><div class="round" style="background:var(--glass-soft);width:36px;height:36px"><b style="font-size:13px">${AUFG.length}</b></div><div class="t"><b>Lösungsweg</b><small>Eine Übungsaufgabe Schritt für Schritt lösen.</small></div>${I.chev}</button></div></div>
  </div>`;
}
function vStand(){
  const seen = FRAGEN.filter(q=>card(q.id)).length, all = FRAGEN.length;
  let tr=0, tw=0; Object.values(S.cards).forEach(c=>{tr+=c.r||0; tw+=c.w||0;});
  const acc = tr+tw ? Math.round(tr/(tr+tw)*100) : 0;
  const m = mastery(FRAGEN);
  const box = [0,0,0,0,0,0]; FRAGEN.forEach(q=>box[boxOf(q.id)]++);
  const wk=[]; for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);wk.push({l:DAYS[d.getDay()],n:(S.days[dayKey(d)]||{}).n||0,t:i===0});}
  const mx = Math.max(GOAL, ...wk.map(x=>x.n));
  return `<div class="view">
    <div class="head"><div><div class="eyebrow">Auf diesem Gerät</div><h1>Lernstand</h1></div></div>
    <div class="hero glass">${ring(m,118,13,"#7fe0ff","var(--accent)",`<b>${Math.round(m*100)}</b><span>Prozent</span>`)}
      <div class="hero-t"><span class="lbl">Beherrscht insgesamt</span><span class="big">${seen ? `${seen} von ${all} Fragen schon gesehen` : "Noch keine Frage beantwortet"}</span>
</div><p class="legend" style="grid-column:1/-1;margin:0">Jede richtige Antwort schiebt eine Frage eine Lernstufe weiter, sie kommt dann seltener. Falsch beantwortete Fragen kommen sofort wieder.</p></div>
    <div class="statgrid"><div class="stat glass"><b>${streak()}</b><span>Tage in Folge</span></div><div class="stat glass"><b>${tr+tw}</b><span>Antworten</span></div><div class="stat glass"><b>${acc}<small style="font-size:15px"> %</small></b><span>Trefferquote</span></div></div>
    <div class="panel glass"><div class="sec-h" style="padding:0"><h2>Letzte 7 Tage</h2><small>Ziel ${GOAL}</small></div>
      <div class="week">${wk.map(x=>`<div class="col${x.t?" today":""}"><div class="b" style="height:100%"><div style="height:${Math.round(x.n/mx*100)}%"></div></div><span>${x.l}</span></div>`).join("")}</div></div>
    <div class="panel glass"><div class="sec-h" style="padding:0"><h2>Lernstufen</h2><small>${all} Fragen</small></div>
      <div class="boxes">${box.map((n,i)=>`<div class="boxrow"><span>${BOXNAME[i]}</span><div class="bar"><div style="width:${n/all*100}%;background:${i===0?"var(--ink-3)":`color-mix(in srgb, var(--accent) ${40+i*12}%, #7fe0ff)`}"></div></div><span>${n}</span></div>`).join("")}</div></div>
    ${AUFG.length ? (()=>{ const runs = AUFG.filter(a=>S.aufg[a.id]); const avg = runs.length ? runs.reduce((x,a)=>x+S.aufg[a.id].best,0)/runs.length : 0; const ok = runs.filter(a=>S.aufg[a.id].best>=1).length;

      <div class="boxrow"><span>Fehlerfrei</span><div class="bar"><div style="width:${ok/AUFG.length*100}%;background:var(--ok)"></div></div><span>${ok}</span></div></div>
      <p class="legend" style="margin:0">Im Schnitt ${Math.round(avg*100)} % der Schritte im besten Durchgang richtig. Ein Schritt zählt voll, wenn er im ersten Versuch sitzt, halb im zweiten.</p></div>`; })() : ""}
    ${weakCard(5)}
    <div class="sec"><div class="sec-h"><h2>Nach Fach</h2></div>${subjectList()}</div>
    <div class="panel glass"><div class="sec-h" style="padding:0"><h2>Vorlesungsfolien</h2><small>${FOL ? `${FOL.folien.length} Folien · Stand ${esc(FOL.erstellt)}` : "nicht geladen"}</small></div>
      <p class="legend" style="margin:0">${FOL ? "Ausgewählte Schlüsselfolien liegen auf diesem Gerät. Nach einer Frage erscheint „Folie ansehen“, wenn es eine passende Folie gibt; alle Folien findest du im Fach unter „Vorlesungsfolien“." : "Ausgewählte Schlüsselfolien aus den Vorlesungen, verschlüsselt abgelegt. Einmal mit deinem Passwort laden – danach liegen sie nur auf diesem Gerät und funktionieren auch offline."}</p>
      <div class="btnrow" style="margin-top:0">${FOL ? `<button class="btn2 press" data-act="fol-gal" data-f="">Alle Folien</button><button class="btn2 press" data-act="fol-load">Aktualisieren</button>` : `<button class="btn2 acc press" data-act="fol-load">Folien laden</button>`}</div></div>

      <div class="btnrow" style="margin-top:0"><button class="btn2 press" data-act="notes">Verwalten</button>${o ? `<button class="btn2 acc press" data-act="nsend">Senden (${o})</button>` : `<button class="btn2 press" data-act="note-app">Neue Anmerkung</button>`}</div></div>`; })()}
    <div class="panel glass"><div class="sec-h" style="padding:0"><h2>Daten sichern</h2><small>Version ${APP_VERSION}</small></div>
      <p class="legend" style="margin:0">Dein Lernstand liegt nur auf diesem Gerät. Ein Backup kannst du in Dateien oder iCloud ablegen und auf einem neuen Gerät wieder einlesen.</p>
      <div class="btnrow" style="margin-top:0"><button class="btn2 press" data-act="export">Backup sichern</button><button class="btn2 press" data-act="import">Backup laden</button></div>

function render(){
  const app = $("#app");
  app.innerHTML = tab==="heute" ? vHeute() : tab==="faecher" ? vFaecher() : tab==="aufgaben" ? vAufgaben() : vStand();

  animateRings(app);
}

/* sheet */
/* v1.4: Blatt mit Schließen-Knopf, Wischen nach unten und gesperrtem Hintergrund */
let lockY = 0;
function lockPage(){ if(document.body.classList.contains("locked")) return; lockY = window.scrollY; document.body.style.top = -lockY+"px"; document.body.classList.add("locked"); }
function unlockPage(){ if(!document.body.classList.contains("locked")) return; document.body.classList.remove("locked"); document.body.style.top = ""; window.scrollTo(0, lockY); }
function openSheet(html){
  const sh=$("#sheet"), sc=$("#scrim"); sh.innerHTML='<div class="grab"></div><button class="sx press" data-act="close" aria-label="Schließen">'+I.close+'</button>'+html; sh.hidden=false; sc.hidden=false;
  sh.scrollTop=0; sh.style.transform=""; delete sh.dataset.kind; lockPage();
  requestAnimationFrame(()=>{sh.classList.add("show"); sc.classList.add("show");});
}
function closeSheet(){
  const sh=$("#sheet"), sc=$("#scrim"); if(sh.hidden) return;
  sh.classList.remove("drag"); sh.style.transform=""; sh.classList.remove("show"); sc.classList.remove("show"); sc.style.opacity="";
  unlockPage();
  setTimeout(()=>{ if(!sh.classList.contains("show")){ sh.hidden=true; sc.hidden=true; } },420);
}
(() => {
  const sh = document.getElementById("sheet"), sc = document.getElementById("scrim");
  let y0 = null, t0 = 0, dy = 0, drag = false;
  sh.addEventListener("touchstart", e => { if (sh.scrollTop > 0 || e.target.closest("textarea,input")) { y0 = null; return; } y0 = e.touches[0].clientY; t0 = Date.now(); dy = 0; drag = false; }, {passive:true});

function folStep(d){ if (!FV) return; const n = FV.i + d; if (n < 0 || n >= FV.list.length) return; FV.i = n; folDraw(); }
function folClose(){ const el = $("#folview"); if (el) { el.hidden = true; el.innerHTML = ""; } if (FV && FV.url) URL.revokeObjectURL(FV.url); FV = null; }
document.addEventListener("click", e => { const b = e.target.closest("#folview [data-act]"); if (!b) return; e.stopPropagation(); const a = b.dataset.act;
  if (a === "fol-close") folClose(); else if (a === "fol-prev") folStep(-1); else if (a === "fol-next") folStep(1); else if (a === "fol-zoom") $("#folimg").classList.toggle("zoom"); }, true);

function folLoadSheet(){
  openSheet(`<h2>Vorlesungsfolien laden</h2><p class="sub">Das Folienpaket liegt verschlüsselt bei GitHub. Mit deinem Passwort wird es einmal geladen, entschlüsselt und auf diesem Gerät gespeichert (etwa 10 MB).</p>
    <input id="folpw" class="ntoken" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Passwort">

async function folDecrypt(buf, pw){
  const u = new Uint8Array(buf); if (String.fromCharCode(...u.slice(0,4)) !== "KDF1") throw new Error("format");
  const salt = u.slice(4,20), iv = u.slice(20,32), ct = u.slice(32);
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw.toLowerCase().replace(/\s/g,"")), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt, iterations:250000, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  return new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM", iv}, key, ct));
}
async function folLoad(fileBuf){
  const pw = ($("#folpw") && $("#folpw").value || "").trim(), st = t => { const e = $("#folstat"); if (e) e.textContent = t; };
  if (!pw) { toast("Bitte erst das Passwort eingeben"); return; }
  if (!window.crypto || !crypto.subtle) { st("Entschlüsseln geht nur in der installierten App (https)."); return; }
  try {
    let buf = fileBuf;
    if (!buf) { st("Lade Folienpaket …"); const r = await fetch(FOL_URL, {cache:"no-store"}); if (!r.ok) throw new Error("net"); buf = await r.arrayBuffer(); }
    st("Entschlüssele …");
    let p; try { p = await folDecrypt(buf, pw); } catch(e) { st(e.message === "format" ? "Das ist kein Klausurduell-Folienpaket." : "Passwort stimmt nicht."); return; }
    if (String.fromCharCode(...p.slice(0,4)) !== "KDFP") throw new Error("inhalt");
    const ml = new DataView(p.buffer, p.byteOffset + 4, 4).getUint32(0, true), meta = JSON.parse(new TextDecoder().decode(p.slice(8, 8 + ml))), base = 8 + ml;
    st("Speichere " + meta.folien.length + " Folien …");
    const d = await idb();
    await new Promise((res, rej) => { const tx = d.transaction(["img","meta"], "readwrite"); const im = tx.objectStore("img"); im.clear();
      meta.folien.forEach(x => im.put(new Blob([p.slice(base + x.o, base + x.o + x.n)], {type:"image/webp"}), x.id));
      const m = {...meta, folien: meta.folien.map(({o, n, ...r}) => r)}; tx.objectStore("meta").put(m, "pack"); tx.oncomplete = () => { FOL = m; res(); }; tx.onerror = () => rej(tx.error); });

  } catch(e) { st(e.message === "net" ? "Folienpaket nicht erreichbar – bist du online?" : "Laden fehlgeschlagen. Bitte noch einmal versuchen."); }
}
async function folDelete(){
  try { const d = await idb(); await new Promise(res => { const tx = d.transaction(["img","meta"], "readwrite"); tx.objectStore("img").clear(); tx.objectStore("meta").clear(); tx.oncomplete = res; }); } catch(e) {}
  FOL = null; FOLQ = {}; closeSheet(); toast("Folien gelöscht"); if (!Q && !A) render();

  C.ans = v;
  const tol = it.x.t !== undefined ? it.x.t : .02;
  if (Math.abs(v - w) <= Math.max(tol * Math.abs(w), .006)) {
    it.st = "ok"; it.mt = "ok"; it.score = [1, .75, .5][it.hint] ?? .5; it.msg = `<b>Stimmt.</b> ${it.x.h ? esc(it.x.h) + " = " : ""}${fmtNum(w)} ${esc(it.x.u||"")}`; haptic(true); calcAdvance(); return;
  }
  it.tries++; haptic(false);
  const ratio = w !== 0 ? v / w : 0, lg = Math.log10(Math.abs(ratio));
  let tip;
  if (w !== 0 && Math.abs(Math.abs(ratio) - 1) < .03 && ratio < 0) tip = "Der Betrag stimmt, aber das Vorzeichen nicht.";
  else if (w !== 0 && Math.abs(lg - Math.round(lg)) < .02 && Math.round(lg) !== 0) tip = `Um den Faktor 10${Math.round(lg) > 0 ? "" : "⁻"}${["","","²","³","⁴","⁵","⁶"][Math.abs(Math.round(lg))] || "^" + Math.abs(Math.round(lg))} daneben – prüf Einheiten und Kommastellen.`;
  else tip = v > w ? "Dein Ergebnis ist zu groß." : "Dein Ergebnis ist zu klein.";
  it.mt = "no"; it.msg = `<b>Noch nicht:</b> ${fmtNum(v)}. ${tip}${it.tries >= 2 && it.hint === 0 ? " Tipp: Hol dir einen Hinweis." : ""}`;
  drawCalc();
}
function calcHint(){
  const C = A.c, it = C.items[C.cur]; if (!it || it.st !== "open") return;
  const st = A.a.schritte[A.i];
  it.mt = "";
  if (it.hint === 0) { it.hint = 1; it.msg = `<b>Hinweis:</b> ${esc(st.o[0][0])}.${A.a.geg && A.a.geg.length ? " Die Werte stehen oben unter „Gegeben“." : ""}`; }
  else if (it.hint === 1) { it.hint = 2; it.msg = `<b>So geht’s:</b> ${esc(it.x.l)} = ${esc(it.x.h || "")}`; }
  else { it.st = "shown"; it.score = 0; it.msg = `<b>Lösung:</b> ${esc(it.x.l)} = ${it.x.h ? esc(it.x.h) + " = " : ""}${fmtNum(it.x.w)} ${esc(it.x.u||"")}`; calcAdvance(); return; }
  drawCalc();
}
function calcAdvance(){
  const C = A.c, it = C.items[C.cur];
  C.vals.push({l: it.x.l, w: it.x.w}); A.cs.push(it.score);
  const nx = C.items.findIndex(x => x.st === "open");
  if (nx >= 0) { C.cur = nx; drawCalc(); return; }
  C.done = true; drawCalc();
  $("#qfoot").innerHTML = `<button class="cta press" data-act="a-next">${A.i < A.a.schritte.length-1 ? "Nächster Schritt" : "Lösung ansehen"}</button>`;
  setTimeout(()=>{ const b=$("#qbody"); b.scrollTo({top:b.scrollHeight, behavior:"smooth"}); }, 60);
}

/* v1.6: Reihenfolge per Ziehen (Tippen funktioniert weiter) */
let dropT = 0;
(() => {
  let d = null;
  const clear = () => document.querySelectorAll(".slot.over").forEach(s => s.classList.remove("over"));
  document.addEventListener("pointerdown", e => {
    if (!Q || !Q.state || Q.state.done || !Q.state.slots || $("#quiz").hidden) return;
    const el = e.target.closest("#pool .pchip, #slots .slot.filled"); if (!el) return;
    d = {el, id:e.pointerId, x:e.clientX, y:e.clientY, from: el.classList.contains("pchip") ? "pool" : "slot", k:+el.dataset.k, g:null};
  });
  document.addEventListener("pointermove", e => {
    if (!d || e.pointerId !== d.id) return;
    if (!d.g) {
      if (Math.hypot(e.clientX - d.x, e.clientY - d.y) < 8) return;
      const r = d.el.getBoundingClientRect(), g = d.el.cloneNode(true);
      g.classList.add("ghost"); g.classList.remove("press"); g.style.width = r.width + "px"; g.style.left = r.left + "px"; g.style.top = r.top + "px";
      $("#quiz").appendChild(g); d.g = g; d.dx = e.clientX - r.left; d.dy = e.clientY - r.top; d.el.classList.add("lift");
    }
    e.preventDefault();
    d.g.style.left = (e.clientX - d.dx) + "px"; d.g.style.top = (e.clientY - d.dy) + "px";
    clear(); const t = document.elementFromPoint(e.clientX, e.clientY), s = t && t.closest("#slots .slot"); if (s) s.classList.add("over");
  }, {passive:false});
  const end = e => {
    if (!d || e.pointerId !== d.id) return;
    const dd = d; d = null; if (!dd.g) return;
    dd.g.remove(); dd.el.classList.remove("lift"); clear(); dropT = Date.now();
    if (!Q || !Q.state || Q.state.done || e.type !== "pointerup") { drawOrd(); return; }
    const st = Q.state, t = document.elementFromPoint(e.clientX, e.clientY);
    const s = t && t.closest("#slots .slot"), inPool = t && t.closest("#pool");
    const item = dd.from === "pool" ? st.pool[dd.k] : st.slots[dd.k]; if (!item) return;
    if (s) {
      const to = +s.dataset.k, old = st.slots[to];
      if (dd.from === "pool") { st.pool.splice(dd.k, 1); if (old) st.pool.push(old); st.slots[to] = item; }
      else if (to !== dd.k) { st.slots[to] = item; st.slots[dd.k] = old; }
      haptic(true);
    } else if (inPool && dd.from === "slot") { st.slots[dd.k] = null; st.pool.push(item); }
    drawOrd();
  };
  document.addEventListener("pointerup", end); document.addEventListener("pointercancel", end);
})();

  else if(a==="reset-yes"){ S={cards:{},days:{},aufg:{},aufgR:{},df:{},notes:S.notes,hide:S.hide}; save(); closeSheet(); render(); toast("Fortschritt zurückgesetzt"); }
  else if(a==="close") closeSheet();

  else if(a==="nmark"){ S.notes.forEach(n=>{ if(NPEND.includes(n.id)) n.sent=true; }); NPEND=[]; save(); toast("Als gesendet markiert"); notesSheet(); if(!Q && !A) render(); }
  else if(a==="ndel"){ S.notes=S.notes.filter(n=>n.id!==b.dataset.id); save(); notesSheet(); if(!Q && !A) render(); }
  else if(a==="nunhide"){ S.hide={}; save(); applyHidden(); toast("Alles wieder eingeblendet"); notesSheet(); if(!Q && !A) render(); }
  else if(a==="tok-setup") tokSheet();

  else if(a==="tok-del"){ setTok(""); toast("Schlüssel entfernt"); notesSheet(); }
  else if(a==="quit"||a==="done") endQuiz();
  else if(a==="task"){ if(Q){ $("#quiz").innerHTML=""; Q=null; } if(A){ A=null; } startTask(b.dataset.id); }
  else if(a==="task-go"){ if(Q){ $("#quiz").innerHTML=""; Q=null; } startTask(b.dataset.id, b.dataset.m==="calc"); }
  else if(a==="k"){ if(A && A.c) calcKey(b.dataset.k); }
  else if(a==="c-sel"){ if(A && A.c){ const j=+b.dataset.j; if(A.c.items[j].st==="open"){ A.c.cur=j; drawCalc(); } } }
  else if(a==="c-check"){ if(A && A.c) calcCheck(); }
  else if(a==="c-hint"){ if(A && A.c) calcHint(); }
  else if(a==="c-val"){ if(A && A.c) calcKey("val:"+b.dataset.v); }
  else if(a==="a-quit"||a==="a-done") endTask();
  else if(a==="a-opt"){ if(A && !A.res) aPick(+b.dataset.k); }
  else if(a==="a-next"){ if(A) aNext(); }
  else if(a==="a-again"){ if(A) startTask(A.a.id, A.calc); }
  else if(a==="next") next();
  else if(a==="again-wrong"){ const w=Q.wrong; startQuiz(shuffle(w),"Fehler wiederholen"); }
  else if(Q && !Q.state.done){
    const q=Q.list[Q.i];
    if(a==="mc" && Q.exam){ const k=+b.dataset.k; document.querySelectorAll(".opt").forEach((o,j)=>{o.disabled=true; if(j===k) o.classList.add("sel"); else o.classList.add("dim");}); Q.pick[Q.i]=Q.state.opts[k].t; record(Q.state.opts[k].ok); }
    else if(a==="wf" && Q.exam){ const v=b.dataset.v==="1"; document.querySelectorAll(".wf").forEach(o=>{o.disabled=true; o.classList.add(o===b?"sel":"dim");}); Q.pick[Q.i]=v?"Wahr":"Falsch"; record(v===q.c); }
    else if(a==="mc"){ const k=+b.dataset.k, ok=Q.state.opts[k].ok;
      document.querySelectorAll(".opt").forEach((o,j)=>{o.disabled=true; const oo=Q.state.opts[j]; if(oo.ok){o.classList.add("ok");o.querySelector(".k").innerHTML=I.check;} else if(j===k){o.classList.add("no");o.querySelector(".k").innerHTML=I.x;} else o.classList.add("dim");});
      record(ok); }
    else if(a==="wf"){ const v=b.dataset.v==="1", ok=v===q.c;
      document.querySelectorAll(".wf").forEach(o=>{o.disabled=true; const ov=o.dataset.v==="1"; if(ov===q.c) o.classList.add("ok"); else if(o===b) o.classList.add("no"); else o.classList.add("dim");});
      record(ok); }
    else if(a==="pick"){ const k=+b.dataset.k, i=Q.state.slots.indexOf(null); if(i<0) return; Q.state.slots[i]=Q.state.pool.splice(k,1)[0]; drawOrd(); }
    else if(a==="unpick"){ const k=+b.dataset.k, p=Q.state.slots[k]; if(p){ Q.state.slots[k]=null; Q.state.pool.push(p); drawOrd(); } }
    else if(a==="ord-check"){ const ok=Q.state.slots.every((p,k)=>p && p.k===k); if(!Q.exam){ Q.state.done=true; drawOrd(); Q.state.done=false; } record(ok); }
    else if(a==="pc"){ const st=Q.state, side=b.dataset.side, i=+b.dataset.i;
      if(!st.sel || st.sel.side===side){ st.sel={side,i}; drawPairs(); return; }
      const l = side==="R" ? st.L[st.sel.i] : st.L[i], r = side==="R" ? st.R[i] : st.R[st.sel.i];
      if(l.k===r.k || q.pairs[l.k][1]===q.pairs[r.k][1]){ st.matched[l.k]=true; st.mR[r.k]=l.k; st.sel=null; drawPairs(); haptic(true);
        if(Object.keys(st.matched).length===q.pairs.length){ record(st.miss===0); } }

    }
  }
});

  if(e.target.closest && e.target.closest("textarea,input")) return;
  if(FV && !$("#folview").hidden){ if(e.key==="Escape") folClose(); else if(e.key==="ArrowRight") folStep(1); else if(e.key==="ArrowLeft") folStep(-1); return; }
  if(!$("#sheet").hidden) { if(e.key==="Escape") closeSheet(); return; }
  if(A && !$("#quiz").hidden){
    if(e.key==="Escape"){ endTask(); return; }
    if(A.c && !A.c.done){ const m={"*":"×","/":"÷","-":"−",".":",",",":",","Backspace":"back","Enter":"check"}; const k=m[e.key] || (/^[0-9+()^]$/.test(e.key) ? e.key : null);

  }

async function exportBackup(){
  if(framed){ toast("Backup gibt es in der installierten App"); return; }
  const data = JSON.stringify({app:"klausurduell", version:APP_VERSION, saved:new Date().toISOString(), state:S});
  const name = `Klausurduell Backup ${dayKey()}.json`;
  try{
    const file = new File([data], name, {type:"application/json"});
    if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:"Klausurduell Backup"}); return; }
  }catch(e){ if(e && e.name==="AbortError") return; }
  try{ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([data],{type:"application/json"})); a.download=name; document.body.appendChild(a); a.click(); a.remove(); toast("Backup gespeichert"); }
  catch(e){ toast("Speichern hier nicht möglich"); }
}
