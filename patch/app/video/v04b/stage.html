<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<style>
  html,body{margin:0;overflow:hidden;background:#f5f3fb;font-family:Inter,sans-serif;color:#0f172a;width:1920px;height:1080px}
  #stage{position:absolute;inset:0}

  #box{position:absolute;left:70px;top:262px}

  #strip .hm{font-size:19px}
  #strip b{color:#5b3fb3}
  .hm{display:inline-grid;column-gap:.7em;row-gap:0;padding:.02em .45em;border-left:.12em solid #0f172a;border-right:.12em solid #0f172a;border-radius:.45em;vertical-align:middle;text-align:center;font-weight:700;line-height:1.22;margin:0 .15em}
  #bigwrap{position:absolute;left:110px;top:130px;width:1700px;box-sizing:border-box;background:#fff;border-radius:28px;padding:30px 50px;border:3px solid #ddd6fe;box-shadow:0 10px 40px rgba(91,63,179,.12);transform-origin:50% 0}
  .bigq{font-size:37px;line-height:1.55;font-weight:550}
  .bigq p{margin:0 0 18px}
  .bigq .hm{font-size:33px}
  .bigq b{color:#5b3fb3}
  .bigq span[style*="background"]{border-radius:8px;padding:0 4px}
  .qt{border-collapse:collapse;font-size:30px;margin:6px 0 18px}
  .qt td,.qt th{border:2px solid #cbd5e1;padding:6px 26px;text-align:center}
  .qt th{background:#f1f0fb;color:#5b3fb3}
  .ln{font-size:38px;line-height:1.3;margin:0 0 18px;font-weight:600}
  .ln.small{font-size:29px;font-weight:500;color:#334155}
  .ln.q{font-size:42px;font-weight:800}
  .ln.f{font-size:27px;font-weight:600;margin:0 0 10px;color:#1e293b}
  .hl{display:inline-block;background:#5b3fb3;color:#fff;border-radius:14px;padding:4px 18px}
  .ok{display:inline-block;background:#16a34a;color:#fff;border-radius:14px;padding:4px 18px}
  .warn{display:inline-block;background:#f59e0b;color:#fff;border-radius:14px;padding:4px 18px}
  .bad{display:inline-block;background:#dc2626;color:#fff;border-radius:14px;padding:4px 18px}
  .B{color:#2563eb;font-weight:800}.O{color:#ea580c;font-weight:800}.P{color:#5b3fb3;font-weight:800}.G{color:#16a34a;font-weight:800}.R{color:#dc2626;font-weight:800}
  #cap{position:absolute;left:50%;bottom:30px;transform:translateX(-50%);max-width:1500px;font-size:32px;padding:13px 30px;text-align:center;background:rgba(30,20,60,.9);color:#fff;font-weight:600;line-height:1.35;border-radius:20px}
  #cap em{font-style:normal;color:#c4b5fd;font-weight:800}
  .center{position:absolute;left:0;right:0;text-align:center}
  .pill{display:inline-block;margin-top:50px;background:#5b3fb3;color:#fff;font-size:40px;font-weight:750;padding:22px 44px;border-radius:999px}
  .road{display:flex;align-items:center;gap:18px;background:#fff;border:3px solid #ddd6fe;border-radius:20px;padding:12px 20px;margin:0 0 12px;font-size:30px;font-weight:700}
  .road i{font-style:normal;display:inline-flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:50%;background:#5b3fb3;color:#fff;font-size:26px}
</style></head><body><div id="stage"></div>
<script src="spec.js"></script>
<script>
const T0 = window.TIMING;
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
const lerp=(a,b,p)=>a+(b-a)*p;
let S,t,SP;
const ap=(k,d=.5,off=0)=>S.starts[k]===undefined?0:ease(clamp((t-S.starts[k]-off)/d));
const op=p=>`opacity:${p.toFixed(3)}`;
const ACC="#5b3fb3", BLUE="#2563eb", ORA="#ea580c", GRN="#16a34a", RED="#dc2626";
const FB=a=>`rgba(37,99,235,${a})`, FO=a=>`rgba(234,88,12,${a})`, FP=a=>`rgba(91,63,179,${a})`, FG=a=>`rgba(22,163,74,${a})`;
const DEFS=`<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0L10,5L0,10z" fill="context-stroke"/></marker></defs>`;
const nm=s=>String(s).replace(/_(\w)/g,'<tspan font-size="0.62em" dy="0.3em">$1</tspan>');
const TX=(x,y,s,o={})=>`<text x="${x}" y="${y}" font-size="${o.fs||34}" font-weight="${o.w||800}" text-anchor="${o.a||'middle'}" fill="${o.c||'#0f172a'}" ${o.st?`style="${o.st}"`:''}>${s}</text>`;
const tsp=(v,c)=>`<tspan fill="${c}">${v}</tspan>`;
const sp=(v,cls)=>`<span class="${cls}">${v}</span>`;
const fmt=n=>String(n).replace('-','−'); const par=n=>n<0?`(${fmt(n)})`:fmt(n);
const SUBS="₀₁₂₃₄₅₆₇₈₉"; const sb=s=>String(s).split('').map(ch=>SUBS[+ch]||ch).join('');
function curIdx(){ let ci=-1; S.starts.forEach((s,j)=>{ if(t>=s) ci=j; }); return ci; }
function sd(k){ return (k+1<S.starts.length?S.starts[k+1]:S.dur)-S.starts[k]; }
function pr(k,f=.85){ if(k<0||S.starts[k]===undefined||t<S.starts[k]) return 0; return clamp((t-S.starts[k])/Math.max(.4,sd(k)*f)); }
const L=(p,s,cls="ln")=>`<div class="${cls}" style="${op(p)}">${s}</div>`;
function mat(x,y,M,o={}){
  const r=M.length,c=M[0].length,cw=o.cw||86,ch=o.ch||70,fs=o.fs||40,W=c*cw,Hh=r*ch,b=12;
  let s=`<g style="${op(o.op===undefined?1:o.op)}">`;
  if(o.name) s+=TX(x-20,y+Hh/2+fs*.35,nm(o.name),{a:'end',c:ACC,fs:fs*1.05});
  s+=`<path d="M${x+b} ${y-6}H${x}V${y+Hh+6}H${x+b}M${x+W-b} ${y-6}H${x+W}V${y+Hh+6}H${x+W-b}" fill="none" stroke="#0f172a" stroke-width="4"/>`;
  for(let i=0;i<r;i++)for(let j=0;j<c;j++){
    const cx=x+j*cw+cw/2, cy=y+i*ch+ch/2, f=o.fill?o.fill(i,j):null, cov=o.cover?o.cover(i,j):0, cop=o.cell?o.cell(i,j):1;
    if(f) s+=`<rect x="${cx-cw/2+5}" y="${cy-ch/2+4}" width="${cw-10}" height="${ch-8}" rx="10" fill="${f}"/>`;
    if(o.ring&&o.ring(i,j)) s+=`<rect x="${cx-cw/2+3}" y="${cy-ch/2+2}" width="${cw-6}" height="${ch-4}" rx="10" fill="none" stroke="${o.ring(i,j)}" stroke-width="4"/>`;
    s+=`<text x="${cx}" y="${cy+fs*.36}" font-size="${fs}" font-weight="800" text-anchor="middle" fill="${o.color?o.color(i,j):'#0f172a'}" style="${op(cop*(1-0.8*cov))}">${M[i][j]}</text>`;
    if(cov>0) s+=`<rect x="${cx-cw/2+3}" y="${cy-ch/2+3}" width="${cw-6}" height="${ch-6}" rx="8" fill="#94a3b8" style="${op(.6*cov)}"/>`;
  }
  if(o.sep!==undefined) s+=`<path d="M${x+o.sep*cw} ${y}V${y+Hh}" stroke="${ACC}" stroke-width="3" stroke-dasharray="8 6"/>`;
  return s+`</g>`;
}
function signG(x,y,p=1,cw=56,hi=null,hp=0){let s=`<g style="${op(p)}">`;for(let i=0;i<3;i++)for(let j=0;j<3;j++){const pl=(i+j)%2==0;s+=`<rect x="${x+j*cw}" y="${y+i*cw}" width="${cw-6}" height="${cw-6}" rx="10" fill="${pl?'#dcfce7':'#fee2e2'}"/>`+TX(x+j*cw+(cw-6)/2,y+i*cw+cw*.62,pl?'+':'−',{c:pl?GRN:RED,fs:34});}
  if(hi) s+=`<rect x="${x+hi[1]*cw-4}" y="${y+hi[0]*cw-4}" width="${cw+2}" height="${cw+2}" rx="12" fill="none" stroke="${ACC}" stroke-width="5" style="${op(hp)}"/>`;
  return s+'</g>';}
function cofv(M,i,j){ const rr=[0,1,2].filter(r=>r!==i), cc=[0,1,2].filter(c=>c!==j); const a=M[rr[0]][cc[0]],b=M[rr[0]][cc[1]],c=M[rr[1]][cc[0]],d=M[rr[1]][cc[1]]; const m=a*d-b*c, s=(i+j)%2==0?1:-1; return {a,b,c,d,m,s,v:s*m,rr,cc}; }

/* ---------------- Renderer ---------------- */
const R={};
R.intro=()=>{ const card=(x,tt,sub,p,c)=>`<g style="${op(p)}"><rect x="${x}" y="80" width="290" height="230" rx="28" fill="#fff" stroke="${c}" stroke-width="5"/>${TX(x+145,180,tt,{fs:36,c})}${TX(x+145,240,sub,{fs:25,w:600,c:'#475569'})}</g>`;
  const box=card(20,"Beispiel","jeder Schritt",ap(1,.5),ACC)+card(355,"Aufgaben","1 · 2 · 3 · 4",ap(2,.5),BLUE)+card(690,"Extra","Knobel · Altklausur",ap(2,.5,1),ORA)
    +`<g style="${op(ap(3))}"><rect x="140" y="400" width="720" height="110" rx="55" fill="${ACC}"/>${TX(500,470,"Aufgabe immer oben sichtbar",{fs:40,c:'#fff'})}</g>`;
  const panel=L(ap(0),"Matrizenrechnung 2","ln q")+L(ap(0,.5,2),"Inverse bilden · LGS lösen","ln small")+L(ap(1),"1. ausführliches Beispiel")+L(ap(2),"2. alle Aufgaben, kurz")+L(ap(3),`<span class="hl">jede Zahl nachrechenbar</span>`);
  return {box,panel}; };
R.plan=(D)=>{ const M=D.M; const ns=ap(0,.6);
  let box=mat(260,40,M,{name:"A",cw:120,ch:90,fs:50,fill:(i,j)=>(i===0&&j===1)||(i===1&&j===0)?FO(.18*ns):null,color:(i,j)=>M[i][j].startsWith('−')&&ns>.5?RED:'#0f172a'})
    +`<g style="${op(ns)}">${TX(500,380,"a₁₂ = −1  ≠  a₂₁ = 1  →  nicht symmetrisch",{fs:32,c:ORA})}</g>`
    +`<g style="${op(ap(1))}">${TX(500,470,"Ziel:  A · A⁻¹ = I",{fs:46})}</g>`
    +`<g style="${op(ap(2))}"><rect x="210" y="510" width="580" height="96" rx="48" fill="${ACC}"/>${TX(500,575,"A⁻¹ = C′ / det A",{fs:46,c:'#fff'})}</g>`;
  const st=[["1","det A (Sarrus)"],["2","<span>Minoren m<sub>ij</sub></span>"],["3","Vorzeichen → C"],["4","transponieren → C′"],["5","durch det teilen → A⁻¹"],["✓","Probe: A · A⁻¹ = I"]];
  const panel=st.map(([n,s],k)=>`<div class="road" style="${op(ap(3,.4,k*.9))}"><i>${n}</i>${s}</div>`).join('');
  return {box,panel}; };
function sarDraw(x,y,M,pd,pu,ext,ad,au){ const E=M.map(r=>[...r,r[0],r[1]]), cw=96, ch=76;
  let s=mat(x,y,E,{cw,ch,fs:42,cell:(i,j)=>j>2?0.5*ext:1,fill:(i,j)=>{ if(ad>=0&&j===ad+i) return FB(.2); if(au>=0&&j===au+2-i) return FO(.2); return null; },
     color:(i,j)=>(ad>=0&&j===ad+i)?BLUE:(au>=0&&j===au+2-i)?ORA:'#0f172a'});
  s+=`<path d="M${x+3*cw} ${y-10}V${y+3*ch+10}" stroke="${ACC}" stroke-width="2" stroke-dasharray="6 6" style="${op(.6*ext)}"/>`;
  for(let k=0;k<3;k++){ const x0=x+k*cw+cw/2, y0=y+ch/2;
    const pp=clamp(pd*3-k); if(pp>0) s+=`<path d="M${x0-14} ${y0-14}L${x0-14+(2*cw+28)*pp} ${y0-14+(2*ch+28)*pp}" stroke="${BLUE}" stroke-width="${k===ad?8:5}" stroke-linecap="round" opacity=".7"/>`;
    const qx=x+(k+2)*cw+cw/2, qq=clamp(pu*3-k); if(qq>0) s+=`<path d="M${qx+14} ${y0-14}L${qx+14-(2*cw+28)*qq} ${y0-14+(2*ch+28)*qq}" stroke="${ORA}" stroke-width="${k===au?8:5}" stroke-linecap="round" opacity=".7"/>`; }
  return s; }
R.sarrus=(D,tags)=>{ const kd=tags.indexOf('down'), ku=tags.indexOf('up'), kr=tags.indexOf('res'), ks=tags.indexOf('setup'), ci=curIdx();
  const pd=pr(kd,.8), pu=pr(ku,.8), ext=ks>=0?ap(ks,.8,1.5):1;
  const ad=ci===kd?Math.min(2,Math.floor(pd*3)):-1, au=ci===ku?Math.min(2,Math.floor(pu*3)):-1;
  let box=sarDraw(220,30,D.M,pd,pu,ext,ad,au);
  box+=TX(90,330,"↘ blau (+)",{fs:28,a:'start',c:BLUE,st:op(clamp(pd*4))})+TX(560,330,"↙ orange (−)",{fs:28,a:'start',c:ORA,st:op(clamp(pu*4))});
  D.down.forEach(([e,v],k)=>{ box+=TX(90,380+k*46,`${e} = ${v}`,{fs:31,a:'start',w:700,c:BLUE,st:op(clamp((pd*3-k)*2))}); });
  D.up.forEach(([e,v],k)=>{ box+=TX(560,380+k*46,`${e} = ${v}`,{fs:31,a:'start',w:700,c:ORA,st:op(clamp((pu*3-k)*2))}); });
  box+=TX(90,530,`Summe ${D.sd}`,{fs:32,a:'start',c:BLUE,st:op(clamp((pd*3-2.5)*2))})+TX(560,530,`Summe ${D.su}`,{fs:32,a:'start',c:ORA,st:op(clamp((pu*3-2.5)*2))});
  box+=`<g style="${op(ap(kr))}">${TX(500,610,`det = ${tsp(D.sd,BLUE)} − ${tsp(D.su,ORA)} = ${tsp(D.det,D.bad?RED:GRN)}`,{fs:44})}</g>`;
  const panel=L(1,"Regel von Sarrus","ln q")+L(ks>=0?ap(ks):1,"nur für 2×2 und 3×3","ln small")+L(ap(kd),`${sp('↘ drei Produkte addieren','B')}`,"ln small")+L(ap(ku),`${sp('↙ drei Produkte abziehen','O')}`,"ln small")+L(ap(kr),`<span class="${D.bad?'bad':'ok'}">det = ${D.det}${D.bad?'':' ≠ 0'}</span>`);
  return {box,panel}; };
R.cof=(D,tags)=>{ const M=D.M, MS=M.map(r=>r.map(fmt)), ci=curIdx(), CV=[0,1,2].map(i=>[0,1,2].map(j=>cofv(M,i,j)));
  const filled={}; (D.done||[]).forEach(([i,j])=>filled[i+''+j]=1);
  let act=null, sym=0, same=0; const list=[]; const prev={};
  for(let k=0;k<=ci;k++){ const g=tags[k]; if(!g) continue;
    if(g[0]==='sym'){ sym=k<ci?1:pr(k,.6); act=null; continue; }
    if(g[0]==='same'){ same=k<ci?1:pr(k,.5); act=null; continue; }
    const [i,j,st]=g, key=i+''+j, lo=prev[key]||0; const lev=k<ci?st:lo+(st-lo)*pr(k,st-lo>=3?.8:.6); prev[key]=st; act={i,j,lev};
    if(lev>=3.6){ filled[key]=clamp((lev-3.6)/.4); if(!list.includes(key)) list.push(key); } }
  if(sym>0){ [[1,0],[2,0],[2,1]].forEach(([i,j])=>filled[i+''+j]=sym); }
  if(same>0&&D.same){ D.same.forEach(([i,j])=>filled[i+''+j]=same); }
  const lev=act?act.lev:0, ai=act?act.i:-1, aj=act?act.j:-1, cv=act?CV[ai][aj]:null;
  const role=(r,c)=>{ if(!act||r===ai||c===aj) return null; return cv.rr.indexOf(r)===cv.cc.indexOf(c)?'B':'O'; };
  const pm=clamp(lev-1);
  let box=mat(150,30,MS,{name:D.name,cw:100,ch:76,cover:(r,c)=>act&&(r===ai||c===aj)?clamp(lev):0,
     fill:(r,c)=>{const ro=role(r,c); return ro&&pm>0?(ro==='B'?FB(.2*pm):FO(.2*pm)):null;}, color:(r,c)=>{const ro=role(r,c); return ro&&pm>.4?(ro==='B'?BLUE:ORA):'#0f172a';}});
  if(act){ const mx=540,my=62, mw=88, mh=76, mm=[[cv.a,cv.b],[cv.c,cv.d]].map(r=>r.map(fmt));
    box+=`<g style="${op(pm)}">${TX(mx+mw,my-14,"übrig: 2×2",{fs:24,w:700,c:'#64748b'})}`+mat(mx,my,mm,{cw:mw,ch:mh,fs:40,color:(i,j)=>i===j?BLUE:ORA,fill:(i,j)=>i===j?FB(.15):FO(.15)})
      +`<path d="M${mx+24} ${my+18}L${mx+2*mw-24} ${my+2*mh-18}" stroke="${BLUE}" stroke-width="4" opacity="${.5*clamp(lev-2)}"/><path d="M${mx+2*mw-24} ${my+18}L${mx+24} ${my+2*mh-18}" stroke="${ORA}" stroke-width="4" opacity="${.5*clamp(lev-2)}"/></g>`
      +`<path d="M462 145H${mx-14}" stroke="#94a3b8" stroke-width="4" marker-end="url(#ar)" style="${op(pm)}"/>`;
    const id=sb(`${ai+1}${aj+1}`);
    box+=`<g style="${op(clamp(lev-2))}">${TX(500,345,`m${id} = ${tsp(par(cv.a),BLUE)}·${tsp(par(cv.d),BLUE)} − ${tsp(par(cv.b),ORA)}·${tsp(par(cv.c),ORA)} = ${fmt(cv.m)}`,{fs:40})}</g>`
      +`<g style="${op(clamp(lev-3))}">${TX(500,402,`Schachbrett ${tsp(cv.s>0?'+':'−',cv.s>0?GRN:RED)}  →  c${id} = ${tsp(fmt(cv.v),ACC)}`,{fs:38})}</g>`; }
  box+=signG(800,40,act?.35+.65*clamp(lev-2.6):.35,56,act?[ai,aj]:null,clamp(lev-2.6));
  box+=mat(400,440,[0,1,2].map(i=>[0,1,2].map(j=>fmt(CV[i][j].v))),{name:"C",cw:110,ch:62,fs:34,cell:(i,j)=>filled[i+''+j]||0,
     fill:(i,j)=>act&&i===ai&&j===aj?FP(.14):((same>0&&D.same&&i===2)?FO(.15*same):null), color:(i,j)=>(D.same&&i===2&&same>0)?ORA:'#0f172a'});
  const fl=key=>{ const i=+key[0], j=+key[1], c=CV[i][j]; return `c${sb(key[0]*1+1)}${sb(key[1]*1+1)} = ${c.s>0?'+':'−'}(${sp(par(c.a),'B')}·${sp(par(c.d),'B')} − ${sp(par(c.b),'O')}·${sp(par(c.c),'O')}) = ${sp(fmt(c.v),'P')}`; };
  let panel=L(1,`${sp('blau·blau','B')} − ${sp('orange·orange','O')}`,"ln small")+list.map(k=>L(filled[k],fl(k),"ln f")).join('');
  if(sym>0) panel+=L(sym,`gespiegelt: c₂₁ = c₁₂ · c₃₁ = c₁₃ · c₃₂ = c₂₃`,"ln f");
  if(same>0) panel+=L(same,`c₃₁, c₃₂, c₃₃ wie bei A: ${sp('0 · 1 · −2','O')}`,"ln f");
  return {box,panel}; };
R.inv=(D,tags)=>{ const ktr=tags.indexOf('tr'), kdv=tags.indexOf('div'), kf=tags.indexOf('fill'), ci=curIdx();
  const probes=tags.map((g,k)=>g&&g[0]==='probe'?k:-1).filter(k=>k>=0);
  const ptr=D.skiptr?1:(ktr>=0?pr(ktr,.85):1), pdv=kdv>=0?ap(kdv,.8):0, rk=ptr*3, cols=[BLUE,ORA,ACC];
  const colored=!D.skiptr&&pdv<.5; const cn=D.cn||"C";
  let box="";
  const cX=D.skiptr?110:lerp(590,110,pdv);
  box+=mat(110,30,D.C,{name:cn,op:D.skiptr?0:1-pdv,cw:96,ch:66,fs:36,color:(i,j)=>colored&&i<rk?cols[i]:'#0f172a',fill:(i,j)=>colored&&i<rk&&rk-i<1.2&&ptr<1?FP(.08):null});
  box+=mat(cX,30,D.CT,{name:cn+"′",cw:96,ch:66,fs:36,cell:(i,j)=>D.skiptr||pdv>0?1:clamp((rk-j)*1.5),color:(i,j)=>colored?cols[j]:'#0f172a'});
  if(!D.skiptr) box+=`<g style="${op(1-pdv)}"><path d="M415 128H505" stroke="${ACC}" stroke-width="6" marker-end="url(#ar)"/>${TX(462,104,"transponieren",{fs:22,c:ACC})}</g>`;
  if(kdv>=0){ box+=`<g style="${op(pdv)}">${TX(488,138,D.det.startsWith('−')?`/ (${D.det})`:`/ ${D.det}`,{fs:40,c:ACC})}${TX(566,138,"=",{fs:44})}</g>`+mat(590,30,D.Ai,{name:"",op:pdv,cw:96,ch:66,fs:36})+TX(735,270,"A⁻¹",{fs:34,c:ACC,st:op(pdv)}); }
  else if(D.det==="1") box+=TX(735,270,"= A⁻¹  (det = 1)",{fs:30,c:GRN,st:op(clamp((ptr-.9)*10))});

    box+=`<rect x="${x}" y="${y}" width="140" height="58" rx="10" fill="${f}" stroke="#e2e8f0" stroke-width="2"/>`+TX(x+70,y+39,(ci>=3&&dg)?`Z${i+1}·Z${j+1} = 1`:(ci>=4&&!dg)?`Z${i+1}·Z${j+1} = 0`:`Z${i+1}·Z${j+1}`,{fs:22,w:700,c:dg&&ci>=3?GRN:(!dg&&ci>=4?ORA:'#334155')}); }
  box+=`</g>`;
  const panel=L(ap(0),"Idee: A′ testen","ln q")+L(ap(1),`Spalte j von A′ = Zeile j von A`,"ln small")+L(ap(2),`(A·A′)<sub>ij</sub> = ${sp('Zeile i','B')} · ${sp('Zeile j','O')}`,"ln small")+L(ap(3),`${sp('Diagonale: Länge² = 1','G')}`,"ln small")+L(ap(4),`${sp('daneben: 0 → senkrecht ⟂','O')}`,"ln small");
  return {box,panel}; };
R.knob2=(D)=>{ const ci=curIdx(), M=D.M; let b=-1,o=-1;
  if(ci===0){ b=pr(0,.9)<.55?0:2; } if(ci===1){b=0;o=1;} if(ci===2){b=0;o=2;} if(ci===3){b=2;o=3;}
  let box=mat(110,30,M,{name:"A",cw:96,ch:60,fs:25,fill:(i,j)=>i===b?FB(.18):i===o?FO(.18):null,color:(i,j)=>i===b?BLUE:i===o?ORA:'#0f172a'});
  ["Z1","Z2","Z3","Z4"].forEach((z,i)=>{ box+=TX(512,30+i*60+40,z,{fs:24,a:'start',c:i===b?BLUE:i===o?ORA:'#94a3b8'}); });
  const val=(i,j)=>{ if(i===j) return ci>=0?ap(0,.5,i<2?0:sd(0)*.5):0; const a=Math.min(i,j), c=Math.max(i,j); if(a===0&&c===1) return ap(1,.5,sd(1)*.5); if(a===0&&c===2) return ap(2,.5,sd(2)*.5); return ap(3,.5,sd(3)*.6); };
  box+=TX(780,20,"A · A′",{fs:26,c:ACC})+mat(620,30,[0,1,2,3].map(i=>[0,1,2,3].map(j=>i===j?"1":"0")),{cw:80,ch:60,fs:30,cell:val,color:(i,j)=>i===j?GRN:'#0f172a'});
  const H=v=>tsp(v,BLUE), Oo=v=>tsp(v,ORA);
  const lines=[[`Z1·Z1 = ${H('½')}·${Oo('½')} + ${H('½')}·${Oo('½')} + ${H('½')}·${Oo('½')} + ${H('½')}·${Oo('½')} = ¼·4 = 1`,`Z3·Z3 = ½ + ½ + 0 + 0 = 1`],
    [`Z1·Z2 = ${H('½')}·${Oo('½')} + ${H('½')}·${Oo('½')} + ${H('½')}·${Oo('(−½)')} + ${H('½')}·${Oo('(−½)')} = 0`],
    [`Z1·Z3 = ${H('½')}·${Oo('1/√2')} + ${H('½')}·${Oo('(−1/√2)')} + ${H('½')}·${Oo('0')} + ${H('½')}·${Oo('0')} = 0`],
    [`Z3·Z4 = ${H('1/√2')}·${Oo('0')} + ${H('(−1/√2)')}·${Oo('0')} + ${H('0')}·${Oo('1/√2')} + ${H('0')}·${Oo('(−1/√2)')} = 0`]];
  if(ci>=0&&ci<=3){ box+=TX(500,345,lines[ci][0],{fs:28,st:op(ap(ci,.5))}); if(lines[ci][1]) box+=TX(500,395,lines[ci][1],{fs:28,st:op(ap(0,.5,sd(0)*.5))}); }
  box+=`<g style="${op(ap(4))}">${TX(500,480,"A · A′ = I   →   A⁻¹ = A′",{fs:48,c:GRN})}</g>`+`<g style="${op(ap(5))}">${TX(500,570,"A⁻¹ orthogonal: Zeilen Länge 1, paarweise ⟂",{fs:34,c:ACC})}</g>`;
  const panel=L(1,"nachrechnen","ln q")+L(ap(0),`${sp('Diagonale','G')}: alle 1`,"ln small")+L(ap(3),"alle Paare: 0","ln small")+L(ap(4),`<span class="ok">A) invertierbar · A⁻¹ = A′</span>`)+L(ap(5),`<span class="hl">B) A⁻¹ ist orthogonal</span>`);
  return {box,panel}; };
R.merke=()=>{ const it=[["1","det A = 0 → keine Inverse"],["2","Kofaktor: Zeile + Spalte weg, 2×2-det, Schachbrett"],["3","C transponieren, durch det teilen"],["4","Probe mit A: A·x = b bzw. A·A⁻¹ = I"]];
  const box=it.map(([n,s],i)=>`<g style="${op(ap(i,.5))}"><rect x="20" y="${20+i*150}" width="960" height="120" rx="26" fill="#fff" stroke="${i===0?ACC:'#cbd5e1'}" stroke-width="4"/><circle cx="90" cy="${80+i*150}" r="38" fill="${ACC}"/>${TX(90,93+i*150,n,{fs:40,c:'#fff'})}${TX(150,92+i*150,nm(s),{fs:32,a:'start',w:700})}</g>`).join('');
  return {box,panel:L(ap(0),"Merke","ln q")+L(ap(3),"Die Probe findet fast jeden Vorzeichenfehler.","ln small")}; };
R.end=()=>({full:`<div class="center" style="top:300px"><div style="font-size:76px;font-weight:800;${op(ap(0))}">Jetzt du</div><div style="font-size:38px;color:#334155;margin-top:30px;font-weight:550;${op(ap(0,.5,.6))}">Angewandte Statistik → 2 Übungen → „Übung 02 ausführlich“</div><div style="${op(ap(0,.5,1.2))}"><span class="pill">Schablonen sind vorgezeichnet</span></div></div>`});
R.end2=()=>({full:`<div class="center" style="top:330px"><div style="font-size:72px;font-weight:800;${op(ap(0,.6))}">Teil 1 geschafft</div><div style="font-size:38px;color:#334155;margin-top:30px;font-weight:550;${op(ap(0,.5,.5))}">Beispiel · Aufgabe 1 · Aufgabe 2 · Aufgabe 3 A und B</div><div style="${op(ap(0,.5,1))}"><span class="pill">Teil 2: 3 C · 4 · Knobel · Altklausur</span></div></div>`});
R.stmt=(D)=>{ const p=ease(clamp((t-(S.dur-0.4))/1.0)); const html=D.html.replace(/\{\{k(\d+)\}\}/g,(m,n)=>`background:rgba(250,204,21,${(.5*ap(+n,.6)).toFixed(3)})`);
  return {full:`<div id="bigwrap" style="opacity:${(1-p).toFixed(3)};transform:translateY(${(-40*p).toFixed(1)}px) scale(${(1-.25*p).toFixed(3)})">${html}</div>`, stripOp:p}; };

function frame(){
  const k=S.i, N=window.SPEC.length; const res=R[SP.kind](SP.data,SP.tags)||{};
  let ci=curIdx(); const cap=ci>=0?S.caps[ci].replace(/\*(.+?)\*/g,"<em>$1</em>"):"";
  const P1=23, pt=k<P1?`Teil 1 · ${k+1} / ${P1}`:`Teil 2 · ${k-P1+1} / ${N-1-P1}`;
  const head=(SP.kind!=='end'&&SP.kind!=='end2')?`<div class="eyebrow">Angewandte Statistik · Übung 2</div><div class="title">${S.title}</div><div class="step">${pt}</div>`:"";
  const strip=SP.strip?`<div id="strip" style="opacity:${(res.stripOp===undefined?1:res.stripOp).toFixed(3)}">${window.STRIPS[SP.strip]}</div>`:"";
  document.getElementById("stage").innerHTML=head+strip+(res.box?`<svg id="box" width="1000" height="640" viewBox="0 0 1000 640">${DEFS}${res.box}</svg>`:"")+`<div id="panel">${res.panel||""}</div>`+(res.full||"")+(cap?`<div id="cap">${cap}</div>`:"");
}
window.show=(i,time)=>{ S=Object.assign({i},T0[i]); SP=window.SPEC[i]; t=time; frame(); };
</script></body></html>
