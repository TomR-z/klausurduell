<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<style>
  html,body{margin:0;overflow:hidden;background:#f4f6fa;font-family:Inter,sans-serif;color:#0f172a}
  #stage{position:absolute;inset:0}
  .eyebrow{position:absolute;font-size:22px;font-weight:700;letter-spacing:.12em;color:#64748b;text-transform:uppercase}
  .title{position:absolute;font-weight:800;letter-spacing:-.01em;line-height:1.1}
  .step{position:absolute;font-size:22px;font-weight:700;color:#64748b}
  #box{position:absolute}
  #panel{position:absolute}
  .ln{font-size:42px;line-height:1.3;margin:0 0 22px;font-weight:600}
  .ln.small{font-size:32px;font-weight:500;color:#334155}
  .ln.q{font-size:48px;font-weight:800}
  .hl{display:inline-block;background:#0a7cff;color:#fff;border-radius:14px;padding:4px 18px}
  .ok{display:inline-block;background:#16a34a;color:#fff;border-radius:14px;padding:4px 18px}
  .warn{display:inline-block;background:#f59e0b;color:#fff;border-radius:14px;padding:4px 18px}
  .g{color:#2563eb}.q2{color:#ea580c}.bad{color:#dc2626}
  sub{font-size:.62em;vertical-align:-.25em}
  #cap{position:absolute;left:50%;transform:translateX(-50%);text-align:center;background:rgba(15,23,42,.88);color:#fff;font-weight:600;line-height:1.35;border-radius:20px}
  #cap em{font-style:normal;color:#7dd3fc;font-weight:800}
  .center{position:absolute;left:0;right:0;text-align:center}
  .big{font-weight:800;line-height:1.15;margin:0 auto}
  .pill{display:inline-block;margin-top:50px;background:#0a7cff;color:#fff;font-size:40px;font-weight:750;padding:22px 44px;border-radius:999px}
</style></head><body><div id="stage"></div>
<script>
const T = window.TIMING, MODE = window.MODE || "land";
const W = MODE === "land" ? 1920 : 1080, H = MODE === "land" ? 1080 : 1920;
document.body.style.width = W + "px"; document.body.style.height = H + "px";
const LAY = MODE === "land"
  ? {eb:[96,64], ti:[96,100,56], st:[96,70], box:[70,200,1000,720], panel:[1110,230,760], cap:{bottom:40, w:1400, fs:33, pad:"14px 30px"}, center:300, big:76}
  : {eb:[70,90], ti:[70,128,54], st:[70,96], box:[40,300,1000,720], panel:[80,1060,920], cap:{bottom:120, w:980, fs:36, pad:"16px 28px"}, center:600, big:72};
const clamp = (x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease = x => x<.5 ? 2*x*x : 1-Math.pow(-2*x+2,2)/2;
const lerp = (a,b,p)=>a+(b-a)*p;
let S, t;
const ap = (k,d=.5,off=0)=> S.starts[k]===undefined ? 0 : ease(clamp((t - S.starts[k] - off)/d));
const op = p => `opacity:${p.toFixed(3)}`;
const SUBRE = /_([A-Za-zé]+(?:,[A-Za-z]+)?)/g;
const sv = s => s.replace(SUBRE, '<tspan font-size="0.65em" dy="8">$1</tspan><tspan dy="-8">\u200b</tspan>');
const fmt = (v,d=1) => v.toFixed(d).replace(".",",");
const DEFS = `<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0L10,5L0,10z" fill="context-stroke"/></marker>
  <pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="14" height="14" fill="rgba(220,38,38,.08)"/><path d="M0 0V14" stroke="rgba(220,38,38,.45)" stroke-width="4"/></pattern></defs>`;
const BX0 = 120, BX1 = 880, BY = 330;  /* Balken in Box-Koordinaten (1000×720), 190 px je Meter */
function beam({g=0, q=0, gScale=1, dim=0, react=0, mom=[0,0], momLab=0, load=1}){
  let s = `<rect x="${BX0-10}" y="${BY-18}" width="${BX1-BX0+20}" height="36" rx="5" fill="#dcae74" stroke="#7c4a12" stroke-width="4"/>`;
  s += `<path d="M${BX0} ${BY+18}l-26 46h52z" fill="#fff" stroke="#0f172a" stroke-width="4"/><path d="M${BX0-40} ${BY+64}h80" stroke="#0f172a" stroke-width="4"/>`;
  s += `<path d="M${BX1} ${BY+18}l-26 40h52z" fill="#fff" stroke="#0f172a" stroke-width="4"/><circle cx="${BX1-14}" cy="${BY+64}" r="6" fill="#0f172a"/><circle cx="${BX1+14}" cy="${BY+64}" r="6" fill="#0f172a"/><path d="M${BX1-40} ${BY+74}h80" stroke="#0f172a" stroke-width="4"/>`;
  const arrows = (y0, len, col, p, lab, labY) => { let a = `<g style="${op(p)}"><path d="M${BX0} ${y0}H${BX1}" stroke="${col}" stroke-width="5"/>`;
    for (let i=0;i<=10;i++){ const x = BX0 + i*(BX1-BX0)/10, d = clamp(p*1.4 - i*0.04); a += `<path d="M${x} ${y0}V${y0+len*d}" stroke="${col}" stroke-width="5" marker-end="url(#ar)" style="${op(d)}"/>`; }
    return a + `<text x="${BX1+18}" y="${labY}" font-size="30" font-weight="800" fill="${col}">${lab}</text></g>`; };
  const gl = 70*gScale;
  if (g) s += arrows(BY-22-gl, gl-4, "#2563eb", g, "g", BY-22-gl/2+10);
  if (q) s += arrows(BY-26-gl-38, 34, "#ea580c", q, "q", BY-26-gl-20);
  if (dim) s += `<g style="${op(dim)}"><path d="M${BX0} ${BY+120}H${BX1}" stroke="#334155" stroke-width="3" marker-start="url(#ar)" marker-end="url(#ar)"/><text x="500" y="${BY+108}" font-size="32" font-weight="700" text-anchor="middle" fill="#334155">l = 4 m</text></g>`;
  if (react) s += `<g style="${op(react)}"><path d="M${BX0} ${BY+170}V${BY+92}" stroke="#16a34a" stroke-width="7" marker-end="url(#ar)"/><path d="M${BX1} ${BY+170}V${BY+92}" stroke="#16a34a" stroke-width="7" marker-end="url(#ar)"/><text x="${BX0+16}" y="${BY+150}" font-size="30" font-weight="800" fill="#16a34a">A</text><text x="${BX1-40}" y="${BY+150}" font-size="30" font-weight="800" fill="#16a34a">B</text></g>`;
  const par = (depth, col, p, dash) => { const base = BY+205; let d = `M${BX0} ${base}`; const N = 40;
    for (let i=0;i<=N*p;i++){ const x = BX0 + i*(BX1-BX0)/N, u = i/N; d += `L${x.toFixed(1)} ${(base + depth*4*u*(1-u)).toFixed(1)}`; }
    return `<path d="${d}" stroke="${col}" stroke-width="5" fill="none" ${dash ? 'stroke-dasharray="14 10"' : ""}/>`; };
  if (mom[0]) s += `<path d="M${BX0} ${BY+205}H${BX1}" stroke="#94a3b8" stroke-width="3" style="${op(mom[0])}"/>` + par(100, "#2563eb", mom[0]);
  if (mom[1]) s += par(50, "#ea580c", mom[1], true);
  if (momLab) s += `<g style="${op(momLab)}"><text x="500" y="${BY+205+100+42}" font-size="32" font-weight="800" fill="#2563eb" text-anchor="middle">${sv('max M_g = 6 kNm')}</text><text x="500" y="${BY+205+40}" font-size="26" font-weight="800" fill="#ea580c" text-anchor="middle">${sv('max M_q = 3 kNm')}</text></g>`;
  return s;
}
function gauge(x0, y, w, val, p, lab){
  const f = clamp(val*p, 0, 1.2), col = val <= 1 ? (val > .9 ? "#f59e0b" : "#16a34a") : "#dc2626";
  return `<rect x="${x0}" y="${y}" width="${w}" height="40" rx="20" fill="#e2e8f0"/><rect x="${x0}" y="${y}" width="${(w*Math.min(f,1)).toFixed(1)}" height="40" rx="20" fill="${col}"/>
    <path d="M${x0+w} ${y-14}V${y+54}" stroke="#0f172a" stroke-width="4"/><text x="${x0+w}" y="${y-22}" font-size="26" font-weight="800" text-anchor="middle">1,0</text>
    <text x="${x0}" y="${y+90}" font-size="34" font-weight="800" fill="${col}">${lab} = ${fmt(val*p,2)}</text>`;
}
function section({p=1, dims=0, stress=0, cracks=0, tau=0, cy=360}){
  const cx = 360, s = 13, bw = 8*s*ease(clamp(p*1.3)), bh = 24*s*ease(p);
  let g = `<rect x="${cx-bw/2}" y="${cy-bh/2}" width="${bw}" height="${bh}" fill="#dcae74" stroke="#7c4a12" stroke-width="4"/>`;
  for (let i=1;i<6;i++) g += `<path d="M${cx-bw/2+6} ${cy-bh/2+i*bh/6}h${Math.max(0,bw-12)}" stroke="#a8743a" stroke-width="2" opacity=".6"/>`;
  if (cracks) g += `<g style="${op(cracks)}"><rect x="${cx-bw/2}" y="${cy-bh/2}" width="${bw/2}" height="${bh}" fill="url(#hatch)"/><path d="M${cx-8} ${cy-110}l10 30l-12 28l12 30l-8 26M${cx+18} ${cy+10}l-8 30l10 26l-8 30" stroke="#7c2d12" stroke-width="4" fill="none"/><text x="${cx-bw/2-20}" y="${cy-bh/2-20}" font-size="30" font-weight="800" fill="#dc2626" text-anchor="end">${sv('k_cr · b')}</text></g>`;
  if (dims) g += `<g style="${op(dims)}"><path d="M${cx-52} ${cy+bh/2+40}H${cx+52}" stroke="#334155" stroke-width="3" marker-start="url(#ar)" marker-end="url(#ar)"/><text x="${cx}" y="${cy+bh/2+84}" font-size="32" font-weight="700" text-anchor="middle">b = 8 cm</text>
    <path d="M${cx-110} ${cy-156}V${cy+156}" stroke="#334155" stroke-width="3" marker-start="url(#ar)" marker-end="url(#ar)"/><text x="${cx-130}" y="${cy+10}" font-size="32" font-weight="700" text-anchor="end">h = 24 cm</text></g>`;
  if (stress) { const ax = 640, L = 130*stress;
    g += `<g><path d="M${ax} ${cy-156}V${cy+156}" stroke="#0f172a" stroke-width="3"/><path d="M${ax} ${cy-156}L${ax-L} ${cy-156}L${ax+L} ${cy+156}L${ax} ${cy+156}" fill="rgba(10,124,255,.10)" stroke="none"/>
      <path d="M${ax-L} ${cy-156}L${ax+L} ${cy+156}" stroke="#0a7cff" stroke-width="4"/>
      <path d="M${ax} ${cy-156}H${ax-L+6}" stroke="#dc2626" stroke-width="6" marker-end="url(#ar)"/><path d="M${ax} ${cy+156}H${ax+L-6}" stroke="#2563eb" stroke-width="6" marker-end="url(#ar)"/>
      <text x="${ax-L-12}" y="${cy-146}" font-size="28" font-weight="800" fill="#dc2626" text-anchor="end" style="${op(stress)}">Druck</text><text x="${ax+L+12}" y="${cy+166}" font-size="28" font-weight="800" fill="#2563eb" style="${op(stress)}">Zug</text></g>`; }
  if (tau) { const ax = 640; let d = `M${ax} ${cy-156}`; for (let i=0;i<=30;i++){ const u=i/30, y = cy-156+u*312; d += `L${(ax + 150*tau*4*u*(1-u)).toFixed(1)} ${y.toFixed(1)}`; }
    g += `<path d="M${ax} ${cy-156}V${cy+156}" stroke="#0f172a" stroke-width="3"/><path d="${d}" fill="rgba(234,88,12,.12)" stroke="#ea580c" stroke-width="5"/><text x="${ax+160}" y="${cy+10}" font-size="30" font-weight="800" fill="#ea580c" style="${op(tau)}">${sv('τ_max')}</text>`; }
  return g;
}
function bars(v1, v2, labTop, win, mOp=1){
  const base = 600, sc = 30, x1 = 280, x2 = 640, wd = 150;
  const bar = (x, v, col, lab, w) => (v < 0.05 ? `<text x="${x}" y="${base+50}" font-size="32" font-weight="800" text-anchor="middle">${lab}</text>` : `<rect x="${x-wd/2}" y="${base - v*sc}" width="${wd}" height="${v*sc}" rx="10" fill="${col}" ${w ? 'stroke="#16a34a" stroke-width="10"' : ""}/><text x="${x}" y="${base - v*sc - 18}" font-size="38" font-weight="800" text-anchor="middle">${fmt(v,1)}</text><text x="${x}" y="${base+50}" font-size="32" font-weight="800" text-anchor="middle">${lab}</text>`);
  return `<path d="M120 ${base}H820" stroke="#0f172a" stroke-width="4"/>` + bar(x1, v1, "#2563eb", "nur g", win===1 && mOp>.5) + bar(x2, v2, "#ea580c", "g + q", win===2 && mOp>.5) + `<text x="470" y="44" font-size="34" font-weight="800" text-anchor="middle" fill="#334155">${sv(labTop)}</text>` + (win ? `<text x="${win===1?x1:x2}" y="${base-(win===1?v1:v2)*sc-74}" font-size="36" font-weight="800" text-anchor="middle" fill="#16a34a" style="${op(mOp)}">maßgebend ✓</text>` : "");
}

function frame(){
  const k = S.i, L = (p, s, cls="ln") => `<div class="${cls}" style="${op(p)}">${s}</div>`;
  let box = "", panel = "", full = "";
  if (k===0){ box = beam({g:ap(0,1.2), q:ap(0,1.2,1.2), dim:ap(1)}) + `<text x="500" y="${BY+220}" font-size="120" font-weight="800" text-anchor="middle" fill="#0a7cff" style="${op(ap(1,.6,.4))}">?</text>`;
    panel = L(ap(0),`<span class="g">g</span> Eigengewicht · <span class="q2">q</span> Nutzlast`,"ln small") + L(ap(1),"Welche Kombination ist maßgebend?","ln q") + L(ap(2),`<span class="warn">Größte Last ≠ maßgebend</span>`); }
  if (k===1){ box = beam({g:1, q:1, dim:ap(0)});
    panel = L(ap(0),"l = 4 m · C24 · NKL 2") + L(ap(1),`<span class="g">g<sub>k</sub> = 3,0 kN/m</span> (ständig)`) + L(ap(1,.5,2.5),`<span class="q2">q<sub>k</sub> = 1,5 kN/m</span> (kurz)`) + L(ap(2),"f<sub>m,k</sub> = 24 N/mm²") + L(ap(2,.5,2),"f<sub>v,k</sub> = 4,0 N/mm²") + L(ap(2,.5,4.5),"γ<sub>M</sub> = 1,3"); }
  if (k===2){ box = beam({g:1, q:1, react:ap(0), mom:[ap(1,1.6), ap(2,1.6,3)], momLab:ap(2,.5,1)});
    panel = L(ap(0),"Je Lastart getrennt","ln q") + L(ap(1),"max M = q · l² / 8") + L(ap(2),`<span class="g">M<sub>g</sub> = 3 · 16 / 8 = 6 kNm</span>`) + L(ap(2,.5,4),`<span class="q2">M<sub>q</sub> = 3 kNm</span>`) + L(ap(3),"→ jede Kombination bekommt ihr k<sub>mod</sub>","ln small"); }
  if (k===3){ const p1 = ap(1,1.2), p2 = ap(1,1.2,2.5);
    box = `<text x="80" y="110" font-size="30" font-weight="800" fill="#64748b">LASTEINWIRKUNGSDAUER</text>
      <text x="80" y="210" font-size="34" font-weight="800" fill="#2563eb">ständig (> 10 Jahre)</text><rect x="80" y="230" width="${640*ap(0,1.4)}" height="56" rx="12" fill="#2563eb"/><text x="${80+640*ap(0,1.4)+24}" y="272" font-size="52" font-weight="800" fill="#2563eb" style="${op(p1)}">0,6</text>
      <text x="80" y="390" font-size="34" font-weight="800" fill="#ea580c">kurz (< 1 Woche)</text><rect x="80" y="410" width="${90*ap(0,1.4,.6)}" height="56" rx="12" fill="#ea580c"/><text x="${80+90*ap(0,1.4,.6)+24}" y="452" font-size="52" font-weight="800" fill="#ea580c" style="${op(p2)}">0,9</text>
      <g style="${op(ap(2))}"><path d="M80 560H860" stroke="#334155" stroke-width="4" marker-end="url(#ar)"/><text x="80" y="610" font-size="32" font-weight="700" fill="#334155">${sv('länger wirkend → kleineres k_mod (Kriechen)')}</text></g>`;
    panel = L(ap(0),"k<sub>mod</sub>: Dauer + Feuchte","ln q") + L(ap(1),"NKL 2, Vollholz:") + L(p1,`<span class="g">ständig → 0,6</span>`) + L(p2,`<span class="q2">kurz → 0,9</span>`) + L(ap(2),"Dauerlast ist für Holz ungünstiger","ln small"); }
  if (k===4){
    const m1 = ap(4,1.2), m2 = ap(4,1.2,4.5);
    const v1 = lerp(8.1*ap(1,1), 13.5, m1), v2 = lerp(12.6*ap(2,1), 14.0, m2);
    box = bars(v1, v2, m2 > .5 ? "E_d / k_mod" : (m1 > 0 ? "E_d / k_mod" : "M_Ed in kNm"), 2, ap(5)) ;
    panel = L(ap(0),"Die maßgebende Kombination","ln q") + L(ap(1),`nur g: 1,35 · 6 = <b>8,1</b>`) + L(ap(2),`g + q: 8,1 + 1,5 · 3 = <b>12,6</b>`) + L(ap(3),"÷ k<sub>mod</sub> (bei g + q: kürzeste Last → 0,9)","ln small") + L(m1,"8,1 / 0,6 = 13,5") + L(ap(4,.5,4.5),"12,6 / 0,9 = 14,0") + L(ap(5),`<span class="ok">M<sub>Ed</sub> = 12,6 kNm</span>`); }
  if (k===5){
    const dq = ap(1,1.6,.5) * (1 - ap(2,1.2,1)), qv = lerp(1.5, 1.0, dq), v2 = (8.1 + 1.5*2*qv)/0.9;
    box = bars(13.5, v2, `q = ${fmt(qv,1)} kN/m`, v2 >= 13.5 ? 2 : 1);
    panel = L(ap(0),`<span class="warn">Knapp: 13,5 vs. 14,0</span>`) + L(ap(1),"Weniger Nutzlast → <b>nur g</b> wird maßgebend","ln small") + L(ap(2),`<span class="ok">Immer beide prüfen!</span>`); }
  if (k===6){ box = section({p:ap(1,1.4,.8), dims:ap(2,.6,.6)});
    panel = L(ap(0),"f<sub>m,d</sub> = 0,9 · 24 / 1,3 = 16,6") + L(ap(1),"erf W = 12,6 · 10⁶ / 16,6 ≈ 759 cm³") + L(ap(2),"W = b · h² / 6 = 8 · 24² / 6") + L(ap(2,.5,4),`<span class="hl">8/24 cm: W = 768 cm³</span>`) + L(ap(3),"h > 15 cm → k<sub>h</sub> = 1,0","ln small"); }
  if (k===7){ box = section({dims:1, stress:ap(0,1.2,1.5), cy:290}) + gauge(150, 610, 700, .99, ap(1,1.6,1), "η");
    panel = L(ap(0),"σ<sub>m,d</sub> = M<sub>Ed</sub> / W") + L(ap(0,.5,5),"= 12,6 · 10⁶ / 768 · 10³ = 16,4 N/mm²","ln small") + L(ap(1),"η = 16,4 / 16,6 = 0,99") + L(ap(2),`<span class="ok">≤ 1 → erfüllt</span>`) + L(ap(2,.5,1.5),"fast voll ausgenutzt","ln small"); }
  if (k===8){ box = section({dims:1, cracks:ap(0,.8,1.5), tau:ap(1,1.2), cy:290}) + gauge(150, 610, 700, .71, ap(2,1.4,1), "η");
    panel = L(ap(0),"k<sub>cr</sub> = 0,5 (Schwindrisse)") + L(ap(1),"τ<sub>d</sub> = 1,5 · V / (k<sub>cr</sub> · b · h)") + L(ap(1,.5,3),"= 1,5 · 12 600 / (0,5 · 19 200) = 1,97","ln small") + L(ap(2),"f<sub>v,d</sub> = 0,9 · 4,0 / 1,3 = 2,77","ln small") + L(ap(2,.5,4),`<span class="ok">η = 0,71 → erfüllt</span>`); }
  if (k===9){ const steps = ["Schnittgrößen je Lastart", "Kombinationen ÷ k_mod", "Größte = maßgebend", "Querschnitt: erf W", "Biegung + Schub nachweisen"];
    const cue = [1,1,1,2,2], off = [0,1.6,3.2,0,1.8];
    box = steps.map((s,i)=>{ const p = ap(cue[i],.5,off[i]); return `<g style="${op(p)}"><rect x="120" y="${60+i*128}" width="760" height="96" rx="24" fill="${i===2 ? "#16a34a" : "#fff"}" stroke="${i===2 ? "#16a34a" : "#cbd5e1"}" stroke-width="3"/><text x="170" y="${120+i*128}" font-size="36" font-weight="800" fill="${i===2 ? "#fff" : "#0f172a"}">${i+1}. ${sv(s)}</text>${i<4 ? `<path d="M500 ${158+i*128}v26" stroke="#94a3b8" stroke-width="5" marker-end="url(#ar)"/>` : ""}</g>`; }).join("");
    panel = L(ap(0),"Merke","ln q") + L(ap(1),"Bei Holz entscheidet k<sub>mod</sub>, welche Kombination maßgebend ist.","ln small"); }
  if (k===10){ full = `<div class="center" style="top:${LAY.center}px"><div class="big" style="font-size:${LAY.big}px;${op(ap(0))}">Jetzt selbst rechnen</div><div style="font-size:38px;color:#334155;margin-top:30px;font-weight:550;${op(ap(0,.5,.6))}">Klausurduell → Aufgaben → Holzbalken bemessen</div><div style="${op(ap(0,.5,1.2))}"><span class="pill">Selbst rechnen</span></div></div>`; }

  let ci = -1; S.starts.forEach((s,j)=>{ if (t >= s) ci = j; });
  const cap = ci >= 0 ? S.caps[ci].replace(/\*(.+?)\*/g, "<em>$1</em>").replace(SUBRE, "<sub>$1</sub>") : "";
  const [bx,by,bw,bh] = LAY.box, [px,py,pw] = LAY.panel;
  const head = k<10 ? `<div class="eyebrow" style="left:${LAY.eb[0]}px;top:${LAY.eb[1]}px">Baukonstruktion · Holzbemessung</div><div class="title" style="left:${LAY.ti[0]}px;top:${LAY.ti[1]}px;font-size:${LAY.ti[2]}px;max-width:${W-2*LAY.ti[0]-140}px">${S.title.replace(/_(\w+)/g,"<sub>$1</sub>")}</div><div class="step" style="right:${LAY.st[0]}px;top:${LAY.st[1]}px">${k+1} / 11</div>` : "";
  const boxHtml = box ? `<svg id="box" style="left:${bx}px;top:${by}px" width="${bw}" height="${bh}" viewBox="0 0 1000 720">${DEFS}${box}</svg>` : "";
  const c = LAY.cap;
  document.getElementById("stage").innerHTML = head + boxHtml + `<div id="panel" style="left:${px}px;top:${py}px;width:${pw}px">${panel}</div>` + full + (cap ? `<div id="cap" style="bottom:${c.bottom}px;max-width:${c.w}px;font-size:${c.fs}px;padding:${c.pad}">${cap}</div>` : "");
}
window.show = (i, time) => { S = Object.assign({i}, T[i]); t = time; frame(); };
</script></body></html>
