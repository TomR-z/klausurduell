<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Klausurduell">
<meta name="theme-color" content="#eef1f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#07090f" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
<title>Klausurduell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one-column iOS-style app, large titles, floating Liquid-Glass tab bar over a slow ambient light field. */
:root{
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Inter", "Segoe UI", system-ui, sans-serif;
  --bg:#eef1f6; --ink:#0d1220; --ink-2:#4a5368; --ink-3:#8a93a6;
  --glass:rgba(255,255,255,.52); --glass-strong:rgba(255,255,255,.72); --glass-soft:rgba(255,255,255,.34);
  --edge:rgba(255,255,255,.75); --edge-2:rgba(255,255,255,.25); --hair:rgba(13,18,32,.08);
  --shadow:0 18px 40px -18px rgba(28,40,80,.28), 0 2px 6px -2px rgba(28,40,80,.08);
  --spec:rgba(255,255,255,.85);
  --accent:#0a7cff; --accent-ink:#ffffff;
  --ok:#1fa64a; --ok-soft:rgba(52,199,89,.16); --bad:#e5342a; --bad-soft:rgba(255,69,58,.14); --warn:#f59e0b;
  --blob1:#7cc4ff; --blob2:#9be7d0; --blob3:#ffc4a3; --blob4:#c7b8ff;
  --scrim:rgba(10,14,25,.28);
  --c-hydro:#1aa3e0; --c-phys:#5e5ce6; --c-bsk:#f08a00; --c-bauko:#ef4136; --c-binf:#22a556; --c-stat:#a64fd9; --c-dap:#d9467a;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#07090f; --ink:#f3f5fa; --ink-2:#b3bacb; --ink-3:#7b8397;
  --glass:rgba(40,46,62,.42); --glass-strong:rgba(56,63,84,.62); --glass-soft:rgba(30,35,48,.32);
  --edge:rgba(255,255,255,.18); --edge-2:rgba(255,255,255,.05); --hair:rgba(255,255,255,.08);
  --shadow:0 20px 44px -18px rgba(0,0,0,.7), 0 2px 6px -2px rgba(0,0,0,.4);
  --spec:rgba(255,255,255,.22);
  --accent:#2f8cff; --ok:#34c759; --ok-soft:rgba(52,199,89,.3); --bad:#ff5a4f; --bad-soft:rgba(255,69,58,.26);
  --blob1:#1d4f9a; --blob2:#0f5d55; --blob3:#6b2f3a; --blob4:#3a2c7a; --scrim:rgba(0,0,0,.5);
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#07090f; --ink:#f3f5fa; --ink-2:#b3bacb; --ink-3:#7b8397;
  --glass:rgba(40,46,62,.42); --glass-strong:rgba(56,63,84,.62); --glass-soft:rgba(30,35,48,.32);
  --edge:rgba(255,255,255,.18); --edge-2:rgba(255,255,255,.05); --hair:rgba(255,255,255,.08);
  --shadow:0 20px 44px -18px rgba(0,0,0,.7), 0 2px 6px -2px rgba(0,0,0,.4);
  --spec:rgba(255,255,255,.22);
  --accent:#2f8cff; --ok:#34c759; --ok-soft:rgba(52,199,89,.3); --bad:#ff5a4f; --bad-soft:rgba(255,69,58,.26);
  --blob1:#1d4f9a; --blob2:#0f5d55; --blob3:#6b2f3a; --blob4:#3a2c7a; --scrim:rgba(0,0,0,.5);
  color-scheme:dark }

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.4;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;letter-spacing:-.011em}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
svg{display:block}

/* ambient light field */
.ambient{position:fixed;inset:-20%;z-index:0;pointer-events:none;filter:blur(60px) saturate(140%);opacity:.95}
.ambient i{position:absolute;border-radius:50%;opacity:.75;animation:drift 26s ease-in-out infinite alternate}
.ambient i:nth-child(1){width:55vmax;height:55vmax;left:-5%;top:-8%;background:var(--blob1)}
.ambient i:nth-child(2){width:46vmax;height:46vmax;right:-8%;top:10%;background:var(--blob2);animation-delay:-8s}
.ambient i:nth-child(3){width:50vmax;height:50vmax;left:15%;bottom:-15%;background:var(--blob3);animation-delay:-14s}
.ambient i:nth-child(4){width:36vmax;height:36vmax;right:10%;bottom:5%;background:var(--blob4);animation-delay:-20s}
.ambient.tint i:nth-child(1),.ambient.tint i:nth-child(4){background:var(--tint,var(--blob1));opacity:.42}
@keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(4%,6%) scale(1.08)}100%{transform:translate(-5%,2%) scale(.95)}}

/* glass material */
.glass{position:relative;background:var(--glass);border:1px solid var(--edge-2);
  -webkit-backdrop-filter:blur(26px) saturate(185%);backdrop-filter:blur(26px) saturate(185%);
  box-shadow:inset 0 1px 0 var(--edge), inset 0 -1px 0 var(--edge-2), var(--shadow);isolation:isolate}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;
  background:linear-gradient(150deg,var(--spec) 0%,transparent 34%,transparent 66%,rgba(255,255,255,.08) 100%);opacity:.55}
.press{transition:transform .35s cubic-bezier(.2,.9,.25,1.25), background-color .2s, box-shadow .2s}
.press:active{transform:scale(.965)}

/* shell */
.app{position:relative;z-index:1;max-width:620px;margin:0 auto;min-height:100%;
  padding-left:max(18px, env(safe-area-inset-left, 0px));padding-right:max(18px, env(safe-area-inset-right, 0px));
  padding-block:calc(18px + env(safe-area-inset-top, 0px)) 140px}
.view{display:flex;flex-direction:column;gap:26px;animation:viewIn .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes viewIn{from{opacity:.0;transform:translateY(10px)}to{opacity:1;transform:none}}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:10px}
.eyebrow{font-size:13px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em}
h1{font-size:34px;line-height:1.08;font-weight:800;letter-spacing:-.03em;margin:4px 0 0;text-wrap:balance}
h2{font-size:21px;font-weight:700;letter-spacing:-.022em;margin:0}
.sec{display:flex;flex-direction:column;gap:12px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;padding:0 4px}
.sec-h small{color:var(--ink-3);font-size:14px}
.round{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none}
.round svg{width:20px;height:20px}

/* today hero */
.hero{border-radius:30px;padding:22px;display:grid;grid-template-columns:auto 1fr;gap:16px 20px;align-items:center}
.ring{position:relative;width:118px;height:118px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .num b{font-size:30px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.ring .num span{font-size:12px;color:var(--ink-3);font-weight:600}
.hero-t{display:flex;flex-direction:column;gap:6px;min-width:0}
.hero-t .lbl{font-size:15px;color:var(--ink-2)}
.hero-t .big{font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:6px 10px;border-radius:99px;background:var(--glass-soft);border:1px solid var(--edge-2)}
.chip svg{width:14px;height:14px}
.cta{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:58px;border-radius:20px;
  background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 88%,white) 0%,var(--accent) 100%);color:var(--accent-ink);
  font-size:17px;font-weight:700;letter-spacing:-.01em;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45), inset 0 -1px 0 rgba(0,0,0,.12), 0 14px 30px -12px color-mix(in srgb,var(--accent) 70%,transparent)}
.cta svg{width:20px;height:20px}
.cta[disabled]{opacity:.45;pointer-events:none}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:12px;text-align:left;min-height:122px}
.tile .round{width:36px;height:36px}
.tile b{font-size:16px;font-weight:700;letter-spacing:-.015em}
.tile span{font-size:13px;color:var(--ink-2)}

/* subject icon */
.ico{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex:none;color:#fff;
  background:linear-gradient(160deg,color-mix(in srgb,var(--c) 75%,white) 0%,var(--c) 70%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 8px 16px -8px var(--c)}
.ico svg{width:24px;height:24px}
.ico.sm{width:34px;height:34px;border-radius:10px}.ico.sm svg{width:19px;height:19px}

/* subject rows */
.list{border-radius:24px;overflow:hidden}
.row{display:flex;align-items:center;gap:14px;padding:14px 16px;width:100%;text-align:left}
.row+.row{border-top:1px solid var(--hair)}
.row .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.row .t b{font-size:16px;font-weight:650;letter-spacing:-.015em}
.row .t small{font-size:13px;color:var(--ink-3)}
.bar{height:6px;border-radius:99px;background:var(--hair);overflow:hidden}
.bar>div{height:100%;border-radius:inherit;background:var(--c,var(--accent));transition:width .8s cubic-bezier(.2,.8,.2,1)}
.row .pct{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink-2);min-width:42px;text-align:right}
.chev{width:9px;height:15px;color:var(--ink-3);flex:none}

/* stats */
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:2px}
.stat b{font-size:26px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--ink-3);font-weight:600}
.panel{border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:14px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:120px}
.week .col{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.week .b{width:100%;max-width:26px;border-radius:8px;background:var(--hair);position:relative;overflow:hidden;min-height:6px}
.week .b>div{position:absolute;inset:auto 0 0 0;background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 70%,white),var(--accent));border-radius:inherit}
.week .col span{font-size:11.5px;color:var(--ink-3);font-weight:600}
.week .col.today span{color:var(--accent)}
.boxes{display:flex;flex-direction:column;gap:10px}
.boxrow{display:grid;grid-template-columns:92px 1fr 36px;gap:10px;align-items:center;font-size:14px}
.boxrow span:last-child{text-align:right;color:var(--ink-2);font-variant-numeric:tabular-nums;font-weight:600}
.boxrow .bar{height:10px}
.legend{font-size:13px;color:var(--ink-3);line-height:1.5}
.link{color:var(--accent);font-weight:600;font-size:15px;padding:12px 4px;text-align:left}
.link.danger{color:var(--bad)}

/* tab bar */
.tabbar{position:fixed;z-index:20;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom, 0px));
  width:min(420px, calc(100% - 32px - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px)));height:66px;border-radius:33px;
  display:grid;grid-template-columns:repeat(4,1fr);padding:5px}
.tabbar .pill{position:absolute;top:5px;bottom:5px;left:5px;width:calc((100% - 10px)/4);border-radius:28px;
  background:var(--glass-strong);box-shadow:inset 0 1px 0 var(--edge),0 4px 12px -6px rgba(0,0,0,.25);
  transition:transform .55s cubic-bezier(.3,1.35,.4,1)}
.tab{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-size:10.5px;font-weight:600;color:var(--ink-2);border-radius:28px;white-space:nowrap}
.tab svg{width:23px;height:23px}
.tab.on{color:var(--accent)}

/* sheets */
.scrim{position:fixed;inset:0;z-index:40;background:var(--scrim);opacity:0;transition:opacity .3s}
.scrim.show{opacity:1}
.sheet{position:fixed;z-index:41;left:50%;bottom:0;width:min(620px,100%);transform:translate(-50%,105%);
  border-radius:30px 30px 0 0;padding:10px max(20px, env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px, env(safe-area-inset-right,0px));
  transition:transform .5s cubic-bezier(.2,.9,.25,1);max-height:88%;overflow:auto;background:var(--glass-strong)}
.sheet.show{transform:translate(-50%,0)}
.grab{width:38px;height:5px;border-radius:9px;background:var(--ink-3);opacity:.45;margin:2px auto 14px}
.sheet{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.sheet.drag{transition:none}
.sheet .sx{position:absolute;top:12px;right:14px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--glass-soft);border:1px solid var(--edge-2);color:var(--ink-2);z-index:2}
.sheet .sx svg{width:15px;height:15px}
body.locked{position:fixed;left:0;right:0;overflow:hidden}
.sheet h2{margin-bottom:4px;padding-right:38px}
.sheet .sub{color:var(--ink-2);font-size:15px;margin:0 0 16px}
.topic{display:flex;align-items:center;gap:12px;padding:13px 4px;border-top:1px solid var(--hair);width:100%;text-align:left}
.topic b{flex:1;font-weight:600}
.topic small{color:var(--ink-3);font-variant-numeric:tabular-nums}
.btnrow{display:flex;gap:10px;margin-top:16px}
.btn2{flex:1;height:52px;border-radius:16px;font-weight:700;background:var(--glass-soft);border:1px solid var(--edge-2)}
.btn2.danger{background:var(--bad);color:#fff;border:0}

/* v1.5: Anmerkungen */
.toast{width:max-content;max-width:calc(100vw - 32px);text-align:center}
.qtop .nbtn svg{width:19px;height:19px}
.kats{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 14px}
.kat{padding:9px 13px;border-radius:99px;font-size:14px;font-weight:600;background:var(--glass-soft);border:1px solid var(--edge-2);color:var(--ink)}
.kat.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.ntext,.ntoken{width:100%;border-radius:16px;padding:12px 14px;font:inherit;font-size:16px;color:var(--ink);background:var(--glass-soft);border:1px solid var(--edge-2);outline:none}
.ntext{min-height:110px;resize:vertical;display:block}
.ntext:focus,.ntoken:focus{border-color:var(--accent)}
.nq{font-size:14px;line-height:1.45;color:var(--ink-2);background:var(--glass-soft);border-radius:14px;padding:10px 12px;margin:0 0 14px}
.nq b{color:var(--ink);font-weight:650}
.ncheck{display:flex;gap:10px;align-items:center;font-size:15px;margin-top:12px}
.ncheck input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.nitem{display:flex;gap:10px;align-items:flex-start;padding:12px 2px;border-top:1px solid var(--hair)}
.nitem .t{flex:1;min-width:0;font-size:14.5px;line-height:1.4}
.nitem small{display:block;color:var(--ink-3);font-size:12.5px;margin-top:2px}
.nitem .del{color:var(--bad);font-size:13.5px;font-weight:650;padding:2px 4px;flex:none}
.btn2.acc{background:var(--accent);color:var(--accent-ink);border:0}
.sheet h3{font-size:17px;margin:22px 0 4px}
.steps{margin:6px 0 14px 20px;padding:0;color:var(--ink-2);font-size:14px;line-height:1.55}
.steps li{margin-bottom:4px}

/* quiz */
.quiz{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;background:var(--bg);
  padding-left:max(18px, env(safe-area-inset-left, 0px));padding-right:max(18px, env(safe-area-inset-right, 0px));
  padding-block:calc(12px + env(safe-area-inset-top, 0px)) calc(16px + env(safe-area-inset-bottom, 0px))}
.quiz .ambient{position:absolute}
.qwrap{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;max-width:620px;width:100%;margin:0 auto;min-height:0}
.qtop{display:flex;align-items:center;gap:14px;padding:6px 0 18px}
.qtop .round{width:40px;height:40px}
.seg{flex:1;display:flex;gap:4px}
.seg i{flex:1;height:6px;border-radius:9px;background:var(--hair);transition:background .4s}
.seg i.done{background:var(--ink-3)}
.seg i.r{background:var(--ok)}.seg i.f{background:var(--bad)}
.seg i.cur{background:var(--ink)}
.qcount{font-size:14px;font-weight:700;color:var(--ink-2);font-variant-numeric:tabular-nums;min-width:40px;text-align:right}
.qbody{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:18px;padding-bottom:12px;min-height:0}
.qcard{border-radius:28px;padding:22px 20px;display:flex;flex-direction:column;gap:12px;animation:cardIn .55s cubic-bezier(.2,.9,.25,1.1) both}
@keyframes cardIn{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
.qmeta{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:650;color:var(--ink-2)}
.qmeta .dot{width:8px;height:8px;border-radius:50%;background:var(--c)}
.qmeta .lab{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qmeta .typ{white-space:nowrap;margin-left:auto;font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3)}
.qtext{font-size:22px;font-weight:700;letter-spacing:-.022em;line-height:1.28;text-wrap:balance}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:15px 16px;border-radius:20px;font-size:16px;font-weight:550;line-height:1.3;min-height:58px}
.opt .k{width:28px;height:28px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--ink-3);border:1.5px solid var(--hair)}
.opt .k svg{width:16px;height:16px}
.opt.ok{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 45%,transparent)}
.opt.ok .k{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.no{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 45%,transparent);animation:shake .4s}
.opt.no .k{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.dim{opacity:.5}
.opt[disabled]{cursor:default}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
.wfrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.wf{height:96px;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:17px;font-weight:700}
.wf svg{width:28px;height:28px}
.wf.ok{background:var(--ok-soft)}.wf.no{background:var(--bad-soft);animation:shake .4s}.wf.dim{opacity:.45}
.hint{font-size:13.5px;color:var(--ink-3);padding:0 4px}
/* ordering */
.slots{display:flex;flex-direction:column;gap:8px}
.slot{display:flex;align-items:center;gap:12px;min-height:52px;padding:10px 14px;border-radius:16px;border:1.5px dashed var(--hair);font-size:15px;font-weight:550;text-align:left;width:100%}
.slot .n{width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:13px;font-weight:700;background:var(--hair);color:var(--ink-2)}
.slot.filled{border-style:solid;border-color:var(--edge-2);background:var(--glass-strong)}
.slot.filled .n{background:var(--c,var(--accent));color:#fff}
.slot.ok{background:var(--ok-soft)}.slot.ok .n{background:var(--ok)}
.slot.no{background:var(--bad-soft)}.slot.no .n{background:var(--bad)}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.pchip{padding:11px 14px;border-radius:16px;font-size:15px;font-weight:550;text-align:left;line-height:1.3;max-width:100%}
/* pairs */
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pairs .colp{display:flex;flex-direction:column;gap:10px;min-width:0}
.pc{min-height:60px;padding:10px 12px;border-radius:16px;font-size:14.5px;font-weight:600;text-align:left;line-height:1.25;width:100%;overflow-wrap:anywhere}
.pc.sel{box-shadow:inset 0 0 0 2px var(--accent), var(--shadow)}
.pc.done{color:var(--ink);opacity:.95;background:color-mix(in srgb,var(--m) 22%,transparent);border-color:color-mix(in srgb,var(--m) 50%,transparent)}
.pc.wrong{animation:shake .4s;background:var(--bad-soft)}
/* feedback */
.fb{border-radius:26px;padding:18px;display:flex;flex-direction:column;gap:12px;animation:fbIn .5s cubic-bezier(.2,.9,.25,1.15) both}
@keyframes fbIn{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.fb .fh{display:flex;align-items:center;gap:12px}
.fb .badge{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;flex:none}
.fb .badge svg{width:20px;height:20px}
.fb .badge.ok{background:var(--ok)}.fb .badge.no{background:var(--bad)}
.fb .fh b{font-size:18px;font-weight:750;letter-spacing:-.02em}
.fb p{margin:0;font-size:15.5px;line-height:1.45;color:var(--ink)}
.fb .src{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-3);font-weight:600}
.fb .src svg{width:14px;height:14px}
.fb ol{margin:0;padding-left:20px;font-size:14.5px;color:var(--ink-2);display:flex;flex-direction:column;gap:3px}
.qfoot{padding-top:10px}
.fig{margin:2px -4px 0;padding:10px 8px 4px;border-radius:18px;background:color-mix(in srgb,var(--glass-soft) 70%,transparent);border:1px solid var(--edge-2)}
.fig svg{width:100%;height:auto;max-height:210px}
.fig text{font-family:var(--font);font-size:13px}
.more{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;font-size:14px;font-weight:650;color:var(--accent);padding:6px 0}
.more .chev{width:8px;height:12px;color:var(--accent);transition:transform .3s}
.more.open .chev{transform:rotate(90deg)}
.moretext{border-top:1px solid var(--hair);padding-top:12px;display:flex;flex-direction:column;gap:4px;animation:fbIn .4s both}
.moretext b{font-size:13px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em}
.moretext p{font-size:15px;line-height:1.5;color:var(--ink-2)}
/* result */
.res{display:flex;flex-direction:column;gap:22px;align-items:stretch;padding-top:8px;animation:viewIn .5s both}
.res .ring{width:170px;height:170px;margin:6px auto 0}
.res .ring .num b{font-size:44px}
.res h1{text-align:center}
.res .sub{text-align:center;color:var(--ink-2);margin:-12px 0 0}
.rlist{border-radius:24px;overflow:hidden}
.ritem{display:flex;gap:12px;padding:13px 16px;align-items:flex-start;font-size:14.5px;line-height:1.35}
.ritem+.ritem{border-top:1px solid var(--hair)}
.ritem .m{width:22px;height:22px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;margin-top:1px}
.ritem .m svg{width:13px;height:13px}
.ritem .m.ok{background:var(--ok)}.ritem .m.no{background:var(--bad)}
.ritem small{display:block;color:var(--ink-3);font-size:12.5px;margin-top:2px}
.empty{padding:18px;text-align:center;color:var(--ink-3);font-size:14.5px}
.toast{position:fixed;z-index:60;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translate(-50%,-150%);padding:12px 18px;border-radius:99px;font-weight:650;font-size:14.5px;transition:transform .45s cubic-bezier(.2,.9,.25,1.2)}
.toast.show{transform:translate(-50%,0)}

/* Lösungsweg-Trainer */
.seg i.h{background:var(--warn)}
.feature{border-radius:24px;padding:16px;display:flex;align-items:center;gap:14px;text-align:left;width:100%}
.feature .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.feature .t .eyebrow{font-size:11.5px}
.feature .t b{font-size:17px;font-weight:700;letter-spacing:-.018em;line-height:1.25}
.feature .t small{font-size:13px;color:var(--ink-3)}
.feature .round{width:40px;height:40px;background:var(--accent);color:#fff;box-shadow:0 8px 18px -8px var(--accent)}
.feature .round svg{width:17px;height:17px}
.st{font-size:12px;font-weight:700;padding:4px 9px;border-radius:99px;background:var(--glass-soft);color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.st.new{color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}
.st.due{color:var(--warn);background:color-mix(in srgb,var(--warn) 16%,transparent)}
.st.ok{color:var(--ok);background:var(--ok-soft)}
.task .qtext{font-size:21px}
.angabe{font-size:15.5px;line-height:1.48;margin:0;color:var(--ink)}
.geg{display:flex;flex-wrap:wrap;gap:6px}
.geg span{font-size:13.5px;font-weight:600;padding:6px 10px;border-radius:12px;background:var(--glass-soft);border:1px solid var(--edge-2);font-variant-numeric:tabular-nums}
.ges{font-size:14.5px;color:var(--ink-2);line-height:1.4}.ges b{color:var(--ink)}
.path{border-radius:24px;overflow:hidden}
.path .ph{font-size:12px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;padding:12px 16px 4px}
.pstep{display:flex;gap:12px;padding:11px 16px;align-items:flex-start}
.pstep+.pstep{border-top:1px solid var(--hair)}
.pstep .n{width:24px;height:24px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:700;background:var(--ok);margin-top:1px}
.pstep .n.half{background:var(--warn)}.pstep .n.no{background:var(--bad)}
.pstep>div{font-size:14.5px;font-weight:600;line-height:1.35;min-width:0}
.pstep small{display:block;color:var(--ink-2);font-weight:500;font-size:13.5px;margin-top:3px;font-variant-numeric:tabular-nums;line-height:1.45}
.stepcard{border-radius:28px;padding:20px;display:flex;flex-direction:column;gap:14px;animation:cardIn .55s cubic-bezier(.2,.9,.25,1.1) both;scroll-margin-top:8px}
.stepcard .eyebrow{color:var(--c,var(--ink-3))}
.stepq{font-size:19px;font-weight:700;letter-spacing:-.02em;line-height:1.3;text-wrap:balance}
.calc{font-size:15px;font-weight:650;padding:12px 14px;border-radius:14px;background:color-mix(in srgb,var(--c,var(--accent)) 12%,transparent);border:1px solid color-mix(in srgb,var(--c,var(--accent)) 28%,transparent);font-variant-numeric:tabular-nums;line-height:1.5;overflow-wrap:anywhere}
.fb .badge.half{background:var(--warn)}
.tsrc{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-3);font-weight:600}
.tsrc svg{width:14px;height:14px;flex:none}
.fb .tip{font-size:14px;color:var(--ink-3)}
.ritem .m.half{background:var(--warn)}
@media (max-width:380px){ .tab{font-size:9.5px} h1{font-size:30px} .hero{grid-template-columns:1fr;justify-items:center;text-align:center} .hero-t{align-items:center} .qtext{font-size:20px} .statgrid b{font-size:22px} }
@media (prefers-reduced-motion: reduce){ *,*::before,*::after{animation:none!important;transition:none!important} }

}
function taskRow(a){
  return `<button class="row press" data-act="task" data-id="${a.id}"><div class="t"><b>${esc(a.titel)}</b><small>${esc(a.s)} · ${a.schritte.length} Schritte</small></div>${tStatus(a)}${I.chev}</button>`;

      <div class="week">${wk.map(x=>`<div class="col${x.t?" today":""}"><div class="b" style="height:100%"><div style="height:${Math.round(x.n/mx*100)}%"></div></div><span>${x.l}</span></div>`).join("")}</div></div>
    <div class="panel glass"><div class="sec-h" style="padding:0"><h2>Lernstufen</h2><small>${all} Fragen</small></div>

    ${AUFG.length ? (()=>{ const runs = AUFG.filter(a=>S.aufg[a.id]); const avg = runs.length ? runs.reduce((x,a)=>x+S.aufg[a.id].best,0)/runs.length : 0; const ok = runs.filter(a=>S.aufg[a.id].best>=1).length;

      <div class="boxrow"><span>Fehlerfrei</span><div class="bar"><div style="width:${ok/AUFG.length*100}%;background:var(--ok)"></div></div><span>${ok}</span></div></div>
      <p class="legend" style="margin:0">Im Schnitt ${Math.round(avg*100)} % der Schritte im besten Durchgang richtig. Ein Schritt zählt voll, wenn er im ersten Versuch sitzt, halb im zweiten.</p></div>`; })() : ""}
    <div class="sec"><div class="sec-h"><h2>Nach Fach</h2></div>${subjectList()}</div>
    ${(()=>{ const o = S.notes.filter(n=>!n.sent).length; return `<div class="panel glass"><div class="sec-h" style="padding:0"><h2>Anmerkungen</h2><small>${o ? `${o} offen` : `${S.notes.length} gesendet`}</small></div>
      <p class="legend" style="margin:0">Fehler in einer Frage, unnötige Fragen oder Wünsche zu einem Thema: Während einer Frage oben rechts auf den Stift tippen. Die Anmerkungen gehen als Issue an GitHub und werden beim nächsten Patch eingearbeitet.</p>
      <div class="btnrow" style="margin-top:0"><button class="btn2 press" data-act="notes">Verwalten</button>${o ? `<button class="btn2 acc press" data-act="nsend">Senden (${o})</button>` : `<button class="btn2 press" data-act="note-app">Neue Anmerkung</button>`}</div></div>`; })()}
    <div class="panel glass"><div class="sec-h" style="padding:0"><h2>Daten sichern</h2><small>Version ${APP_VERSION}</small></div>
      <p class="legend" style="margin:0">Dein Lernstand liegt nur auf diesem Gerät. Ein Backup kannst du in Dateien oder iCloud ablegen und auf einem neuen Gerät wieder einlesen.</p>

function render(){
  const app = $("#app");

/* sheet */
/* v1.4: Blatt mit Schließen-Knopf, Wischen nach unten und gesperrtem Hintergrund */
let lockY = 0;
function lockPage(){ if(document.body.classList.contains("locked")) return; lockY = window.scrollY; document.body.style.top = -lockY+"px"; document.body.classList.add("locked"); }
function unlockPage(){ if(!document.body.classList.contains("locked")) return; document.body.classList.remove("locked"); document.body.style.top = ""; window.scrollTo(0, lockY); }
function openSheet(html){
  const sh=$("#sheet"), sc=$("#scrim"); sh.innerHTML='<div class="grab"></div><button class="sx press" data-act="close" aria-label="Schließen">'+I.close+'</button>'+html; sh.hidden=false; sc.hidden=false;
  sh.scrollTop=0; sh.style.transform=""; delete sh.dataset.kind; lockPage();
  requestAnimationFrame(()=>{sh.classList.add("show"); sc.classList.add("show");});
}
function closeSheet(){
  const sh=$("#sheet"), sc=$("#scrim"); if(sh.hidden) return;
  sh.classList.remove("drag"); sh.style.transform=""; sh.classList.remove("show"); sc.classList.remove("show"); sc.style.opacity="";
  unlockPage();
  setTimeout(()=>{ if(!sh.classList.contains("show")){ sh.hidden=true; sc.hidden=true; } },420);
}
(() => {
  const sh = document.getElementById("sheet"), sc = document.getElementById("scrim");
  let y0 = null, t0 = 0, dy = 0, drag = false;
  sh.addEventListener("touchstart", e => { if (sh.scrollTop > 0 || e.target.closest("textarea,input")) { y0 = null; return; } y0 = e.touches[0].clientY; t0 = Date.now(); dy = 0; drag = false; }, {passive:true});
  sh.addEventListener("touchmove", e => {
    if (y0 === null) return;
    dy = e.touches[0].clientY - y0;
    if (!drag && dy > 6 && sh.scrollTop <= 0) { drag = true; sh.classList.add("drag"); }
    if (drag) { e.preventDefault(); const d = Math.max(0, dy); sh.style.transform = `translate(-50%, ${d}px)`; sc.style.opacity = String(Math.max(0, 1 - d/400)); }
  }, {passive:false});
  sh.addEventListener("touchend", () => {
    if (!drag) { y0 = null; return; }
    const v = dy / Math.max(1, Date.now() - t0);
    sh.classList.remove("drag"); sc.style.opacity = "";
    if (dy > 110 || v > .6) closeSheet(); else sh.style.transform = "";
    y0 = null; drag = false;
  });
  /* Hintergrund nicht mitscrollen lassen */
  sc.addEventListener("touchmove", e => e.preventDefault(), {passive:false});
})();
function subjectSheet(f){
  const qs=qsOf(f), topics=[...new Set(qs.map(q=>q.t))], due=qs.filter(q=>isDue(q.id)).length, fresh=qs.filter(q=>!card(q.id)).length;
  openSheet(`<div style="display:flex;gap:14px;align-items:center;margin-bottom:14px">${icon(f)}<div><h2>${FACH[f].n}</h2><p class="sub" style="margin:0">${qs.length} Fragen · ${fresh} neu · ${due} fällig</p></div></div>
    <button class="cta press" style="--accent:${cssC(f)}" data-act="start-subject" data-f="${f}">${I.play}Ganzes Fach · 10 Fragen</button>
    <div style="margin-top:18px">${topics.map(t=>{const tq=qs.filter(q=>q.t===t),m=mastery(tq);return `<button class="topic press" data-act="start-topic" data-f="${f}" data-t="${esc(t)}"><b>${esc(t)}</b><small>${tq.length} · ${Math.round(m*100)} %</small>${I.chev}</button>`}).join("")}</div>
    ${AUFG.some(a=>a.f===f) ? `<h2 style="margin:22px 0 6px;font-size:17px">Lösungswege</h2>${AUFG.filter(a=>a.f===f).map(a=>`<button class="topic press" data-act="task" data-id="${a.id}"><b>${esc(a.titel)}</b>${tStatus(a)}${I.chev}</button>`).join("")}` : ""}
    <button class="link" style="margin-top:10px;display:flex;align-items:center;gap:8px" data-act="note-fach" data-f="${f}"><span style="width:18px;height:18px;display:inline-grid">${I.note}</span>Wunsch oder Anmerkung zu diesem Fach</button>`);
}
function resetSheet(){
  openSheet(`<h2>Fortschritt zurücksetzen?</h2><p class="sub">Alle Lernstufen, Aufgaben-Ergebnisse, die Serie und der Verlauf auf diesem Gerät werden gelöscht. Die Fragen bleiben erhalten.</p>
    <div class="btnrow"><button class="btn2 press" data-act="close">Abbrechen</button><button class="btn2 danger press" data-act="reset-yes">Zurücksetzen</button></div>`);
}
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),2000); }

/* quiz */
let Q = null;
function startQuiz(list, label){
  if(!list.length){ toast("Gerade keine Fragen in dieser Auswahl"); return; }
  closeSheet();
  Q = {list, i:0, res:[], label, t0:Date.now()};
  const el=$("#quiz"); el.hidden=false; document.body.style.overflow="hidden";
  renderQ();
}
function endQuiz(){ $("#quiz").hidden=true; $("#quiz").innerHTML=""; document.body.style.overflow=""; Q=null; render(); }
function segs(){ return Q.list.map((_,k)=>`<i class="${k<Q.i? (Q.res[k]?"r":"f") : k===Q.i?"cur":""}"></i>`).join(""); }
function renderQ(){
  const q=Q.list[Q.i], el=$("#quiz");
  Q.state = {done:false};
  let body="";
  if(q.typ==="mc"){
    Q.state.opts = q.v && q.a.every(x=>/^(Linie|Kurve|Pfeil) /.test(x)) ? q.a.map((t,k)=>({t,ok:k===0})).sort((x,y)=>x.t.localeCompare(y.t,"de")) : shuffle(q.a.map((t,k)=>({t,ok:k===0})));
    body = `<div class="opts">${Q.state.opts.map((o,k)=>`<button class="opt glass press" data-act="mc" data-k="${k}"><span class="k">${q.v ? "" : "ABCD"[k]}</span><span>${esc(o.t)}</span></button>`).join("")}</div>`;
  } else if(q.typ==="wf"){
    body = `<div class="wfrow"><button class="wf glass press" data-act="wf" data-v="1">${I.check}Wahr</button><button class="wf glass press" data-act="wf" data-v="0">${I.x}Falsch</button></div>`;
  } else if(q.typ==="ord"){
    Q.state.pool = shuffle(q.steps.map((t,k)=>({t,k}))); Q.state.picked=[];
    body = `<div class="slots" id="slots"></div><div class="hint">Tippe die Schritte in der richtigen Reihenfolge an. Antippen eines Platzes nimmt den Schritt zurück.</div><div class="pool" id="pool"></div><div id="ordbtn"></div>`;
  } else {
    const L=shuffle(q.pairs.map((p,k)=>({t:p[0],k}))), R=shuffle(q.pairs.map((p,k)=>({t:p[1],k})));
    Q.state.L=L; Q.state.R=R; Q.state.sel=null; Q.state.matched={}; Q.state.mR={}; Q.state.miss=0;
    body = `<div class="hint">Tippe links einen Begriff an, dann rechts die passende Bedeutung.</div><div class="pairs"><div class="colp" id="pl"></div><div class="colp" id="pr"></div></div>`;
  }
  el.innerHTML = `<div class="ambient tint" style="--tint:${cssC(q.f)}"><i></i><i></i><i></i><i></i></div>
  <div class="qwrap"><div class="qtop"><button class="round glass press" data-act="quit" aria-label="Beenden">${I.close}</button><div class="seg">${segs()}</div><span class="qcount">${Q.i+1}/${Q.list.length}</span><button class="round glass press nbtn" data-act="note" aria-label="Anmerkung zu dieser Frage">${I.note}</button></div>
  <div class="qbody" id="qbody"><div class="qcard glass" style="--c:${cssC(q.f)}"><div class="qmeta"><span class="dot"></span><span class="lab">${FACH[q.f].n} · ${esc(q.t)}</span><span class="typ">${q.v ? "Bild" : TYPNAME[q.typ]}</span></div><div class="qtext">${esc(q.q)}</div>${q.v && typeof FIG!=="undefined" && FIG[q.v] ? `<div class="fig">${FIG[q.v]()}</div>` : ""}</div>${body}<div id="fb"></div></div>
  <div class="qfoot" id="qfoot"></div></div>`;
  if(q.typ==="ord") drawOrd(); if(q.typ==="pair") drawPairs();
  el.querySelector("#qbody").scrollTop=0;
}
function drawOrd(){
  const q=Q.list[Q.i], st=Q.state, n=q.steps.length;
  $("#slots").innerHTML = Array.from({length:n},(_,k)=>{const p=st.picked[k];
    const cls = p ? "filled"+(st.done ? (p.k===k?" ok":" no") : "") : "";
    return `<button class="slot ${cls}" style="--c:${cssC(q.f)}" data-act="unpick" data-k="${k}" ${!p||st.done?"disabled":""}><span class="n">${k+1}</span><span>${p?esc(p.t):""}</span></button>`}).join("");
  $("#pool").innerHTML = st.done ? "" : st.pool.map((p,k)=>`<button class="pchip glass press" data-act="pick" data-k="${k}">${esc(p.t)}</button>`).join("");
  $("#ordbtn").innerHTML = (!st.done && st.picked.length===n) ? `<button class="cta press" data-act="ord-check">Prüfen</button>` : "";
}
function drawPairs(){
  const st=Q.state, q=Q.list[Q.i], hues=["var(--c-hydro)","var(--c-bsk)","var(--c-phys)","var(--c-binf)","var(--c-stat)"];
  const mk=(side,arr)=>arr.map((p,k)=>{const m=side==="L"?st.matched[p.k]:st.mR[p.k]; const hk=side==="L"?p.k:(m===undefined?p.k:m); const sel=st.sel&&st.sel.side===side&&st.sel.i===k;
    return `<button class="pc glass press${m!==undefined?" done":""}${sel?" sel":""}" style="--m:${hues[hk%hues.length]}" data-act="pc" data-side="${side}" data-i="${k}" ${m!==undefined||st.done?"disabled":""}>${esc(p.t)}</button>`}).join("");
  $("#pl").innerHTML=mk("L",st.L); $("#pr").innerHTML=mk("R",st.R);
}
function haptic(ok){ try{ navigator.vibrate && navigator.vibrate(ok?12:[18,40,18]); }catch(e){} }
function record(ok){
  const q=Q.list[Q.i], c=S.cards[q.id]||{b:0,r:0,w:0}, dn=dayNum();
  if(ok){ c.b=Math.min(5,c.b+1); c.r++; } else { c.b=1; c.w++; }
  c.due = dn + (ok ? INTERVAL[c.b] : 0); c.last=ok; S.cards[q.id]=c;
  const k=dayKey(); const d=S.days[k]||{n:0,r:0}; d.n++; if(ok) d.r++; S.days[k]=d; save();
  Q.res[Q.i]=ok; Q.state.done=true; haptic(ok);
  const extra = q.typ==="ord" && !ok ? `<ol>${q.steps.map(s=>`<li>${esc(s)}</li>`).join("")}</ol>` : "";
  const pairExtra = q.typ==="pair" && !ok ? `<p style="color:var(--ink-2);font-size:14px">${Q.state.miss} ${Q.state.miss===1?"Fehlversuch":"Fehlversuche"} beim Zuordnen – die Frage kommt bald wieder.</p>` : "";

/* Lösungsweg-Trainer */
let A = null;
const fmt = r => esc(r).replace(/\n/g, "<br>");
function startTask(id){
  const a = ABYID[id]; if(!a) return;
  closeSheet();
  A = {a, i:0, sc:[], tries:0, res:false, t0:Date.now()};
  $("#quiz").hidden = false; document.body.style.overflow = "hidden";
  renderTask();
}
function endTask(){ $("#quiz").hidden = true; $("#quiz").innerHTML = ""; document.body.style.overflow = ""; A = null; render(); }
function aSegs(){ return A.a.schritte.map((_,k)=>`<i class="${k<A.i ? (A.sc[k]===1?"r":A.sc[k]===.5?"h":"f") : k===A.i ? "cur" : ""}"></i>`).join(""); }
function taskHead(a){
  return `<div class="qcard glass task" style="--c:${cssC(a.f)}"><div class="qmeta"><span class="dot"></span><span class="lab">${FACH[a.f].n} · ${esc(a.t)}</span><span class="typ">Lösungsweg</span></div>
    <div class="qtext">${esc(a.titel)}</div>
    ${a.v && typeof FIG!=="undefined" && FIG[a.v] ? `<div class="fig">${FIG[a.v]()}</div>` : ""}
    <p class="angabe">${fmt(a.angabe)}</p>
    ${a.geg && a.geg.length ? `<div class="geg">${a.geg.map(g=>`<span>${esc(g)}</span>`).join("")}</div>` : ""}
    ${a.ges ? `<div class="ges"><b>Gesucht:</b> ${esc(a.ges)}</div>` : ""}
    <div class="tsrc">${I.book}${esc(a.s)}</div></div>`;
}
function pstep(s, k){
  const sc = A.sc[k], cls = sc===1 ? "" : sc===.5 ? " half" : " no";
  return `<div class="pstep"><span class="n${cls}">${k+1}</span><div>${esc(s.o[0][0])}${s.r ? `<small>${fmt(s.r)}</small>` : ""}</div></div>`;
}
function renderTask(){
  const a = A.a, st = a.schritte[A.i], n = a.schritte.length, el = $("#quiz");
  A.tries = 0; A.res = false;
  A.opts = shuffle(st.o.map((o,k)=>({t:o[0], e:o[1], ok:k===0})));
  el.innerHTML = `<div class="ambient tint" style="--tint:${cssC(a.f)}"><i></i><i></i><i></i><i></i></div>
  <div class="qwrap"><div class="qtop"><button class="round glass press" data-act="a-quit" aria-label="Beenden">${I.close}</button><div class="seg">${aSegs()}</div><span class="qcount">${A.i+1}/${n}</span><button class="round glass press nbtn" data-act="note" aria-label="Anmerkung zu dieser Aufgabe">${I.note}</button></div>
  <div class="qbody" id="qbody">${taskHead(a)}
    ${A.i ? `<div class="path glass"><div class="ph">Bisheriger Lösungsweg</div>${a.schritte.slice(0,A.i).map(pstep).join("")}</div>` : ""}
    <div class="stepcard glass" id="stepcard" style="--c:${cssC(a.f)}"><div class="eyebrow">Schritt ${A.i+1} von ${n}</div><div class="stepq">${esc(st.f)}</div>
      <div class="opts">${A.opts.map((o,k)=>`<button class="opt glass press" data-act="a-opt" data-k="${k}"><span class="k">${"ABCD"[k]}</span><span>${esc(o.t)}</span></button>`).join("")}</div></div>
    <div id="afb"></div></div>
  <div class="qfoot" id="qfoot"></div></div>`;
  const b = $("#qbody");
  if (A.i) requestAnimationFrame(()=>{ const c = $("#stepcard"); b.scrollTop = c.getBoundingClientRect().top - b.getBoundingClientRect().top + b.scrollTop - 6; });
  else b.scrollTop = 0;
}
function aPick(k){
  const o = A.opts[k], btns = document.querySelectorAll("#stepcard .opt");
  if (o.ok) { aResolve(A.tries===0 ? 1 : .5, null); return; }
  A.tries++; haptic(false);
  btns[k].classList.add("no"); btns[k].disabled = true; btns[k].querySelector(".k").innerHTML = I.x;
  if (A.tries >= 2) { aResolve(0, k); return; }
  $("#afb").innerHTML = `<div class="fb glass"><div class="fh"><span class="badge no">${I.x}</span><b>Nicht ganz</b></div><p>${esc(o.e)}</p><p class="tip">Versuch es noch einmal – eine Möglichkeit ist schon raus.</p></div>`;
  setTimeout(()=>{ const b=$("#qbody"); b.scrollTo({top:b.scrollHeight, behavior:"smooth"}); }, 60);
}
function aResolve(score, kWrong){
  const a = A.a, st = a.schritte[A.i], n = a.schritte.length, btns = document.querySelectorAll("#stepcard .opt");
  const ci = A.opts.findIndex(o=>o.ok), c = A.opts[ci];
  A.res = true; A.sc[A.i] = score;
  btns.forEach((b,j)=>{ b.disabled = true; if (j===ci) { b.classList.add("ok"); b.querySelector(".k").innerHTML = I.check; } else if (!b.classList.contains("no")) b.classList.add("dim"); });
  if (score > 0) haptic(true);
  const k = dayKey(), d = S.days[k] || {n:0,r:0}; d.n++; if (score===1) d.r++; S.days[k] = d; save();
  const head = score===1 ? ["Richtig","Genau","Sitzt"][Math.floor(Math.random()*3)] : score===.5 ? "Im zweiten Anlauf" : "So geht es weiter";
  $("#afb").innerHTML = `<div class="fb glass" style="--c:${cssC(a.f)}"><div class="fh"><span class="badge ${score===1?"ok":score===.5?"half":"no"}">${score>0?I.check:I.x}</span><b>${head}</b></div>
    ${kWrong!==null ? `<p><b>Deine Wahl:</b> ${esc(A.opts[kWrong].e)}</p><p><b>Richtig wäre:</b> ${esc(c.t)}.</p>` : ""}
    <p>${esc(c.e)}</p>${st.r ? `<div class="calc">${fmt(st.r)}</div>` : ""}</div>`;
  $("#qfoot").innerHTML = `<button class="cta press" data-act="a-next">${A.i < n-1 ? "Nächster Schritt" : "Lösung ansehen"}</button>`;
  document.querySelector(".seg").innerHTML = aSegs().replace('class="cur"', `class="${score===1?"r":score===.5?"h":"f"}"`);
  setTimeout(()=>{ const b=$("#qbody"); b.scrollTo({top:b.scrollHeight, behavior:"smooth"}); }, 60);
}
function aNext(){ if (A.i < A.a.schritte.length-1) { A.i++; renderTask(); } else taskResult(); }
function taskResult(){
  const a = A.a, n = a.schritte.length, pts = A.sc.reduce((x,y)=>x+y,0), p = pts/n, mins = Math.max(1, Math.round((Date.now()-A.t0)/60000));
  const c = S.aufg[a.id] || {b:0, runs:0, best:0}, dn = dayNum(), good = p >= .8;
  c.b = good ? Math.min(5, c.b+1) : 1; c.due = dn + (good ? INTERVAL[c.b] : 1); c.last = p; c.best = Math.max(c.best||0, p); c.runs = (c.runs||0)+1;
  S.aufg[a.id] = c; save(); haptic(good);
  const head = p===1 ? "Fehlerfrei gelöst" : p>=.8 ? "Stark gelöst" : p>=.5 ? "Weg gefunden" : "Nochmal üben";
  const first = A.sc.filter(x=>x===1).length;
  const nx = nextTask(a.id);
  $("#quiz").innerHTML = `<div class="ambient tint" style="--tint:${cssC(a.f)}"><i></i><i></i><i></i><i></i></div><div class="qwrap"><div class="qbody"><div class="res">
    ${ring(p,170,16,p>=.5?"#7fe8a0":"#ffb199",p>=.5?"var(--ok)":"var(--bad)",`<b>${first}/${n}</b><span>im 1. Versuch</span>`)}
    <h1>${head}</h1><p class="sub">${esc(a.titel)} · ${mins} Min.</p>
    <div class="rlist glass">${a.schritte.map((s,k)=>`<div class="ritem"><span class="m ${A.sc[k]===1?"ok":A.sc[k]===.5?"half":"no"}">${A.sc[k]>0?I.check:I.x}</span><div>${esc(s.o[0][0])}${s.r?`<small>${fmt(s.r)}</small>`:""}</div></div>`).join("")}</div>
    ${a.fazit ? `<div class="fb glass"><div class="fh"><span class="badge" style="background:${cssC(a.f)}">${I.book}</span><b>Merke</b></div><p>${fmt(a.fazit)}</p><div class="src">${I.book}${esc(a.s)}</div></div>` : ""}
    <p class="legend" style="text-align:center;margin:0">${good ? `Die Aufgabe kommt in ${INTERVAL[c.b]} ${INTERVAL[c.b]===1?"Tag":"Tagen"} wieder.` : "Die Aufgabe kommt morgen wieder."}</p>
  </div></div><div class="qfoot" style="display:flex;flex-direction:column;gap:10px">
    ${p<1 ? `<button class="cta press" data-act="a-again">${I.redo}Nochmal von vorn</button>` : nx ? `<button class="cta press" data-act="task" data-id="${nx.id}">${I.play}Nächste Aufgabe</button>` : ""}
    <button class="btn2 glass press" style="height:56px;width:100%;flex:none" data-act="a-done">Fertig</button></div></div>`;
  animateRings($("#quiz"));
}

/* v1.5: Anmerkungen – sammeln, als GitHub-Issue senden */
const REPO = "TomR-z/klausurduell", TKEY = "klausurduell.ghtoken";
const getTok = () => { try { return localStorage.getItem(TKEY) || ""; } catch(e) { return ""; } };
const setTok = v => { try { v ? localStorage.setItem(TKEY, v) : localStorage.removeItem(TKEY); } catch(e) {} };
const KATS = {
  frage:   [["falsch","Inhalt falsch"],["unklar","Unklar erklärt"],["unnoetig","Frage unnötig"],["wunsch","Wunsch zum Thema"],["sonst","Sonstiges"]],
  aufgabe: [["falsch","Inhalt falsch"],["unklar","Unklar erklärt"],["unnoetig","Aufgabe unnötig"],["wunsch","Wunsch zum Thema"],["sonst","Sonstiges"]],
  fach:    [["wunsch","Mehr dazu / Wunsch"],["unnoetig","Thema unnötig"],["falsch","Etwas stimmt nicht"],["sonst","Sonstiges"]],
  app:     [["fehler","Fehler in der App"],["idee","Idee"],["sonst","Sonstiges"]]
};
let NOTE = null, NPEND = [];
function korrektText(q){
  if (q.typ === "mc") return q.a[0];
  if (q.typ === "wf") return q.c ? "wahr" : "falsch";
  if (q.typ === "ord") return q.steps.join(" → ");
  if (q.typ === "pair") return q.pairs.map(p => p[0] + " = " + p[1]).join("; ");
  return "";
}
function noteCtx(){
  if (A) { const a = A.a; return {art:"aufgabe", ref:a.id, f:a.f, t:a.t, text:a.titel, extra:"Schritt " + (A.i+1) + ": " + a.schritte[A.i].f, korrekt:a.schritte[A.i].o[0][0], s:a.s}; }
  if (Q) { const q = Q.list[Q.i]; return {art:"frage", ref:q.id, f:q.f, t:q.t, text:q.q, korrekt:korrektText(q), s:q.s}; }
  return {art:"app"};
}
function noteSheet(ctx){
  NOTE = {ctx, kat: KATS[ctx.art][0][0]};
  const tok = getTok(), what = ctx.art === "frage" ? "Frage" : ctx.art === "aufgabe" ? "Aufgabe" : "";
  const head = ctx.art === "app" ? "Fehler, Ideen oder Wünsche zur App selbst." : ctx.art === "fach" ? "Wünsche oder Hinweise zu " + FACH[ctx.f].n + ", z. B. zu einem bestimmten Thema." : "Zu dieser " + what + ". Sie wird automatisch mitgeschickt.";
  openSheet(`<h2>Anmerkung</h2><p class="sub">${head}</p>
    ${ctx.text ? `<div class="nq"><b>${esc(FACH[ctx.f].n)} · ${esc(ctx.t)}</b><br>${esc(ctx.text)}${ctx.extra ? `<br>${esc(ctx.extra)}` : ""}</div>` : ""}
    <div class="kats">${KATS[ctx.art].map(([k,n],i) => `<button class="kat press${i?"":" on"}" data-act="nkat" data-k="${k}">${n}</button>`).join("")}</div>
    <textarea id="ntext" class="ntext" placeholder="Was fällt dir auf? Was soll anders sein?"></textarea>
    ${ctx.ref ? `<label class="ncheck" id="nhide" hidden><input type="checkbox" id="nhidecb" checked>${what} ab sofort ausblenden</label>` : ""}
    <div class="btnrow"><button class="btn2 press" data-act="close">Abbrechen</button><button class="btn2 acc press" data-act="nsave">${tok ? "Senden" : "Speichern"}</button></div>
    <p class="legend" style="margin-top:12px">${tok ? "Geht sofort als Issue an GitHub." : "Wird auf diesem Gerät gesammelt. Senden kannst du unter Lernstand → Anmerkungen."}</p>`);
}
function noteTitle(n){
  const where = n.art === "app" ? "App" : FACH[n.f] ? FACH[n.f].n : n.f;
  const txt = (n.text || n.msg || "").replace(/\s+/g, " ");
  return `[${where}] ${n.katName}: ${txt.length > 70 ? txt.slice(0, 68) + "…" : txt}`;
}
function noteMd(n){
  const where = n.art === "app" ? "App allgemein" : (FACH[n.f] ? FACH[n.f].n : n.f) + (n.t ? " · " + n.t : "");
  let s = `**${n.katName}** – ${where}\n\n`;
  if (n.text) s += `> **${n.art === "aufgabe" ? "Aufgabe" : "Frage"}:** ${n.text}  \n`;
  if (n.extra) s += `> ${n.extra}  \n`;
  if (n.korrekt) s += `> **Richtig laut App:** ${n.korrekt}  \n`;
  if (n.s) s += `> **Quelle:** ${n.s}\n`;
  s += `\n${n.msg || "(ohne Text)"}\n`;
  if (n.hide) s += `\n_In der App ausgeblendet._\n`;
  const meta = JSON.stringify({id:n.id, art:n.art, ref:n.ref, f:n.f, t:n.t, kat:n.kat, hide:!!n.hide, v:n.v, ts:n.ts}).replace(/--/g, "-\\u002d");
  return s + `\n<!-- klausurduell ${meta} -->\n`;
}
async function ghIssue(title, body){
  const r = await fetch(`https://api.github.com/repos/${REPO}/issues`, {method:"POST", headers:{"Authorization":"Bearer " + getTok(), "Accept":"application/vnd.github+json", "Content-Type":"application/json"}, body:JSON.stringify({title, body})});
  if (!r.ok) throw r.status;
  return (await r.json()).number;
}
function nRefresh(){ const sh = $("#sheet"); if (sh.classList.contains("show") && sh.dataset.kind === "notes") notesSheet(); else if (!Q && !A) render(); }
async function sendNotes(list){
  let ok = 0, err = null;
  for (const n of list) { try { n.issue = await ghIssue(noteTitle(n), noteMd(n)); n.sent = true; ok++; save(); } catch(e) { err = e; break; } }
  if (err !== null) toast(err === 401 ? "Schlüssel ungültig oder abgelaufen" : (err === 403 || err === 404) ? "Schlüssel darf keine Issues anlegen" : "Senden gerade nicht möglich – bleibt gespeichert");
  else toast(ok === 1 ? `Anmerkung gesendet (#${list[0].issue})` : `${ok} Anmerkungen gesendet`);
  nRefresh();
}
function sendViaLink(){
  const open = S.notes.filter(n => !n.sent); if (!open.length) return;
  let body = "", used = [];
  for (const n of open) {
    const part = (used.length ? "\n---\n\n" : "") + noteMd(n);
    if (used.length && encodeURIComponent(body + part).length > 6500) break;
    body += part; used.push(n);
  }
  const d = new Date(), title = used.length === 1 ? noteTitle(used[0]) : `Anmerkungen (${used.length}) vom ${d.getDate()}.${d.getMonth()+1}.${d.getFullYear()}`;
  NPEND = used.map(n => n.id);
  window.open(`https://github.com/${REPO}/issues/new?title=${encodeURIComponent(title)}&body=${encodeURIComponent(body)}`, "_blank");
  const rest = open.length - used.length;
  openSheet(`<h2>Auf GitHub abgeschickt?</h2><p class="sub">GitHub ist mit ${used.length === 1 ? "deiner Anmerkung" : `${used.length} Anmerkungen`} geöffnet. Tippe dort auf „Create“ und komm zurück.${rest ? ` Die übrigen ${rest} kommen im nächsten Durchgang.` : ""}</p>
    <div class="btnrow"><button class="btn2 press" data-act="notes">Noch nicht</button><button class="btn2 acc press" data-act="nmark">Ja, abgeschickt</button></div>`);
}
function notesSheet(){

    <div class="btnrow">${open.length ? `<button class="btn2 acc press" data-act="nsend">Senden (${open.length})</button>` : ""}<button class="btn2 press" data-act="note-app">Neue Anmerkung</button></div>
    ${sent.length ? `<h3>Zuletzt gesendet</h3>${sent.slice(-5).reverse().map(n => `<div class="nitem"><div class="t">${esc(n.katName)} – ${esc(n.msg || n.text || "")}<small>${esc(label(n))}${n.issue ? ` · Issue #${n.issue}` : ""}</small></div></div>`).join("")}` : ""}
    <h3>Ausgeblendet</h3><p class="legend" style="margin:0">${nh ? `${nh} ${nh === 1 ? "Frage oder Aufgabe ist" : "Fragen oder Aufgaben sind"} ausgeblendet. Der Lernstand dazu bleibt erhalten.` : "Nichts ausgeblendet."}</p>

          : `<p class="legend" style="margin:0">Ohne Schlüssel öffnet „Senden“ GitHub mit fertig ausgefülltem Text – du tippst dort nur noch auf „Create“. Mit Schlüssel geht jede Anmerkung sofort raus.</p><button class="link" data-act="tok-setup">Schlüssel einrichten</button>`}`);

async function tokSave(){
  const v = ($("#tokin").value || "").trim();
  if (!/^(github_pat_|ghp_)\w{20,}$/.test(v)) { toast("Das sieht nicht nach einem GitHub-Schlüssel aus"); return; }
  try {
    const r = await fetch(`https://api.github.com/repos/${REPO}`, {headers:{"Authorization":"Bearer " + v, "Accept":"application/vnd.github+json"}});
    if (r.status === 401) { toast("Schlüssel ungültig oder abgelaufen"); return; }
    if (!r.ok) { toast("GitHub antwortet gerade nicht"); return; }
  } catch(e) { toast("Keine Verbindung zu GitHub"); return; }
  setTok(v); toast("Schlüssel gespeichert"); notesSheet();
}
function nSave(){
  const ctx = NOTE.ctx, msg = ($("#ntext").value || "").trim(), cb = $("#nhidecb");
  if (!msg && NOTE.kat !== "unnoetig") { toast("Schreib kurz, was dir auffällt"); $("#ntext").focus(); return; }
  const hide = !!(ctx.ref && NOTE.kat === "unnoetig" && cb && cb.checked);
  const n = {id: Date.now().toString(36) + Math.random().toString(36).slice(2,5), ts: new Date().toISOString(), v: APP_VERSION,
    art: ctx.art, ref: ctx.ref || null, f: ctx.f || null, t: ctx.t || null, text: ctx.text || "", extra: ctx.extra || "", korrekt: ctx.korrekt || "", s: ctx.s || "",
    kat: NOTE.kat, katName: KATS[ctx.art].find(k => k[0] === NOTE.kat)[1], msg, hide, sent: false};
  if (hide) { S.hide[ctx.ref] = 1; applyHidden(); }
  S.notes.push(n); save(); closeSheet(); NOTE = null;
  if (getTok()) sendNotes([n]); else { toast(hide ? "Gespeichert und ausgeblendet" : "Anmerkung gespeichert"); if (!Q && !A) render(); }
}

/* events */
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act],[data-tab]"); if(!b || b.disabled) return;
  if(b.dataset.tab){ tab=b.dataset.tab; render(); window.scrollTo({top:0}); return; }
  const a=b.dataset.act;
  if(a==="start-mix") startQuiz(buildSession(FRAGEN,10),"Training");
  else if(a==="start-quick") startQuiz(shuffle(FRAGEN).slice(0,5),"Schnelle Runde");
  else if(a==="start-wrong") startQuiz(interleave(shuffle(wrongNow()).slice(0,10)),"Fehler wiederholen");
  else if(a==="subject") subjectSheet(b.dataset.f);
  else if(a==="start-subject") startQuiz(buildSession(qsOf(b.dataset.f),10),FACH[b.dataset.f].n);
  else if(a==="start-topic"){ const f=b.dataset.f, t=b.dataset.t; startQuiz(buildSession(qsOf(f).filter(q=>q.t===t),10),`${FACH[f].n} · ${t}`); }
  else if(a==="reset") resetSheet();
  else if(a==="export") exportBackup();
  else if(a==="import") $("#importFile").click();
  else if(a==="reload") location.reload();
  else if(a==="more"){ const m=b.nextElementSibling; m.hidden=!m.hidden; b.classList.toggle("open",!m.hidden); if(!m.hidden) setTimeout(()=>m.scrollIntoView({behavior:"smooth",block:"nearest"}),50); }
  else if(a==="reset-yes"){ S={cards:{},days:{},aufg:{},notes:S.notes,hide:S.hide}; save(); closeSheet(); render(); toast("Fortschritt zurückgesetzt"); }
  else if(a==="close") closeSheet();
  else if(a==="note") noteSheet(noteCtx());
  else if(a==="note-fach") noteSheet({art:"fach", f:b.dataset.f});
  else if(a==="note-app") noteSheet({art:"app"});
  else if(a==="nkat"){ NOTE.kat=b.dataset.k; document.querySelectorAll(".kat").forEach(x=>x.classList.toggle("on", x===b)); const h=$("#nhide"); if(h) h.hidden = NOTE.kat!=="unnoetig"; }
  else if(a==="nsave") nSave();
  else if(a==="notes") notesSheet();
  else if(a==="nsend"){ const o=S.notes.filter(n=>!n.sent); if(getTok()){ closeSheet(); sendNotes(o); } else sendViaLink(); }
  else if(a==="nmark"){ S.notes.forEach(n=>{ if(NPEND.includes(n.id)) n.sent=true; }); NPEND=[]; save(); toast("Als gesendet markiert"); notesSheet(); if(!Q && !A) render(); }
  else if(a==="ndel"){ S.notes=S.notes.filter(n=>n.id!==b.dataset.id); save(); notesSheet(); if(!Q && !A) render(); }
  else if(a==="nunhide"){ S.hide={}; save(); applyHidden(); toast("Alles wieder eingeblendet"); notesSheet(); if(!Q && !A) render(); }
  else if(a==="tok-setup") tokSheet();
  else if(a==="tok-save") tokSave();
  else if(a==="tok-del"){ setTok(""); toast("Schlüssel entfernt"); notesSheet(); }
  else if(a==="quit"||a==="done") endQuiz();
  else if(a==="task"){ if(Q){ $("#quiz").innerHTML=""; Q=null; } startTask(b.dataset.id); }
  else if(a==="a-quit"||a==="a-done") endTask();
  else if(a==="a-opt"){ if(A && !A.res) aPick(+b.dataset.k); }
  else if(a==="a-next"){ if(A) aNext(); }
  else if(a==="a-again"){ if(A) startTask(A.a.id); }
  else if(a==="next") next();
  else if(a==="again-wrong"){ const w=Q.wrong; startQuiz(shuffle(w),"Fehler wiederholen"); }
  else if(Q && !Q.state.done){
    const q=Q.list[Q.i];
    if(a==="mc"){ const k=+b.dataset.k, ok=Q.state.opts[k].ok;
      document.querySelectorAll(".opt").forEach((o,j)=>{o.disabled=true; const oo=Q.state.opts[j]; if(oo.ok){o.classList.add("ok");o.querySelector(".k").innerHTML=I.check;} else if(j===k){o.classList.add("no");o.querySelector(".k").innerHTML=I.x;} else o.classList.add("dim");});
      record(ok); }
    else if(a==="wf"){ const v=b.dataset.v==="1", ok=v===q.c;
      document.querySelectorAll(".wf").forEach(o=>{o.disabled=true; const ov=o.dataset.v==="1"; if(ov===q.c) o.classList.add("ok"); else if(o===b) o.classList.add("no"); else o.classList.add("dim");});
      record(ok); }
    else if(a==="pick"){ const k=+b.dataset.k; Q.state.picked.push(Q.state.pool.splice(k,1)[0]); drawOrd(); }
    else if(a==="unpick"){ const k=+b.dataset.k; const p=Q.state.picked.splice(k,1)[0]; if(p) Q.state.pool.push(p); drawOrd(); }
    else if(a==="ord-check"){ const ok=Q.state.picked.every((p,k)=>p.k===k); Q.state.done=true; drawOrd(); Q.state.done=false; record(ok); }
    else if(a==="pc"){ const st=Q.state, side=b.dataset.side, i=+b.dataset.i;
      if(!st.sel || st.sel.side===side){ st.sel={side,i}; drawPairs(); return; }
      const l = side==="R" ? st.L[st.sel.i] : st.L[i], r = side==="R" ? st.R[i] : st.R[st.sel.i];
      if(l.k===r.k || q.pairs[l.k][1]===q.pairs[r.k][1]){ st.matched[l.k]=true; st.mR[r.k]=l.k; st.sel=null; drawPairs(); haptic(true);
        if(Object.keys(st.matched).length===q.pairs.length){ record(st.miss===0); } }
      else { st.miss++; st.sel=null; haptic(false); drawPairs(); const w=document.querySelectorAll(`.pc[data-side="${side}"]`)[i]; if(w){w.classList.add("wrong"); setTimeout(()=>w.classList.remove("wrong"),450);} }
    }
  }
});
$("#scrim").addEventListener("click", closeSheet);
document.addEventListener("keydown", e => {
  if(e.target.closest && e.target.closest("textarea,input")) return;
  if(!$("#sheet").hidden) { if(e.key==="Escape") closeSheet(); return; }
  if(A && !$("#quiz").hidden){
    if(e.key==="Escape"){ endTask(); return; }
    if(/^[1-4]$/.test(e.key)){ const o=document.querySelectorAll("#stepcard .opt")[+e.key-1]; if(o && !o.disabled) o.click(); return; }
    if(e.key==="Enter"||e.key===" "){ const n=document.querySelector('[data-act="a-next"]'); if(n){ e.preventDefault(); n.click(); } }
    return;
  }
  if(!Q || $("#quiz").hidden) return;
  if(e.key==="Escape"){ endQuiz(); return; }
  const q=Q.list[Q.i];
  if(Q.state && Q.state.done && (e.key==="Enter"||e.key===" ")){ e.preventDefault(); const n=document.querySelector('[data-act="next"]'); if(n) n.click(); return; }
  if(q && !Q.state.done && q.typ==="mc" && /^[1-4]$/.test(e.key)){ const o=document.querySelectorAll(".opt")[+e.key-1]; if(o) o.click(); }
  if(q && !Q.state.done && q.typ==="wf" && /^[wf]$/i.test(e.key)){ document.querySelector(`.wf[data-v="${e.key.toLowerCase()==="w"?1:0}"]`).click(); }
});
async function exportBackup(){
  if(framed){ toast("Backup gibt es in der installierten App"); return; }
  const data = JSON.stringify({app:"klausurduell", version:APP_VERSION, saved:new Date().toISOString(), state:S});
  const name = `Klausurduell Backup ${dayKey()}.json`;
  try{
    const file = new File([data], name, {type:"application/json"});
    if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:"Klausurduell Backup"}); return; }
  }catch(e){ if(e && e.name==="AbortError") return; }
  try{ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([data],{type:"application/json"})); a.download=name; document.body.appendChild(a); a.click(); a.remove(); toast("Backup gespeichert"); }
  catch(e){ toast("Speichern hier nicht möglich"); }
}
document.addEventListener("change", e => {
  if(e.target.id!=="importFile" || !e.target.files[0]) return;
  const r=new FileReader();
  r.onload=()=>{ try{ const d=JSON.parse(r.result); if(d.app!=="klausurduell"||!d.state||!d.state.cards) throw 0;
      S={cards:d.state.cards||{}, days:d.state.days||{}, aufg:d.state.aufg||{}, notes:d.state.notes||S.notes||[], hide:d.state.hide||{}}; applyHidden(); save(); render(); toast("Backup geladen"); }
    catch(err){ toast("Diese Datei ist kein Klausurduell-Backup"); } e.target.value=""; };
  r.readAsText(e.target.files[0]);
});
/* Offline-App: nur auf der eigenen Adresse, nicht im Artifact-Rahmen */
let framed=true; try{ framed = window.top!==window; }catch(e){}
if(!framed && "serviceWorker" in navigator && location.protocol==="https:"){
  navigator.serviceWorker.register("sw.js").then(reg=>{
    reg.addEventListener("updatefound",()=>{ const w=reg.installing; if(!w) return;
      w.addEventListener("statechange",()=>{ if(w.state==="installed" && navigator.serviceWorker.controller){
        const t=$("#toast"); t.innerHTML='Neue Version da · <button data-act="reload" style="color:var(--accent);font-weight:700">Aktualisieren</button>'; t.classList.add("show"); } }); });
  }).catch(()=>{});
  if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});
}
render();
})();
