<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Klausurduell">
<meta name="theme-color" content="#eef1f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#07090f" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
<title>Klausurduell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one-column iOS-style app, large titles, floating Liquid-Glass tab bar over a slow ambient light field. */
:root{
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Inter", "Segoe UI", system-ui, sans-serif;
  --bg:#eef1f6; --ink:#0d1220; --ink-2:#4a5368; --ink-3:#8a93a6;
  --glass:rgba(255,255,255,.52); --glass-strong:rgba(255,255,255,.72); --glass-soft:rgba(255,255,255,.34);
  --edge:rgba(255,255,255,.75); --edge-2:rgba(255,255,255,.25); --hair:rgba(13,18,32,.08);
  --shadow:0 18px 40px -18px rgba(28,40,80,.28), 0 2px 6px -2px rgba(28,40,80,.08);
  --spec:rgba(255,255,255,.85);
  --accent:#0a7cff; --accent-ink:#ffffff;
  --ok:#1fa64a; --ok-soft:rgba(52,199,89,.16); --bad:#e5342a; --bad-soft:rgba(255,69,58,.14); --warn:#f59e0b;
  --blob1:#7cc4ff; --blob2:#9be7d0; --blob3:#ffc4a3; --blob4:#c7b8ff;
  --scrim:rgba(10,14,25,.28);
  --c-hydro:#1aa3e0; --c-phys:#5e5ce6; --c-bsk:#f08a00; --c-bauko:#ef4136; --c-binf:#22a556; --c-stat:#a64fd9; --c-dap:#d9467a;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#07090f; --ink:#f3f5fa; --ink-2:#b3bacb; --ink-3:#7b8397;
  --glass:rgba(40,46,62,.42); --glass-strong:rgba(56,63,84,.62); --glass-soft:rgba(30,35,48,.32);
  --edge:rgba(255,255,255,.18); --edge-2:rgba(255,255,255,.05); --hair:rgba(255,255,255,.08);
  --shadow:0 20px 44px -18px rgba(0,0,0,.7), 0 2px 6px -2px rgba(0,0,0,.4);
  --spec:rgba(255,255,255,.22);
  --accent:#2f8cff; --ok:#34c759; --ok-soft:rgba(52,199,89,.3); --bad:#ff5a4f; --bad-soft:rgba(255,69,58,.26);
  --blob1:#1d4f9a; --blob2:#0f5d55; --blob3:#6b2f3a; --blob4:#3a2c7a; --scrim:rgba(0,0,0,.5);
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#07090f; --ink:#f3f5fa; --ink-2:#b3bacb; --ink-3:#7b8397;
  --glass:rgba(40,46,62,.42); --glass-strong:rgba(56,63,84,.62); --glass-soft:rgba(30,35,48,.32);
  --edge:rgba(255,255,255,.18); --edge-2:rgba(255,255,255,.05); --hair:rgba(255,255,255,.08);
  --shadow:0 20px 44px -18px rgba(0,0,0,.7), 0 2px 6px -2px rgba(0,0,0,.4);
  --spec:rgba(255,255,255,.22);
  --accent:#2f8cff; --ok:#34c759; --ok-soft:rgba(52,199,89,.3); --bad:#ff5a4f; --bad-soft:rgba(255,69,58,.26);
  --blob1:#1d4f9a; --blob2:#0f5d55; --blob3:#6b2f3a; --blob4:#3a2c7a; --scrim:rgba(0,0,0,.5);
  color-scheme:dark }

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.4;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;letter-spacing:-.011em}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
svg{display:block}

/* ambient light field */
.ambient{position:fixed;inset:-20%;z-index:0;pointer-events:none;filter:blur(60px) saturate(140%);opacity:.95}
.ambient i{position:absolute;border-radius:50%;opacity:.75;animation:drift 26s ease-in-out infinite alternate}
.ambient i:nth-child(1){width:55vmax;height:55vmax;left:-5%;top:-8%;background:var(--blob1)}
.ambient i:nth-child(2){width:46vmax;height:46vmax;right:-8%;top:10%;background:var(--blob2);animation-delay:-8s}
.ambient i:nth-child(3){width:50vmax;height:50vmax;left:15%;bottom:-15%;background:var(--blob3);animation-delay:-14s}
.ambient i:nth-child(4){width:36vmax;height:36vmax;right:10%;bottom:5%;background:var(--blob4);animation-delay:-20s}
.ambient.tint i:nth-child(1),.ambient.tint i:nth-child(4){background:var(--tint,var(--blob1));opacity:.42}
@keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(4%,6%) scale(1.08)}100%{transform:translate(-5%,2%) scale(.95)}}

/* glass material */
.glass{position:relative;background:var(--glass);border:1px solid var(--edge-2);
  -webkit-backdrop-filter:blur(26px) saturate(185%);backdrop-filter:blur(26px) saturate(185%);
  box-shadow:inset 0 1px 0 var(--edge), inset 0 -1px 0 var(--edge-2), var(--shadow);isolation:isolate}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;
  background:linear-gradient(150deg,var(--spec) 0%,transparent 34%,transparent 66%,rgba(255,255,255,.08) 100%);opacity:.55}
.press{transition:transform .35s cubic-bezier(.2,.9,.25,1.25), background-color .2s, box-shadow .2s}
.press:active{transform:scale(.965)}

/* shell */
.app{position:relative;z-index:1;max-width:620px;margin:0 auto;min-height:100%;
  padding-left:max(18px, env(safe-area-inset-left, 0px));padding-right:max(18px, env(safe-area-inset-right, 0px));
  padding-block:calc(18px + env(safe-area-inset-top, 0px)) 140px}
.view{display:flex;flex-direction:column;gap:26px;animation:viewIn .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes viewIn{from{opacity:.0;transform:translateY(10px)}to{opacity:1;transform:none}}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:10px}
.eyebrow{font-size:13px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em}
h1{font-size:34px;line-height:1.08;font-weight:800;letter-spacing:-.03em;margin:4px 0 0;text-wrap:balance}
h2{font-size:21px;font-weight:700;letter-spacing:-.022em;margin:0}
.sec{display:flex;flex-direction:column;gap:12px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;padding:0 4px}
.sec-h small{color:var(--ink-3);font-size:14px}
.round{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none}
.round svg{width:20px;height:20px}

/* today hero */
.hero{border-radius:30px;padding:22px;display:grid;grid-template-columns:auto 1fr;gap:16px 20px;align-items:center}
.ring{position:relative;width:118px;height:118px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .num b{font-size:30px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.ring .num span{font-size:12px;color:var(--ink-3);font-weight:600}
.hero-t{display:flex;flex-direction:column;gap:6px;min-width:0}
.hero-t .lbl{font-size:15px;color:var(--ink-2)}
.hero-t .big{font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:6px 10px;border-radius:99px;background:var(--glass-soft);border:1px solid var(--edge-2)}
.chip svg{width:14px;height:14px}
.cta{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:58px;border-radius:20px;
  background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 88%,white) 0%,var(--accent) 100%);color:var(--accent-ink);
  font-size:17px;font-weight:700;letter-spacing:-.01em;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45), inset 0 -1px 0 rgba(0,0,0,.12), 0 14px 30px -12px color-mix(in srgb,var(--accent) 70%,transparent)}
.cta svg{width:20px;height:20px}
.cta[disabled]{opacity:.45;pointer-events:none}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:12px;text-align:left;min-height:122px}
.tile .round{width:36px;height:36px}
.tile b{font-size:16px;font-weight:700;letter-spacing:-.015em}
.tile span{font-size:13px;color:var(--ink-2)}

/* subject icon */
.ico{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex:none;color:#fff;
  background:linear-gradient(160deg,color-mix(in srgb,var(--c) 75%,white) 0%,var(--c) 70%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 8px 16px -8px var(--c)}
.ico svg{width:24px;height:24px}
.ico.sm{width:34px;height:34px;border-radius:10px}.ico.sm svg{width:19px;height:19px}

/* subject rows */
.list{border-radius:24px;overflow:hidden}
.row{display:flex;align-items:center;gap:14px;padding:14px 16px;width:100%;text-align:left}
.row+.row{border-top:1px solid var(--hair)}
.row .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.row .t b{font-size:16px;font-weight:650;letter-spacing:-.015em}
.row .t small{font-size:13px;color:var(--ink-3)}
.bar{height:6px;border-radius:99px;background:var(--hair);overflow:hidden}
.bar>div{height:100%;border-radius:inherit;background:var(--c,var(--accent));transition:width .8s cubic-bezier(.2,.8,.2,1)}
.row .pct{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink-2);min-width:42px;text-align:right}
.chev{width:9px;height:15px;color:var(--ink-3);flex:none}

/* stats */
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:2px}
.stat b{font-size:26px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--ink-3);font-weight:600}
.panel{border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:14px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:120px}
.week .col{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.week .b{width:100%;max-width:26px;border-radius:8px;background:var(--hair);position:relative;overflow:hidden;min-height:6px}
.week .b>div{position:absolute;inset:auto 0 0 0;background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 70%,white),var(--accent));border-radius:inherit}
.week .col span{font-size:11.5px;color:var(--ink-3);font-weight:600}
.week .col.today span{color:var(--accent)}
.boxes{display:flex;flex-direction:column;gap:10px}
.boxrow{display:grid;grid-template-columns:92px 1fr 36px;gap:10px;align-items:center;font-size:14px}
.boxrow span:last-child{text-align:right;color:var(--ink-2);font-variant-numeric:tabular-nums;font-weight:600}
.boxrow .bar{height:10px}
.legend{font-size:13px;color:var(--ink-3);line-height:1.5}
.link{color:var(--accent);font-weight:600;font-size:15px;padding:12px 4px;text-align:left}
.link.danger{color:var(--bad)}


/* v2.1 Stadt-Spiel */
.gcity{position:relative;border-radius:30px;overflow:hidden;margin-top:14px;box-shadow:0 18px 40px -22px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.35)}
.gsvg{display:block;width:100%;height:auto;touch-action:manipulation}
.gtile{fill:transparent;cursor:pointer}.gtile.sel{fill:rgba(255,255,255,.28);stroke:#fff;stroke-width:2}
.gcloud{animation:gdrift var(--d,60s) linear infinite;transform:translateX(var(--o,0px))}
@keyframes gdrift{from{transform:translateX(-160px)}to{transform:translateX(620px)}}
.ghud{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px}
.gst{border-radius:20px;padding:10px 12px;display:flex;flex-direction:column;align-items:flex-start}
.gst b{font-size:20px;font-weight:750;letter-spacing:-.01em;font-variant-numeric:tabular-nums}.gst span{font-size:12px;color:var(--ink-3)}
.gchip{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;margin:0 0 10px;padding:8px 12px;border-radius:14px;background:linear-gradient(135deg,rgba(247,147,26,.18),rgba(247,147,26,.06));border:1px solid rgba(247,147,26,.35)}
.gchip b{color:#d97706;font-size:15px}.gchip span{font-size:12.5px;color:var(--ink-2)}
.gchip.big{justify-content:center;margin:10px auto 4px;width:max-content;max-width:100%}.gchip.big b{font-size:18px}
.gcard{display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin-top:12px;padding:12px 14px;border-radius:22px;color:#fff;
  background:linear-gradient(135deg,#3a7bd5,#5ab8f0 55%,#7cc95a);box-shadow:0 12px 28px -16px rgba(30,80,160,.7)}
.gcard .t{flex:1;min-width:0}.gcard b{display:block;font-size:16px}.gcard b small{font-weight:600;opacity:.9;font-size:13px}.gcard>.t>small{display:block;font-size:12.5px;opacity:.92;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gcard svg{width:18px;height:18px;opacity:.85}
.gcoin{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:20px;color:#fff;background:radial-gradient(circle at 35% 30%,#ffc65a,#f7931a 60%,#c96f05);box-shadow:inset 0 -2px 0 rgba(0,0,0,.18)}
.gico{width:40px;height:40px;flex:none;display:grid;place-items:center;color:var(--c,var(--accent));background:color-mix(in srgb,var(--c,var(--accent)) 15%,transparent);border-radius:12px}
.gico svg{width:22px;height:22px}.gico.big{width:52px;height:52px;border-radius:16px}.gico.big svg{width:28px;height:28px}
.gopt{width:100%;text-align:left}.gopt.off{opacity:.5}
.gprice{flex:none;display:flex;flex-direction:column;align-items:flex-end;font-weight:700;font-size:14px;color:#d97706}.gprice small{font-weight:500;font-size:11.5px;color:var(--ink-3)}
.gbar{position:relative;height:10px;border-radius:5px;background:color-mix(in srgb,var(--ink-3) 22%,transparent);margin-top:8px}
.gbar i{position:absolute;left:0;top:0;bottom:0;border-radius:5px}.gbar em{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink-2);opacity:.6}
.gwel{background:linear-gradient(135deg,rgba(247,147,26,.16),rgba(90,184,240,.12))}
.gtab td:last-child{text-align:right;white-space:nowrap;font-weight:600}

/* ── 3D-STADT CSS START ── */
/* v2.2 3D-Stadt im Vollbild */
.c3{position:fixed;inset:0;z-index:25;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;color:#fff;
  background:linear-gradient(var(--c3top,#3d8fe2),var(--c3hor,#cde9ff) 58%,var(--c3hor,#cde9ff));font-family:var(--font)}
.c3 canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
body.c3on{overflow:hidden}
body.c3on .tabbar,body.c3on .ambient{display:none}
.c3g{background:rgba(18,26,46,.34);backdrop-filter:blur(16px) saturate(1.5);-webkit-backdrop-filter:blur(16px) saturate(1.5);border:1px solid rgba(255,255,255,.24);box-shadow:0 10px 26px -14px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.22)}
.c3.night .c3g{background:rgba(8,12,26,.5);border-color:rgba(255,255,255,.14)}
.c3top{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 10px) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));display:flex;gap:8px;align-items:flex-start;pointer-events:none}
.c3top button,.c3top .c3chip{pointer-events:auto}
.c3btn{width:44px;height:44px;border-radius:22px;display:grid;place-items:center;color:#fff;flex:none}.c3btn svg{width:22px;height:22px}
.c3col{display:flex;flex-direction:column;gap:8px}
.c3mid{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px}
.c3chips{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.c3chip{height:40px;border-radius:20px;padding:0 12px 0 8px;display:flex;align-items:center;gap:6px;font-weight:750;font-size:15.5px;font-variant-numeric:tabular-nums;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.c3chip svg{width:19px;height:19px;opacity:.95}.c3chip.pulse{animation:c3pulse .35s ease}
@keyframes c3pulse{50%{transform:scale(1.12)}}
.c3cn,.c3c{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;font-style:normal;font-weight:800;font-size:14px;color:#fff;background:radial-gradient(circle at 35% 30%,#ffd27a,#f7931a 60%,#c96f05);box-shadow:inset 0 -2px 0 rgba(0,0,0,.2),0 2px 6px rgba(0,0,0,.25)}
.c3sub{font-size:12.5px;font-weight:650;padding:3px 10px;border-radius:12px;background:rgba(10,16,30,.28);text-shadow:0 1px 2px rgba(0,0,0,.4)}
.c3fly{position:absolute;inset:0;pointer-events:none;z-index:5}.c3c{position:fixed;left:0;top:0;width:28px;height:28px}
.c3bot{position:absolute;left:0;right:0;bottom:0;padding:0 max(18px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 18px) max(18px,env(safe-area-inset-left,0px));display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none;transition:opacity .25s,transform .25s}
.c3bot.hide{opacity:0;transform:translateY(20px)}.c3bot.hide .c3round{pointer-events:none}
.c3round{pointer-events:auto;width:78px;height:78px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:750;color:#fff;
  border:1.5px solid rgba(255,255,255,.55);box-shadow:0 14px 28px -12px rgba(0,0,0,.6),inset 0 2px 0 rgba(255,255,255,.35),inset 0 -3px 0 rgba(0,0,0,.18);text-shadow:0 1px 2px rgba(0,0,0,.3)}
.c3round svg{width:28px;height:28px}
.c3round.learn{background:radial-gradient(circle at 35% 28%,#5fb0ff,#0a6be0 70%)}
.c3round.build{background:radial-gradient(circle at 35% 28%,#ffcf6a,#f08a00 70%)}
.c3hint{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 112px);display:flex;align-items:center;gap:10px;padding:8px 8px 8px 16px;border-radius:24px;font-size:14px;max-width:calc(100% - 32px)}
.c3x{width:32px;height:32px;border-radius:16px;display:grid;place-items:center;color:#fff;background:rgba(255,255,255,.18);flex:none}.c3x svg{width:16px;height:16px}
.c3drawer{position:absolute;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);border-radius:28px;padding:12px 0 12px;transform:translateY(30px);opacity:0;transition:transform .3s cubic-bezier(.3,1.3,.5,1),opacity .25s}
.c3drawer.show{transform:none;opacity:1}
.c3dh{display:flex;align-items:center;justify-content:space-between;padding:0 12px 8px 18px}.c3dh b{display:block;font-size:17px}.c3dh small{font-size:12.5px;opacity:.85}
.c3cards{display:flex;gap:10px;overflow-x:auto;padding:2px 14px 4px;scroll-snap-type:x mandatory;touch-action:pan-x;-webkit-overflow-scrolling:touch;scrollbar-width:none}.c3cards::-webkit-scrollbar{display:none}
.c3card{flex:none;width:138px;border-radius:20px;padding:10px 11px 11px;scroll-snap-align:start;text-align:left;color:#fff;display:flex;flex-direction:column;gap:3px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2)}
.c3card .gico{background:color-mix(in srgb,var(--c,#fff) 30%,rgba(255,255,255,.15));color:#fff;margin-bottom:4px}
.c3card b{font-size:14.5px}.c3pr{font-size:12.5px;font-weight:700;color:#ffd27a}.c3card small{font-size:11.5px;opacity:.82;line-height:1.3;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.c3card.off{opacity:.55}

/* ── 3D-STADT CSS ENDE ── */

/* tab bar */
.tabbar{position:fixed;z-index:20;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom, 0px));
  width:min(420px, calc(100% - 32px - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px)));height:66px;border-radius:33px;
  display:grid;grid-template-columns:repeat(var(--tabs,4),1fr);padding:5px}
.tabbar .pill{position:absolute;top:5px;bottom:5px;left:5px;width:calc((100% - 10px)/var(--tabs,4));border-radius:28px;
  background:var(--glass-strong);box-shadow:inset 0 1px 0 var(--edge),0 4px 12px -6px rgba(0,0,0,.25);
  transition:transform .55s cubic-bezier(.3,1.35,.4,1)}
.tab{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-size:10.5px;font-weight:600;color:var(--ink-2);border-radius:28px;white-space:nowrap}
.tab svg{width:23px;height:23px}
.tab.on{color:var(--accent)}

/* sheets */
.scrim{position:fixed;inset:0;z-index:40;background:var(--scrim);opacity:0;transition:opacity .3s}
.scrim.show{opacity:1}
.sheet{position:fixed;z-index:41;left:50%;bottom:0;width:min(620px,100%);transform:translate(-50%,105%);
  border-radius:30px 30px 0 0;padding:10px max(20px, env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px, env(safe-area-inset-right,0px));
  transition:transform .5s cubic-bezier(.2,.9,.25,1);max-height:88%;overflow:auto;background:var(--glass-strong)}
.sheet.show{transform:translate(-50%,0)}
.grab{width:38px;height:5px;border-radius:9px;background:var(--ink-3);opacity:.45;margin:2px auto 14px}
.sheet{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.sheet.drag{transition:none}
.sheet .sx{position:absolute;top:12px;right:14px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--glass-soft);border:1px solid var(--edge-2);color:var(--ink-2);z-index:2}

body.locked{position:fixed;left:0;right:0;overflow:hidden}
.sheet h2{margin-bottom:4px;padding-right:38px}

.topic{display:flex;align-items:center;gap:12px;padding:13px 4px;border-top:1px solid var(--hair);width:100%;text-align:left}
.topic b{flex:1;font-weight:600}
.topic small{color:var(--ink-3);font-variant-numeric:tabular-nums}
.topic small.tst{display:flex;align-items:center;gap:5px;font-size:12px;white-space:nowrap}
.stb{display:inline-flex;align-items:flex-end;gap:2px;height:11px;margin-right:5px;vertical-align:-1px}
.stb i{width:3px;border-radius:1.5px;background:color-mix(in srgb,var(--ink-3) 35%,transparent);display:block}
.stb i:nth-child(1){height:5px}.stb i:nth-child(2){height:8px}.stb i:nth-child(3){height:11px}
.stb i.on{background:var(--c)}
.tswitch{display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin-top:16px;padding:12px 14px;border-radius:16px;background:var(--glass-strong,rgba(127,127,127,.08))}
.pushzeit{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 2px}.pushzeit label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--ink-3);font-weight:600}.pushzeit input{height:44px;border-radius:12px;padding:0 10px;font:inherit;font-size:17px;color:var(--ink);background:var(--glass-soft);border:1px solid var(--edge-2)}

.sw i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}

.btnrow{display:flex;gap:10px;margin-top:16px}

const ICON = {
  hydro:'<path d="M12 3.4c3.4 4.2 6.2 7.5 6.2 10.8a6.2 6.2 0 0 1-12.4 0c0-3.3 2.8-6.6 6.2-10.8z"/><path d="M9.2 14.6a2.9 2.9 0 0 0 2.6 2.7" opacity=".8"/>',

};
const SVG = (p, sw=1.9) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const I = {

  x: SVG('<path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/>', 2.6),
  close: SVG('<path d="M7 7l10 10M17 7 7 17"/>', 2.2),
  play: SVG('<path d="M8 5.5v13l10.5-6.5z" fill="currentColor"/>'),
  flame: SVG('<path d="M12 3c.6 3.2 4.8 5.2 4.8 10a4.8 4.8 0 0 1-9.6 0c0-2.2 1-3.6 2.2-4.8.3 1.6 1.2 2.6 2.1 2.9C11 8.6 11.3 5.5 12 3z"/>'),

  slide: SVG('<rect x="3.5" y="5" width="17" height="11.5" rx="2"/><path d="M12 16.5V20M8.5 20h7"/>'),
  left: SVG('<path d="m14.5 6-6 6 6 6"/>', 2.2),

  note: SVG('<path d="M4.5 19.5h4.2L19 9.2a2.1 2.1 0 0 0 0-3l-1.2-1.2a2.1 2.1 0 0 0-3 0L4.5 15.3z"/><path d="M13.5 6.5l4 4"/>'),
  target: SVG('<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1" fill="currentColor"/>'),
  chev: '<svg class="chev" viewBox="0 0 9 15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m1.5 1.5 6 6-6 6"/></svg>'
};
const TYPNAME = {mc:"Auswahl", wf:"Wahr oder falsch", ord:"Reihenfolge", pair:"Zuordnen"};
const BOXNAME = ["Neu","Lernen","Üben","Festigen","Sicher","Gemeistert"];
const INTERVAL = [0,1,2,4,8,16];
const GOAL = 20;
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $ = s => document.querySelector(s);
const cssC = f => `var(--c-${f})`;

/* ids */
function hash(s){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return (h>>>0).toString(36)}
FRAGEN.forEach(q => q.id = q.f + "-" + hash(q.q + (q.a ? q.a[0] : "") + (q.steps ? q.steps[0] : "") + (q.pairs ? q.pairs[0][0] : "")));
/* v1.2: Umformulierungen und Bilder nach der ID-Vergabe anwenden (Lernstand bleibt) */
if (typeof EXTRA !== "undefined") FRAGEN.forEach(q => { const x = EXTRA[q.q]; if (x) Object.assign(q, x); });
/* v1.4: Korrekturen nach Frage-ID (Text, Typ, Antworten, Erklärung) – Lernstand bleibt */
if (typeof KORREKTUR !== "undefined") FRAGEN.forEach(q => { const x = KORREKTUR[q.id]; if (x) Object.assign(q, x); });
/* v2.0: Tiefenstufe je Frage (1 Grundlagen, 2 Verstehen, 3 Anwenden) – ohne Eintrag Stufe 2 */
FRAGEN.forEach(q => { q.st = (typeof STUFE !== "undefined" && STUFE[q.id]) || q.st || 2; });
const STN = {1:"Grundlagen", 2:"Verstehen", 3:"Anwenden"};
if (typeof ORDNE_ZU !== "undefined") FRAGEN.forEach(q => { if (q.q === "Ordne zu.") { const k = q.f === "binf" ? (q.pairs[0][0] === "JDK" ? "binf_tools" : "binf_typ") : q.f; if (ORDNE_ZU[k]) q.q = ORDNE_ZU[k]; } });
const BYID = Object.fromEntries(FRAGEN.map(q => [q.id, q]));
/* v1.3: Lösungsweg-Aufgaben */
const AUFG = typeof AUFGABEN !== "undefined" ? AUFGABEN : [];
const ABYID = Object.fromEntries(AUFG.map(a => [a.id, a]));
/* v1.5: Korrekturen auch für Aufgaben; „weg: true“ entfernt eine Frage oder Aufgabe ganz */
if (typeof KORREKTUR !== "undefined") AUFG.forEach(a => { const x = KORREKTUR[a.id]; if (x) Object.assign(a, x); });
const ALLQ = FRAGEN.filter(q => !q.weg), ALLA = AUFG.filter(a => !a.weg);

/* storage */
const APP_VERSION = "2.5.1";
const KEY = "klausurduell.v1";
let S = {cards:{}, days:{}, aufg:{}};
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch(e) {}
if(!S.aufg) S.aufg = {};
if(!S.notes) S.notes = []; if(!S.hide) S.hide = {}; if(!S.df) S.df = {}; if(!S.tiefeAus) S.tiefeAus = {};
/* v1.5: ausgeblendete Fragen/Aufgaben aus allen Listen nehmen (Lernstand bleibt erhalten) */
function applyHidden(){ FRAGEN.length = 0; ALLQ.forEach(q => { if(!S.hide[q.id]) FRAGEN.push(q); }); AUFG.length = 0; ALLA.forEach(a => { if(!S.hide[a.id]) AUFG.push(a); }); }
applyHidden();
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} }
const dayKey = (d=new Date()) => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const dayNum = (d=new Date()) => Math.floor((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()))/864e5);
const today = () => S.days[dayKey()] || {n:0,r:0};
function card(id){ return S.cards[id]; }
function boxOf(id){ const c = card(id); return c ? c.b : 0; }
function isDue(id){ const c = card(id); return c && c.due <= dayNum(); }
function streak(){
  let n=0; const d=new Date();
  if(!(S.days[dayKey(d)]||{}).n) d.setDate(d.getDate()-1);
  const sd = (S.game && S.game.sd) || [];
  for (let i = 0; i < 4000; i++) { const k = dayKey(d); if ((S.days[k]||{}).n) n++; else if (!sd.includes(k)) break; d.setDate(d.getDate()-1); }
  return n;
}
function tDue(id){ const c = S.aufg[id]; return c && c.due <= dayNum(); }
function nextTask(not){
  const pool = AUFG.filter(a => a.id !== not);
  const due = pool.filter(a => tDue(a.id)).sort((x,y) => S.aufg[x.id].b - S.aufg[y.id].b);
  if (due.length) return due[0];
  const fresh = pool.filter(a => !S.aufg[a.id]);
  if (fresh.length) { const lastF = not && ABYID[not] ? ABYID[not].f : null; const other = fresh.filter(a => a.f !== lastF); return (other.length ? other : fresh)[0]; }
  return pool.slice().sort((x,y) => S.aufg[x.id].due - S.aufg[y.id].due)[0] || null;
}
function tStatus(a){
  const c = S.aufg[a.id];
  if (!c) return `<span class="st new">Neu</span>`;
  if (tDue(a.id)) return `<span class="st due">Fällig</span>`;
  return `<span class="st${c.best>=1?" ok":""}">${Math.round(c.best*100)} %</span>`;
}
const tMin = a => Math.max(2, Math.round(a.schritte.length * .6));
function mastery(list){ if(!list.length) return 0; return list.reduce((a,q)=>a+boxOf(q.id),0)/(list.length*5); }
const qsOf = f => FRAGEN.filter(q => q.f === f);
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]} return a; }
function wrongNow(){ return FRAGEN.filter(q => { const c=card(q.id); return c && c.last===false; }); }
function interleave(list){
  const g={}; list.forEach(q=>(g[q.f]=g[q.f]||[]).push(q));
  const keys=shuffle(Object.keys(g)); const out=[];
  while(out.length<list.length) keys.forEach(k=>{ if(g[k].length) out.push(g[k].shift()); });
  return out;
}
/* v2.0: Neue Fragen von leicht nach schwer – je Thema zuerst die niedrigste Stufe, die noch neue Fragen hat (sanft: die nächste Stufe folgt, sobald die leichtere einmal dran war). Pro Fach abschaltbar. */
const tiefeAn = f => !S.tiefeAus[f];
function themaStufe(list){ const neu = list.filter(q => !card(q.id)); return neu.length ? Math.min(...neu.map(q => q.st)) : 0; }
function ordneNeu(list, keep){
  const low = {}; list.forEach(q => { const k = q.f + "|" + q.t; low[k] = Math.min(low[k] || 9, q.st); });
  const rang = q => tiefeAn(q.f) ? q.st - low[q.f + "|" + q.t] : 0;
  return (keep ? list.slice() : shuffle(list)).sort((a,b) => rang(a) - rang(b));
}
function stufenBalken(n, c){ return `<span class="stb" style="--c:${c||"var(--accent)"}">${[1,2,3].map(i => `<i class="${i<=n?"on":""}"></i>`).join("")}</span>`; }
function buildSession(pool, n){
  const due = shuffle(pool.filter(q=>isDue(q.id))).sort((a,b)=>boxOf(a.id)-boxOf(b.id));
  const fresh = ordneNeu(pool.filter(q=>!card(q.id)));
  let set = due.slice(0, Math.ceil(n*.6));
  set = set.concat(fresh.slice(0, n-set.length));
  if (set.length < n) set = set.concat(due.slice(set.length).slice(0, n-set.length));
  if (set.length < n) { const rest = shuffle(pool.filter(q=>!set.includes(q))).sort((a,b)=>boxOf(a.id)-boxOf(b.id)); set = set.concat(rest.slice(0, n-set.length)); }
  return interleave(set.slice(0,n));
}

/* ring */
function ring(p, size, w, colorA, colorB, inner){
  const r=(size-w)/2, c=2*Math.PI*r, id="g"+Math.random().toString(36).slice(2,7);
  return `<div class="ring" style="width:${size}px;height:${size}px"><svg viewBox="0 0 ${size} ${size}"><defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:${colorA}"/><stop offset="1" style="stop-color:${colorB}"/></linearGradient></defs>
  <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" style="stroke:var(--hair)" stroke-width="${w}"/>
  <circle class="arc" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="url(#${id})" stroke-width="${w}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c}" data-off="${c*(1-Math.min(1,Math.max(0,p)))}" style="transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)"/></svg>
  <div class="num">${inner}</div></div>`;
}
function animateRings(root=document){ requestAnimationFrame(()=>requestAnimationFrame(()=>root.querySelectorAll(".arc").forEach(a=>a.style.strokeDashoffset=a.dataset.off))); }
const icon = (f, sm) => `<div class="ico${sm?" sm":""}" style="--c:${cssC(f)}">${SVG(ICON[f],1.8)}</div>`;

/* views */
let tab = "heute";
const DAYS = ["So","Mo","Di","Mi","Do","Fr","Sa"];
const MONTHS = ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
function vHeute(){
  const t = today(), st = streak(), w = wrongNow().length;
  const due = FRAGEN.filter(q=>isDue(q.id)).length, fresh = FRAGEN.filter(q=>!card(q.id)).length;
  const d = new Date();
  const nextEx = ORDER.filter(f=>FACH[f].ex).map(f=>({f,d:Math.round((new Date(FACH[f].ex)-new Date(dayKey()))/864e5)})).filter(x=>x.d>=0).sort((a,b)=>a.d-b.d)[0];
  return `<div class="view">
    <div class="head"><div><div class="eyebrow">${DAYS[d.getDay()]}., ${d.getDate()}. ${MONTHS[d.getMonth()]}</div><h1>Heute</h1></div>
      <div class="chip glass" title="Tage in Folge">${I.flame}${st} ${st===1?"Tag":"Tage"}</div></div>
    <div class="hero glass">
      ${ring(t.n/GOAL, 118, 13, "color-mix(in srgb, var(--accent) 55%, #7fe0ff)", "var(--accent)", `<b>${t.n}</b><span>von ${GOAL}</span>`)}
      <div class="hero-t"><span class="lbl">Tagesziel</span>
        <span class="big">${t.n>=GOAL ? "Geschafft. Alles darüber ist Bonus." : t.n ? `Noch ${GOAL-t.n} Fragen bis zum Ziel` : "20 Fragen, etwa 8 Minuten"}</span>
      </div>
      <div class="chips" style="grid-column:1/-1;margin-top:0"><span class="chip">${I.redo}${due} fällig</span><span class="chip">${I.book}${fresh} neu</span>${nextEx?`<span class="chip">${I.target}${FACH[nextEx.f].n.split(" ").pop()} · Klausur in ${nextEx.d} Tagen</span>`:""}</div>
    </div>
    <button class="cta press" data-act="start-mix">${I.play}Training starten · 10 Fragen</button>
    ${gHeuteCard()}
    <div class="tiles">
      <button class="tile glass press" data-act="start-wrong" ${w?"":"disabled style='opacity:.55'"}><div class="round" style="background:var(--bad-soft);color:var(--bad)">${I.redo}</div><div><b>Fehler wiederholen</b><br><span>${w ? `${w} ${w===1?"Frage":"Fragen"} offen` : "Gerade nichts offen"}</span></div></button>
      <button class="tile glass press" data-act="start-quick"><div class="round" style="background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)">${I.bolt}</div><div><b>Schnelle Runde</b><br><span>5 Fragen, gemischt</span></div></button>
      <button class="tile glass press" data-act="exam"><div class="round" style="background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)">${I.clock}</div><div><b>Probeklausur</b><br><span>Mit Zeitlimit, Auswertung am Ende</span></div></button>
      <button class="tile glass press" data-act="formeln"><div class="round" style="background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)">${I.sigma}</div><div><b>Formelsammlung</b><br><span>${FORM.length} Formeln, durchsuchbar</span></div></button>
    </div>
    ${planCard()}
    ${weakCard(3)}
    ${AUFG.length ? `<div class="sec"><div class="sec-h"><h2>Lösungsweg</h2><small>${AUFG.length} Aufgaben</small></div>${taskFeature(nextTask())}</div>` : ""}
    <div class="sec"><div class="sec-h"><h2>Deine Fächer</h2><small>${FRAGEN.length} Fragen</small></div>${subjectList()}</div>
  </div>`;
}
function taskFeature(a){
  if(!a) return "";
  const c = S.aufg[a.id];
  return `<button class="feature glass press" data-act="task" data-id="${a.id}">${icon(a.f)}<div class="t"><span class="eyebrow">${c ? (tDue(a.id) ? "Wiederholen" : "Nochmal üben") : "Neue Aufgabe"}</span><b>${esc(a.titel)}</b><small>${FACH[a.f].n} · ${a.schritte.length} Schritte · ca. ${tMin(a)} Min.</small></div><span class="round">${I.play}</span></button>`;
}
function taskRow(a){
  return `<button class="row press" data-act="task" data-id="${a.id}"><div class="t"><b>${esc(a.titel)}</b><small>${esc(a.s)} · ${a.schritte.length} Schritte</small></div>${tStatus(a)}${I.chev}</button>`;
}
function vAufgaben(){
  const solved = AUFG.filter(a => S.aufg[a.id]).length;
  const fs = ORDER.filter(f => AUFG.some(a => a.f === f));
  return `<div class="view">
    <div class="head"><div><div class="eyebrow">Lösungsweg-Trainer</div><h1>Aufgaben</h1></div><div class="chip glass">${solved}/${AUFG.length} gelöst</div></div>
    <p class="legend" style="margin:-12px 4px 0">Übungsaufgaben Schritt für Schritt: Bei jedem Schritt wählst du aus vier Möglichkeiten, was du als Nächstes tun würdest. Die Zwischenergebnisse rechnet die App vor – du entscheidest nur den Weg. Falsch gewählt? Dann gibt es eine Erklärung und einen zweiten Versuch.</p>
    ${AUFG.length ? taskFeature(nextTask()) : `<div class="panel glass"><p class="empty">Noch keine Aufgaben vorhanden.</p></div>`}
    ${fs.map(f => { const l = AUFG.filter(a => a.f === f); return `<div class="sec"><div class="sec-h"><h2 style="display:flex;align-items:center;gap:10px">${icon(f,true)}${FACH[f].n}</h2><small>${l.length} ${l.length===1?"Aufgabe":"Aufgaben"}</small></div><div class="list glass">${l.map(taskRow).join("")}</div></div>`; }).join("")}
  </div>`;
}
function subjectList(){
  return `<div class="list glass">${ORDER.map(f=>{const qs=qsOf(f), m=mastery(qs);
    return `<button class="row press" data-act="subject" data-f="${f}">${icon(f)}<div class="t"><b>${FACH[f].n}</b><small>${qs.length} Fragen · ${FACH[f].k}</small><div class="bar" style="--c:${cssC(f)}"><div style="width:${Math.round(m*100)}%"></div></div></div><span class="pct">${Math.round(m*100)} %</span>${I.chev}</button>`}).join("")}</div>`;
}
function vFaecher(){
  return `<div class="view">
    <div class="head"><div><div class="eyebrow">Wintersemester 26/27</div><h1>Fächer</h1></div></div>
    <p class="legend" style="margin:-12px 4px 0">Tippe ein Fach an, um nach Thema zu üben. Die Fragen sind zum Merken gedacht – Begriffe, Zusammenhänge und das Vorgehen bei Rechenwegen. Selbst rechnen kannst du freiwillig bei den Lösungsweg-Aufgaben.</p>
    ${subjectList()}
    <button class="row glass press" style="border-radius:22px;border:0" data-act="formeln"><div class="round" style="background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok);width:36px;height:36px">${I.sigma}</div><div class="t"><b>Formelsammlung</b><small>${FORM.length} Formeln aus allen Fächern, durchsuchbar</small></div>${I.chev}</button>
    <div class="sec"><div class="sec-h"><h2>Fragetypen</h2></div>
      <div class="list glass">${[["mc","Auswahl","Eine von vier Antworten ist richtig."],["wf","Wahr oder falsch","Eine Aussage prüfen."],["ord","Reihenfolge","Schritte eines Vorgehens ordnen."],["pair","Zuordnen","Begriffe und Bedeutungen verbinden."]].map(([t,n,d])=>`<div class="row"><div class="round" style="background:var(--glass-soft);width:36px;height:36px"><b style="font-size:13px">${FRAGEN.filter(q=>q.typ===t).length}</b></div><div class="t"><b>${n}</b><small>${d}</small></div></div>`).join("")}<button class="row press" data-tab="aufgaben"><div class="round" style="background:var(--glass-soft);width:36px;height:36px"><b style="font-size:13px">${AUFG.length}</b></div><div class="t"><b>Lösungsweg</b><small>Eine Übungsaufgabe Schritt für Schritt lösen.</small></div>${I.chev}</button></div></div>
  </div>`;
}
function vStand(){
  const seen = FRAGEN.filter(q=>card(q.id)).length, all = FRAGEN.length;
  let tr=0, tw=0; Object.values(S.cards).forEach(c=>{tr+=c.r||0; tw+=c.w||0;});
  const acc = tr+tw ? Math.round(tr/(tr+tw)*100) : 0;
  const m = mastery(FRAGEN);

function closeSheet(){

(() => {
  const sh = document.getElementById("sheet"), sc = document.getElementById("scrim");
  let y0 = null, t0 = 0, dy = 0, drag = false;
  sh.addEventListener("touchstart", e => { if (sh.scrollTop > 0 || e.target.closest("textarea,input")) { y0 = null; return; } y0 = e.touches[0].clientY; t0 = Date.now(); dy = 0; drag = false; }, {passive:true});
  sh.addEventListener("touchmove", e => {
    if (y0 === null) return;
    dy = e.touches[0].clientY - y0;
    if (!drag && dy > 6 && sh.scrollTop <= 0) { drag = true; sh.classList.add("drag"); }
    if (drag) { e.preventDefault(); const d = Math.max(0, dy); sh.style.transform = `translate(-50%, ${d}px)`; sc.style.opacity = String(Math.max(0, 1 - d/400)); }
  }, {passive:false});
  sh.addEventListener("touchend", () => {
    if (!drag) { y0 = null; return; }
    const v = dy / Math.max(1, Date.now() - t0);
    sh.classList.remove("drag"); sc.style.opacity = "";
    if (dy > 110 || v > .6) closeSheet(); else sh.style.transform = "";
    y0 = null; drag = false;
  });
  /* Hintergrund nicht mitscrollen lassen */
  sc.addEventListener("touchmove", e => e.preventDefault(), {passive:false});
})();

/* v1.6: Klausurplan – Tagesziel je Fach bis zur Klausur, Baukonstruktion nach Klausuranalyse gewichtet */
const GEWICHT = {"bauko|Holzbemessung":3, "bauko|Rechenweg":2.5, "bauko|Schnittgrößen und Aussteifung":2.5, "bauko|Einwirkungen":2, "bauko|Lasten":2, "bauko|Klausur":2, "bauko|Sicherheitskonzept":1.5, "bauko|Holz als Baustoff":1.2, "bauko|Stahl und Stahlbeton":1};
const ZIELSTUFE = 3;
function daysTo(iso){ return Math.round((new Date(iso) - new Date(dayKey())) / 864e5); }
function planData(){
  const k = dayKey();
  return ORDER.filter(f => FACH[f].ex && daysTo(FACH[f].ex) > 0).map(f => {
    const qs = qsOf(f), need = qs.reduce((x,q) => x + Math.max(0, ZIELSTUFE - boxOf(q.id)), 0), d = daysTo(FACH[f].ex);
    const learn = Math.max(1, d - 3), per = need ? Math.max(3, Math.ceil(need / learn)) : 0, done = (S.df[k] || {})[f] || 0;
    return {f, d, need, per, done, rest: Math.max(0, per - done)};
  }).sort((a,b) => a.d - b.d);
}
function planCard(){
  const P = planData(); if (!P.length) return "";
  const open = P.reduce((x,p) => x + p.rest, 0), sum = P.reduce((x,p) => x + p.per, 0);
  const none = ORDER.filter(f => !FACH[f].ex).map(f => FACH[f].n.split(" ")[0]).join(", ");
  return `<div class="sec"><div class="sec-h"><h2>Klausurplan</h2><small>${open ? `heute noch ${open}` : "heute geschafft"}</small></div>
    <div class="plan glass">${P.map(p => `<div class="prow" style="--c:${cssC(p.f)}">${icon(p.f,true)}<div class="t"><b>${esc(FACH[p.f].n)}</b><small>Klausur in ${p.d} Tagen · ${p.need ? `noch ${p.need} Wiederholungen bis Lernstufe ${ZIELSTUFE}` : "alles auf Lernstufe " + ZIELSTUFE}</small></div><span class="n">${Math.min(p.done,p.per)}/${p.per}</span><div class="pbar"><div style="width:${p.per ? Math.min(100, p.done/p.per*100) : 100}%"></div></div></div>`).join("")}
    ${open ? `<button class="cta press" style="margin-top:4px" data-act="plan-go">${I.target}Plan-Runde · 10 Fragen</button>` : ""}
    <p class="legend" style="margin:0">Damit bis zur Klausur jede Frage mindestens Lernstufe ${ZIELSTUFE} erreicht. Baukonstruktion ist nach der Klausuranalyse gewichtet.${none ? ` Ohne Klausurtermin: ${esc(none)}.` : ""}</p></div></div>`;
}
function wsort(list){ return list.map(q => [Math.pow(Math.random(), 1 / (GEWICHT[q.f + "|" + q.t] || 1)), q]).sort((a,b) => b[0] - a[0]).map(x => x[1]); }
function planGo(){
  const P = planData().filter(p => p.rest > 0); if (!P.length) { toast("Plan für heute erfüllt"); return; }
  const p = P.sort((a,b) => b.rest / b.per - a.rest / a.per || a.d - b.d)[0], pool = qsOf(p.f);
  const due = wsort(pool.filter(q => isDue(q.id))), fresh = ordneNeu(wsort(pool.filter(q => !card(q.id))), true), low = wsort(pool.filter(q => card(q.id) && !isDue(q.id) && boxOf(q.id) < ZIELSTUFE));
  const set = [...new Set(due.concat(fresh.slice(0, 6), low, fresh))].slice(0, 10);
  startQuiz(interleave(set), "Klausurplan · " + FACH[p.f].n);

function weakTopics(){
  const T = {};

}

function pushStand(){

  const mo = new Date(now); mo.setDate(mo.getDate() - ((mo.getDay() + 6) % 7)); let wn = 0; const d = new Date(mo);
  for (let i = 0; i < 7; i++) { wn += (S.days[dayKey(d)] || {}).n || 0; d.setDate(d.getDate() + 1); }
  const lastF = f => { const k = Object.keys(S.df).filter(x => (S.df[x] || {})[f] > 0).sort(); return k.length ? k[k.length - 1] : null; };
  const werke = (S.game && gOn()) ? (S.game.b || []).filter(b => WERK[b.k] && b.l >= 1 && FACH[WERK[b.k].f]).map(b => ({name: GT[b.k] ? GT[b.k].n : b.k, fach: FACH[WERK[b.k].f].n, zuletzt: lastF(WERK[b.k].f)})) : [];
  return {am: dayKey(), heute: {tag: dayKey(), n: today().n}, letzter, serie: streak(), faellig: fl, werke: werke.slice(0, 20), woche: {ab: dayKey(mo), n: wn}};
}
async function pushPost(pfad, body){

}
let pushLast = 0, pushSig = "";
