<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Klausurduell">
<meta name="theme-color" content="#eef1f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#07090f" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
<title>Klausurduell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one-column iOS-style app, large titles, floating Liquid-Glass tab bar over a slow ambient light field. */
:root{
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Inter", "Segoe UI", system-ui, sans-serif;
  --bg:#eef1f6; --ink:#0d1220; --ink-2:#4a5368; --ink-3:#8a93a6;
  --glass:rgba(255,255,255,.52); --glass-strong:rgba(255,255,255,.72); --glass-soft:rgba(255,255,255,.34);
  --edge:rgba(255,255,255,.75); --edge-2:rgba(255,255,255,.25); --hair:rgba(13,18,32,.08);
  --shadow:0 18px 40px -18px rgba(28,40,80,.28), 0 2px 6px -2px rgba(28,40,80,.08);
  --spec:rgba(255,255,255,.85);
  --accent:#0a7cff; --accent-ink:#ffffff;
  --ok:#1fa64a; --ok-soft:rgba(52,199,89,.16); --bad:#e5342a; --bad-soft:rgba(255,69,58,.14); --warn:#f59e0b;
  --blob1:#7cc4ff; --blob2:#9be7d0; --blob3:#ffc4a3; --blob4:#c7b8ff;
  --scrim:rgba(10,14,25,.28);
  --c-hydro:#1aa3e0; --c-phys:#5e5ce6; --c-bsk:#f08a00; --c-bauko:#ef4136; --c-binf:#22a556; --c-stat:#a64fd9; --c-dap:#d9467a;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#07090f; --ink:#f3f5fa; --ink-2:#b3bacb; --ink-3:#7b8397;
  --glass:rgba(40,46,62,.42); --glass-strong:rgba(56,63,84,.62); --glass-soft:rgba(30,35,48,.32);
  --edge:rgba(255,255,255,.18); --edge-2:rgba(255,255,255,.05); --hair:rgba(255,255,255,.08);
  --shadow:0 20px 44px -18px rgba(0,0,0,.7), 0 2px 6px -2px rgba(0,0,0,.4);
  --spec:rgba(255,255,255,.22);
  --accent:#2f8cff; --ok:#34c759; --ok-soft:rgba(52,199,89,.3); --bad:#ff5a4f; --bad-soft:rgba(255,69,58,.26);
  --blob1:#1d4f9a; --blob2:#0f5d55; --blob3:#6b2f3a; --blob4:#3a2c7a; --scrim:rgba(0,0,0,.5);
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#07090f; --ink:#f3f5fa; --ink-2:#b3bacb; --ink-3:#7b8397;
  --glass:rgba(40,46,62,.42); --glass-strong:rgba(56,63,84,.62); --glass-soft:rgba(30,35,48,.32);
  --edge:rgba(255,255,255,.18); --edge-2:rgba(255,255,255,.05); --hair:rgba(255,255,255,.08);
  --shadow:0 20px 44px -18px rgba(0,0,0,.7), 0 2px 6px -2px rgba(0,0,0,.4);
  --spec:rgba(255,255,255,.22);
  --accent:#2f8cff; --ok:#34c759; --ok-soft:rgba(52,199,89,.3); --bad:#ff5a4f; --bad-soft:rgba(255,69,58,.26);
  --blob1:#1d4f9a; --blob2:#0f5d55; --blob3:#6b2f3a; --blob4:#3a2c7a; --scrim:rgba(0,0,0,.5);
  color-scheme:dark }

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.4;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;letter-spacing:-.011em}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
svg{display:block}

/* ambient light field */
.ambient{position:fixed;inset:-20%;z-index:0;pointer-events:none;filter:blur(60px) saturate(140%);opacity:.95}
.ambient i{position:absolute;border-radius:50%;opacity:.75;animation:drift 26s ease-in-out infinite alternate}
.ambient i:nth-child(1){width:55vmax;height:55vmax;left:-5%;top:-8%;background:var(--blob1)}
.ambient i:nth-child(2){width:46vmax;height:46vmax;right:-8%;top:10%;background:var(--blob2);animation-delay:-8s}
.ambient i:nth-child(3){width:50vmax;height:50vmax;left:15%;bottom:-15%;background:var(--blob3);animation-delay:-14s}
.ambient i:nth-child(4){width:36vmax;height:36vmax;right:10%;bottom:5%;background:var(--blob4);animation-delay:-20s}
.ambient.tint i:nth-child(1),.ambient.tint i:nth-child(4){background:var(--tint,var(--blob1));opacity:.42}
@keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(4%,6%) scale(1.08)}100%{transform:translate(-5%,2%) scale(.95)}}

/* glass material */
.glass{position:relative;background:var(--glass);border:1px solid var(--edge-2);
  -webkit-backdrop-filter:blur(26px) saturate(185%);backdrop-filter:blur(26px) saturate(185%);
  box-shadow:inset 0 1px 0 var(--edge), inset 0 -1px 0 var(--edge-2), var(--shadow);isolation:isolate}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;
  background:linear-gradient(150deg,var(--spec) 0%,transparent 34%,transparent 66%,rgba(255,255,255,.08) 100%);opacity:.55}
.press{transition:transform .35s cubic-bezier(.2,.9,.25,1.25), background-color .2s, box-shadow .2s}
.press:active{transform:scale(.965)}

/* shell */
.app{position:relative;z-index:1;max-width:620px;margin:0 auto;min-height:100%;
  padding-left:max(18px, env(safe-area-inset-left, 0px));padding-right:max(18px, env(safe-area-inset-right, 0px));
  padding-block:calc(18px + env(safe-area-inset-top, 0px)) 140px}
.view{display:flex;flex-direction:column;gap:26px;animation:viewIn .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes viewIn{from{opacity:.0;transform:translateY(10px)}to{opacity:1;transform:none}}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:10px}
.eyebrow{font-size:13px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em}
h1{font-size:34px;line-height:1.08;font-weight:800;letter-spacing:-.03em;margin:4px 0 0;text-wrap:balance}
h2{font-size:21px;font-weight:700;letter-spacing:-.022em;margin:0}
.sec{display:flex;flex-direction:column;gap:12px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;padding:0 4px}
.sec-h small{color:var(--ink-3);font-size:14px}
.round{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none}
.round svg{width:20px;height:20px}

/* today hero */
.hero{border-radius:30px;padding:22px;display:grid;grid-template-columns:auto 1fr;gap:16px 20px;align-items:center}
.ring{position:relative;width:118px;height:118px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .num b{font-size:30px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.ring .num span{font-size:12px;color:var(--ink-3);font-weight:600}
.hero-t{display:flex;flex-direction:column;gap:6px;min-width:0}
.hero-t .lbl{font-size:15px;color:var(--ink-2)}
.hero-t .big{font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:6px 10px;border-radius:99px;background:var(--glass-soft);border:1px solid var(--edge-2)}
.chip svg{width:14px;height:14px}
.cta{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:58px;border-radius:20px;
  background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 88%,white) 0%,var(--accent) 100%);color:var(--accent-ink);
  font-size:17px;font-weight:700;letter-spacing:-.01em;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45), inset 0 -1px 0 rgba(0,0,0,.12), 0 14px 30px -12px color-mix(in srgb,var(--accent) 70%,transparent)}
.cta svg{width:20px;height:20px}
.cta[disabled]{opacity:.45;pointer-events:none}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:12px;text-align:left;min-height:122px}
.tile .round{width:36px;height:36px}
.tile b{font-size:16px;font-weight:700;letter-spacing:-.015em}
.tile span{font-size:13px;color:var(--ink-2)}

/* subject icon */
.ico{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex:none;color:#fff;
  background:linear-gradient(160deg,color-mix(in srgb,var(--c) 75%,white) 0%,var(--c) 70%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 8px 16px -8px var(--c)}
.ico svg{width:24px;height:24px}
.ico.sm{width:34px;height:34px;border-radius:10px}.ico.sm svg{width:19px;height:19px}

/* subject rows */
.list{border-radius:24px;overflow:hidden}
.row{display:flex;align-items:center;gap:14px;padding:14px 16px;width:100%;text-align:left}
.row+.row{border-top:1px solid var(--hair)}
.row .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.row .t b{font-size:16px;font-weight:650;letter-spacing:-.015em}
.row .t small{font-size:13px;color:var(--ink-3)}
.bar{height:6px;border-radius:99px;background:var(--hair);overflow:hidden}
.bar>div{height:100%;border-radius:inherit;background:var(--c,var(--accent));transition:width .8s cubic-bezier(.2,.8,.2,1)}
.row .pct{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink-2);min-width:42px;text-align:right}
.chev{width:9px;height:15px;color:var(--ink-3);flex:none}

/* stats */
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:2px}
.stat b{font-size:26px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--ink-3);font-weight:600}
.panel{border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:14px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:120px}
.week .col{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.week .b{width:100%;max-width:26px;border-radius:8px;background:var(--hair);position:relative;overflow:hidden;min-height:6px}
.week .b>div{position:absolute;inset:auto 0 0 0;background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 70%,white),var(--accent));border-radius:inherit}
.week .col span{font-size:11.5px;color:var(--ink-3);font-weight:600}
.week .col.today span{color:var(--accent)}
.boxes{display:flex;flex-direction:column;gap:10px}
.boxrow{display:grid;grid-template-columns:92px 1fr 36px;gap:10px;align-items:center;font-size:14px}
.boxrow span:last-child{text-align:right;color:var(--ink-2);font-variant-numeric:tabular-nums;font-weight:600}
.boxrow .bar{height:10px}
.legend{font-size:13px;color:var(--ink-3);line-height:1.5}
.link{color:var(--accent);font-weight:600;font-size:15px;padding:12px 4px;text-align:left}
.link.danger{color:var(--bad)}

/* tab bar */
.tabbar{position:fixed;z-index:20;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom, 0px));
  width:min(380px, calc(100% - 32px - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px)));height:66px;border-radius:33px;
  display:grid;grid-template-columns:repeat(3,1fr);padding:5px}
.tabbar .pill{position:absolute;top:5px;bottom:5px;left:5px;width:calc((100% - 10px)/3);border-radius:28px;
  background:var(--glass-strong);box-shadow:inset 0 1px 0 var(--edge),0 4px 12px -6px rgba(0,0,0,.25);
  transition:transform .55s cubic-bezier(.3,1.35,.4,1)}
.tab{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-size:11px;font-weight:600;color:var(--ink-2);border-radius:28px}
.tab svg{width:23px;height:23px}
.tab.on{color:var(--accent)}

/* sheets */
.scrim{position:fixed;inset:0;z-index:40;background:var(--scrim);opacity:0;transition:opacity .3s}
.scrim.show{opacity:1}
.sheet{position:fixed;z-index:41;left:50%;bottom:0;width:min(620px,100%);transform:translate(-50%,105%);
  border-radius:30px 30px 0 0;padding:10px max(20px, env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px, env(safe-area-inset-right,0px));
  transition:transform .5s cubic-bezier(.2,.9,.25,1);max-height:88%;overflow:auto;background:var(--glass-strong)}
.sheet.show{transform:translate(-50%,0)}
.grab{width:38px;height:5px;border-radius:9px;background:var(--ink-3);opacity:.45;margin:2px auto 14px}
.sheet h2{margin-bottom:4px}
.sheet .sub{color:var(--ink-2);font-size:15px;margin:0 0 16px}
.topic{display:flex;align-items:center;gap:12px;padding:13px 4px;border-top:1px solid var(--hair);width:100%;text-align:left}
.topic b{flex:1;font-weight:600}
.topic small{color:var(--ink-3);font-variant-numeric:tabular-nums}
.btnrow{display:flex;gap:10px;margin-top:16px}
.btn2{flex:1;height:52px;border-radius:16px;font-weight:700;background:var(--glass-soft);border:1px solid var(--edge-2)}
.btn2.danger{background:var(--bad);color:#fff;border:0}

/* quiz */
.quiz{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;background:var(--bg);
  padding-left:max(18px, env(safe-area-inset-left, 0px));padding-right:max(18px, env(safe-area-inset-right, 0px));
  padding-block:calc(12px + env(safe-area-inset-top, 0px)) calc(16px + env(safe-area-inset-bottom, 0px))}
.quiz .ambient{position:absolute}
.qwrap{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;max-width:620px;width:100%;margin:0 auto;min-height:0}
.qtop{display:flex;align-items:center;gap:14px;padding:6px 0 18px}
.qtop .round{width:40px;height:40px}
.seg{flex:1;display:flex;gap:4px}
.seg i{flex:1;height:6px;border-radius:9px;background:var(--hair);transition:background .4s}
.seg i.done{background:var(--ink-3)}
.seg i.r{background:var(--ok)}.seg i.f{background:var(--bad)}
.seg i.cur{background:var(--ink)}
.qcount{font-size:14px;font-weight:700;color:var(--ink-2);font-variant-numeric:tabular-nums;min-width:40px;text-align:right}
.qbody{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:18px;padding-bottom:12px;min-height:0}
.qcard{border-radius:28px;padding:22px 20px;display:flex;flex-direction:column;gap:12px;animation:cardIn .55s cubic-bezier(.2,.9,.25,1.1) both}
@keyframes cardIn{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
.qmeta{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:650;color:var(--ink-2)}
.qmeta .dot{width:8px;height:8px;border-radius:50%;background:var(--c)}
.qmeta .lab{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qmeta .typ{white-space:nowrap;margin-left:auto;font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3)}
.qtext{font-size:22px;font-weight:700;letter-spacing:-.022em;line-height:1.28;text-wrap:balance}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:15px 16px;border-radius:20px;font-size:16px;font-weight:550;line-height:1.3;min-height:58px}
.opt .k{width:28px;height:28px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--ink-3);border:1.5px solid var(--hair)}
.opt .k svg{width:16px;height:16px}
.opt.ok{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 45%,transparent)}
.opt.ok .k{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.no{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 45%,transparent);animation:shake .4s}
.opt.no .k{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.dim{opacity:.5}
.opt[disabled]{cursor:default}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
.wfrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.wf{height:96px;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:17px;font-weight:700}
.wf svg{width:28px;height:28px}
.wf.ok{background:var(--ok-soft)}.wf.no{background:var(--bad-soft);animation:shake .4s}.wf.dim{opacity:.45}
.hint{font-size:13.5px;color:var(--ink-3);padding:0 4px}
/* ordering */
.slots{display:flex;flex-direction:column;gap:8px}
.slot{display:flex;align-items:center;gap:12px;min-height:52px;padding:10px 14px;border-radius:16px;border:1.5px dashed var(--hair);font-size:15px;font-weight:550;text-align:left;width:100%}
.slot .n{width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:13px;font-weight:700;background:var(--hair);color:var(--ink-2)}
.slot.filled{border-style:solid;border-color:var(--edge-2);background:var(--glass-strong)}
.slot.filled .n{background:var(--c,var(--accent));color:#fff}
.slot.ok{background:var(--ok-soft)}.slot.ok .n{background:var(--ok)}
.slot.no{background:var(--bad-soft)}.slot.no .n{background:var(--bad)}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.pchip{padding:11px 14px;border-radius:16px;font-size:15px;font-weight:550;text-align:left;line-height:1.3;max-width:100%}
/* pairs */
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pairs .colp{display:flex;flex-direction:column;gap:10px;min-width:0}
.pc{min-height:60px;padding:10px 12px;border-radius:16px;font-size:14.5px;font-weight:600;text-align:left;line-height:1.25;width:100%;overflow-wrap:anywhere}
.pc.sel{box-shadow:inset 0 0 0 2px var(--accent), var(--shadow)}
.pc.done{color:var(--ink);opacity:.95;background:color-mix(in srgb,var(--m) 22%,transparent);border-color:color-mix(in srgb,var(--m) 50%,transparent)}
.pc.wrong{animation:shake .4s;background:var(--bad-soft)}
/* feedback */
.fb{border-radius:26px;padding:18px;display:flex;flex-direction:column;gap:12px;animation:fbIn .5s cubic-bezier(.2,.9,.25,1.15) both}
@keyframes fbIn{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.fb .fh{display:flex;align-items:center;gap:12px}
.fb .badge{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;flex:none}
.fb .badge svg{width:20px;height:20px}
.fb .badge.ok{background:var(--ok)}.fb .badge.no{background:var(--bad)}
.fb .fh b{font-size:18px;font-weight:750;letter-spacing:-.02em}
.fb p{margin:0;font-size:15.5px;line-height:1.45;color:var(--ink)}
.fb .src{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-3);font-weight:600}
.fb .src svg{width:14px;height:14px}
.fb ol{margin:0;padding-left:20px;font-size:14.5px;color:var(--ink-2);display:flex;flex-direction:column;gap:3px}
.qfoot{padding-top:10px}
/* result */
.res{display:flex;flex-direction:column;gap:22px;align-items:stretch;padding-top:8px;animation:viewIn .5s both}
.res .ring{width:170px;height:170px;margin:6px auto 0}
.res .ring .num b{font-size:44px}
.res h1{text-align:center}
.res .sub{text-align:center;color:var(--ink-2);margin:-12px 0 0}
.rlist{border-radius:24px;overflow:hidden}
.ritem{display:flex;gap:12px;padding:13px 16px;align-items:flex-start;font-size:14.5px;line-height:1.35}
.ritem+.ritem{border-top:1px solid var(--hair)}
.ritem .m{width:22px;height:22px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;margin-top:1px}
.ritem .m svg{width:13px;height:13px}
.ritem .m.ok{background:var(--ok)}.ritem .m.no{background:var(--bad)}
.ritem small{display:block;color:var(--ink-3);font-size:12.5px;margin-top:2px}
.empty{padding:18px;text-align:center;color:var(--ink-3);font-size:14.5px}
.toast{position:fixed;z-index:60;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translate(-50%,-150%);padding:12px 18px;border-radius:99px;font-weight:650;font-size:14.5px;transition:transform .45s cubic-bezier(.2,.9,.25,1.2)}
.toast.show{transform:translate(-50%,0)}
@media (max-width:380px){ h1{font-size:30px} .hero{grid-template-columns:1fr;justify-items:center;text-align:center} .hero-t{align-items:center} .qtext{font-size:20px} .statgrid b{font-size:22px} }
@media (prefers-reduced-motion: reduce){ *,*::before,*::after{animation:none!important;transition:none!important} }
</style>
</head><body>


<div class="ambient" id="amb"><i></i><i></i><i></i><i></i></div>
<main class="app" id="app"></main>
<nav class="tabbar glass" id="tabbar" aria-label="Navigation">
  <div class="pill" id="pill"></div>
  <button class="tab on" data-tab="heute" aria-label="Heute"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.8v2.1M12 19.1v2.1M2.8 12h2.1M19.1 12h2.1M5.5 5.5 7 7M17 17l1.5 1.5M5.5 18.5 7 17M17 7l1.5-1.5"/></svg>Heute</button>
  <button class="tab" data-tab="faecher" aria-label="Fächer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7.5" height="7.5" rx="2.2"/><rect x="13" y="3.5" width="7.5" height="7.5" rx="2.2"/><rect x="3.5" y="13" width="7.5" height="7.5" rx="2.2"/><rect x="13" y="13" width="7.5" height="7.5" rx="2.2"/></svg>Fächer</button>
  <button class="tab" data-tab="stand" aria-label="Lernstand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M5 20V12M10 20V6M15 20v-9M20 20V9"/></svg>Lernstand</button>
</nav>
<div class="scrim" id="scrim" hidden></div>
<div class="sheet glass" id="sheet" role="dialog" aria-modal="true" hidden></div>
<section class="quiz" id="quiz" hidden></section>
<div class="toast glass" id="toast" role="status"></div>

<script src="fragen.js"></script>
<script>
(() => {
const FACH = {
  hydro:{n:"Hydromechanik", k:"Klausur 08.03.", ex:"2027-03-08"},
  phys:{n:"Physik", k:"Mechanik und Vektoren"},
  bsk:{n:"Baustoffkunde", k:"Baustoffkunde I"},
  bauko:{n:"Baukonstruktion", k:"Klausur 18.03.", ex:"2027-03-18"},
  binf:{n:"Bauinformatik", k:"Java · Klausur 22.02.", ex:"2027-02-22"},
  stat:{n:"Angewandte Statistik", k:"Matrizen · Klausur 11.03.", ex:"2027-03-11"},
  dap:{n:"Data Analysis for Planning", k:"Befragungen, R, Verteilungen · mündlich"}
};
const ORDER = ["hydro","bauko","bsk","phys","binf","stat","dap"];
const ICON = {
  hydro:'<path d="M12 3.4c3.4 4.2 6.2 7.5 6.2 10.8a6.2 6.2 0 0 1-12.4 0c0-3.3 2.8-6.6 6.2-10.8z"/><path d="M9.2 14.6a2.9 2.9 0 0 0 2.6 2.7" opacity=".8"/>',
  phys:'<circle cx="12" cy="12" r="1.7" fill="currentColor" stroke="none"/><ellipse cx="12" cy="12" rx="9" ry="3.6"/><ellipse cx="12" cy="12" rx="9" ry="3.6" transform="rotate(60 12 12)"/><ellipse cx="12" cy="12" rx="9" ry="3.6" transform="rotate(120 12 12)"/>',
  bsk:'<rect x="3.5" y="5" width="17" height="6" rx="1.6"/><rect x="3.5" y="13" width="17" height="6" rx="1.6"/><path d="M10 5v6M14.5 13v6"/>',
  bauko:'<path d="M3 11.5 12 4.2l9 7.3"/><path d="M6 10.2V19.5h12v-9.3"/><path d="M10.2 19.5v-5h3.6v5"/>',
  binf:'<path d="m8.5 8-4 4 4 4M15.5 8l4 4-4 4M13.4 5.6l-2.8 12.8"/>',
  dap:'<path d="M3 19.5h18"/><path d="M3.5 17.5c2.6 0 3.4-1.6 4.6-5S10.4 6 12 6s2.7 3 3.9 6.5 2 5 4.6 5"/>',
  stat:'<path d="M6 4.5H4.5v15H6M18 4.5h1.5v15H18"/><circle cx="9" cy="9" r=".9" fill="currentColor"/><circle cx="15" cy="9" r=".9" fill="currentColor"/><circle cx="9" cy="15" r=".9" fill="currentColor"/><circle cx="15" cy="15" r=".9" fill="currentColor"/>'
};
const SVG = (p, sw=1.9) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const I = {
  check: SVG('<path d="m5 12.5 4.5 4.5L19 7.5"/>', 2.6),
  x: SVG('<path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/>', 2.6),
  close: SVG('<path d="M7 7l10 10M17 7 7 17"/>', 2.2),
  play: SVG('<path d="M8 5.5v13l10.5-6.5z" fill="currentColor"/>'),
  flame: SVG('<path d="M12 3c.6 3.2 4.8 5.2 4.8 10a4.8 4.8 0 0 1-9.6 0c0-2.2 1-3.6 2.2-4.8.3 1.6 1.2 2.6 2.1 2.9C11 8.6 11.3 5.5 12 3z"/>'),
  redo: SVG('<path d="M4.5 12a7.5 7.5 0 1 0 2.4-5.5"/><path d="M4.5 4.5v4h4"/>'),
  bolt: SVG('<path d="M13 3 5.5 13.5H11L10 21l8-11h-5.6z"/>'),
  book: SVG('<path d="M4.5 5.5c2.5-1 5-1 7.5.5 2.5-1.5 5-1.5 7.5-.5v13c-2.5-1-5-1-7.5.5-2.5-1.5-5-1.5-7.5-.5z"/><path d="M12 6v13"/>'),
  target: SVG('<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1" fill="currentColor"/>'),
  chev: '<svg class="chev" viewBox="0 0 9 15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m1.5 1.5 6 6-6 6"/></svg>'
};
const TYPNAME = {mc:"Auswahl", wf:"Wahr oder falsch", ord:"Reihenfolge", pair:"Zuordnen"};
const BOXNAME = ["Neu","Lernen","Üben","Festigen","Sicher","Gemeistert"];
const INTERVAL = [0,1,2,4,8,16];
const GOAL = 20;
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $ = s => document.querySelector(s);
const cssC = f => `var(--c-${f})`;

/* ids */
function hash(s){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return (h>>>0).toString(36)}
FRAGEN.forEach(q => q.id = q.f + "-" + hash(q.q + (q.a ? q.a[0] : "") + (q.steps ? q.steps[0] : "") + (q.pairs ? q.pairs[0][0] : "")));
const BYID = Object.fromEntries(FRAGEN.map(q => [q.id, q]));

/* storage */
const APP_VERSION = "1.1";
const KEY = "klausurduell.v1";
let S = {cards:{}, days:{}};
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch(e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} }
const dayKey = (d=new Date()) => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const dayNum = (d=new Date()) => Math.floor((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()))/864e5);
const today = () => S.days[dayKey()] || {n:0,r:0};
function card(id){ return S.cards[id]; }
function boxOf(id){ const c = card(id); return c ? c.b : 0; }
function isDue(id){ const c = card(id); return c && c.due <= dayNum(); }
function streak(){
  let n=0; const d=new Date();
  if(!(S.days[dayKey(d)]||{}).n) d.setDate(d.getDate()-1);
  while((S.days[dayKey(d)]||{}).n){ n++; d.setDate(d.getDate()-1); }
  return n;
}
function mastery(list){ if(!list.length) return 0; return list.reduce((a,q)=>a+boxOf(q.id),0)/(list.length*5); }
const qsOf = f => FRAGEN.filter(q => q.f === f);
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]} return a; }
function wrongNow(){ return FRAGEN.filter(q => { const c=card(q.id); return c && c.last===false; }); }
function interleave(list){
  const g={}; list.forEach(q=>(g[q.f]=g[q.f]||[]).push(q));
  const keys=shuffle(Object.keys(g)); const out=[];
  while(out.length<list.length) keys.forEach(k=>{ if(g[k].length) out.push(g[k].shift()); });
  return out;
}
function buildSession(pool, n){
  const due = shuffle(pool.filter(q=>isDue(q.id))).sort((a,b)=>boxOf(a.id)-boxOf(b.id));
  const fresh = shuffle(pool.filter(q=>!card(q.id)));
  let set = due.slice(0, Math.ceil(n*.6));
  set = set.concat(fresh.slice(0, n-set.length));
  if (set.length < n) set = set.concat(due.slice(set.length).slice(0, n-set.length));
  if (set.length < n) { const rest = shuffle(pool.filter(q=>!set.includes(q))).sort((a,b)=>boxOf(a.id)-boxOf(b.id)); set = set.concat(rest.slice(0, n-set.length)); }
  return interleave(set.slice(0,n));
}

/* ring */
function ring(p, size, w, colorA, colorB, inner){
  const r=(size-w)/2, c=2*Math.PI*r, id="g"+Math.random().toString(36).slice(2,7);
  return `<div class="ring" style="width:${size}px;height:${size}px"><svg viewBox="0 0 ${size} ${size}"><defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:${colorA}"/><stop offset="1" style="stop-color:${colorB}"/></linearGradient></defs>
  <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" style="stroke:var(--hair)" stroke-width="${w}"/>
  <circle class="arc" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="url(#${id})" stroke-width="${w}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c}" data-off="${c*(1-Math.min(1,Math.max(0,p)))}" style="transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)"/></svg>
  <div class="num">${inner}</div></div>`;
}
function animateRings(root=document){ requestAnimationFrame(()=>requestAnimationFrame(()=>root.querySelectorAll(".arc").forEach(a=>a.style.strokeDashoffset=a.dataset.off))); }
const icon = (f, sm) => `<div class="ico${sm?" sm":""}" style="--c:${cssC(f)}">${SVG(ICON[f],1.8)}</div>`;

/* views */
let tab = "heute";
const DAYS = ["So","Mo","Di","Mi","Do","Fr","Sa"];
const MONTHS = ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
function vHeute(){
  const t = today(), st = streak(), w = wrongNow().length;
  const due = FRAGEN.filter(q=>isDue(q.id)).length, fresh = FRAGEN.filter(q=>!card(q.id)).length;
  const d = new Date();
  const nextEx = ORDER.filter(f=>FACH[f].ex).map(f=>({f,d:Math.round((new Date(FACH[f].ex)-new Date(dayKey()))/864e5)})).filter(x=>x.d>=0).sort((a,b)=>a.d-b.d)[0];
  return `<div class="view">
    <div class="head"><div><div class="eyebrow">${DAYS[d.getDay()]}., ${d.getDate()}. ${MONTHS[d.getMonth()]}</div><h1>Heute</h1></div>
      <div class="chip glass" title="Tage in Folge">${I.flame}${st} ${st===1?"Tag":"Tage"}</div></div>
    <div class="hero glass">
      ${ring(t.n/GOAL, 118, 13, "color-mix(in srgb, var(--accent) 55%, #7fe0ff)", "var(--accent)", `<b>${t.n}</b><span>von ${GOAL}</span>`)}
      <div class="hero-t"><span class="lbl">Tagesziel</span>
        <span class="big">${t.n>=GOAL ? "Geschafft. Alles darüber ist Bonus." : t.n ? `Noch ${GOAL-t.n} Fragen bis zum Ziel` : "20 Fragen, etwa 8 Minuten"}</span>
      </div>
      <div class="chips" style="grid-column:1/-1;margin-top:0"><span class="chip">${I.redo}${due} fällig</span><span class="chip">${I.book}${fresh} neu</span>${nextEx?`<span class="chip">${I.target}${FACH[nextEx.f].n.split(" ").pop()} · Klausur in ${nextEx.d} Tagen</span>`:""}</div>
    </div>
    <button class="cta press" data-act="start-mix">${I.play}Training starten · 10 Fragen</button>
    <div class="tiles">
      <button class="tile glass press" data-act="start-wrong" ${w?"":"disabled style='opacity:.55'"}><div class="round" style="background:var(--bad-soft);color:var(--bad)">${I.redo}</div><div><b>Fehler wiederholen</b><br><span>${w ? `${w} ${w===1?"Frage":"Fragen"} offen` : "Gerade nichts offen"}</span></div></button>
      <button class="tile glass press" data-act="start-quick"><div class="round" style="background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)">${I.bolt}</div><div><b>Schnelle Runde</b><br><span>5 Fragen, gemischt</span></div></button>
    </div>
    <div class="sec"><div class="sec-h"><h2>Deine Fächer</h2><small>${FRAGEN.length} Fragen</small></div>${subjectList()}</div>
  </div>`;
}
function subjectList(){
  return `<div class="list glass">${ORDER.map(f=>{const qs=qsOf(f), m=mastery(qs);
    return `<button class="row press" data-act="subject" data-f="${f}">${icon(f)}<div class="t"><b>${FACH[f].n}</b><small>${qs.length} Fragen · ${FACH[f].k}</small><div class="bar" style="--c:${cssC(f)}"><div style="width:${Math.round(m*100)}%"></div></div></div><span class="pct">${Math.round(m*100)} %</span>${I.chev}</button>`}).join("")}</div>`;
}
function vFaecher(){
  return `<div class="view">
    <div class="head"><div><div class="eyebrow">Wintersemester 26/27</div><h1>Fächer</h1></div></div>
    <p class="legend" style="margin:-12px 4px 0">Tippe ein Fach an, um nach Thema zu üben. Alle Fragen sind zum Merken gedacht – Begriffe, Zusammenhänge und das Vorgehen bei Rechenwegen, ohne selbst zu rechnen.</p>
    ${subjectList()}
    <div class="sec"><div class="sec-h"><h2>Fragetypen</h2></div>
      <div class="list glass">${[["mc","Auswahl","Eine von vier Antworten ist richtig."],["wf","Wahr oder falsch","Eine Aussage prüfen."],["ord","Reihenfolge","Schritte eines Vorgehens ordnen."],["pair","Zuordnen","Begriffe und Bedeutungen verbinden."]].map(([t,n,d])=>`<div class="row"><div class="round" style="background:var(--glass-soft);width:36px;height:36px"><b style="font-size:13px">${FRAGEN.filter(q=>q.typ===t).length}</b></div><div class="t"><b>${n}</b><small>${d}</small></div></div>`).join("")}</div></div>
  </div>`;
}
function vStand(){
  const seen = FRAGEN.filter(q=>card(q.id)).length, all = FRAGEN.length;
  let tr=0, tw=0; Object.values(S.cards).forEach(c=>{tr+=c.r||0; tw+=c.w||0;});
  const acc = tr+tw ? Math.round(tr/(tr+tw)*100) : 0;
  const m = mastery(FRAGEN);
  const box = [0,0,0,0,0,0]; FRAGEN.forEach(q=>box[boxOf(q.id)]++);
  const wk=[]; for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);wk.push({l:DAYS[d.getDay()],n:(S.days[dayKey(d)]||{}).n||0,t:i===0});}
  const mx = Math.max(GOAL, ...wk.map(x=>x.n));
  return `<div class="view">
    <div class="head"><div><div class="eyebrow">Auf diesem Gerät</div><h1>Lernstand</h1></div></div>
    <div class="hero glass">${ring(m,118,13,"#7fe0ff","var(--accent)",`<b>${Math.round(m*100)}</b><span>Prozent</span>`)}
      <div class="hero-t"><span class="lbl">Beherrscht insgesamt</span><span class="big">${seen ? `${seen} von ${all} Fragen schon gesehen` : "Noch keine Frage beantwortet"}</span>
</div><p class="legend" style="grid-column:1/-1;margin:0">Jede richtige Antwort schiebt eine Frage eine Lernstufe weiter, sie kommt dann seltener. Falsch beantwortete Fragen kommen sofort wieder.</p></div>
    <div class="statgrid"><div class="stat glass"><b>${streak()}</b><span>Tage in Folge</span></div><div class="stat glass"><b>${tr+tw}</b><span>Antworten</span></div><div class="stat glass"><b>${acc}<small style="font-size:15px"> %</small></b><span>Trefferquote</span></div></div>
    <div class="panel glass"><div class="sec-h" style="padding:0"><h2>Letzte 7 Tage</h2><small>Ziel ${GOAL}</small></div>
      <div class="week">${wk.map(x=>`<div class="col${x.t?" today":""}"><div class="b" style="height:100%"><div style="height:${Math.round(x.n/mx*100)}%"></div></div><span>${x.l}</span></div>`).join("")}</div></div>
    <div class="panel glass"><div class="sec-h" style="padding:0"><h2>Lernstufen</h2><small>${all} Fragen</small></div>
      <div class="boxes">${box.map((n,i)=>`<div class="boxrow"><span>${BOXNAME[i]}</span><div class="bar"><div style="width:${n/all*100}%;background:${i===0?"var(--ink-3)":`color-mix(in srgb, var(--accent) ${40+i*12}%, #7fe0ff)`}"></div></div><span>${n}</span></div>`).join("")}</div></div>
    <div class="sec"><div class="sec-h"><h2>Nach Fach</h2></div>${subjectList()}</div>
    <div class="panel glass"><div class="sec-h" style="padding:0"><h2>Daten sichern</h2><small>Version ${APP_VERSION}</small></div>
      <p class="legend" style="margin:0">Dein Lernstand liegt nur auf diesem Gerät. Ein Backup kannst du in Dateien oder iCloud ablegen und auf einem neuen Gerät wieder einlesen.</p>
      <div class="btnrow" style="margin-top:0"><button class="btn2 press" data-act="export">Backup sichern</button><button class="btn2 press" data-act="import">Backup laden</button></div>
      <input type="file" id="importFile" accept=".json,application/json" hidden></div>
    <button class="link danger" data-act="reset">Fortschritt zurücksetzen</button>
  </div>`;
}
function render(){
  const app = $("#app");
  app.innerHTML = tab==="heute" ? vHeute() : tab==="faecher" ? vFaecher() : vStand();
  document.querySelectorAll(".tab").forEach((b,i)=>{ b.classList.toggle("on", b.dataset.tab===tab); if(b.dataset.tab===tab) $("#pill").style.transform=`translateX(${i*100}%)`; });
  animateRings(app);
}

/* sheet */
function openSheet(html){
  const sh=$("#sheet"), sc=$("#scrim"); sh.innerHTML='<div class="grab"></div>'+html; sh.hidden=false; sc.hidden=false;
  requestAnimationFrame(()=>{sh.classList.add("show"); sc.classList.add("show");});
}
function closeSheet(){
  const sh=$("#sheet"), sc=$("#scrim"); sh.classList.remove("show"); sc.classList.remove("show");
  setTimeout(()=>{sh.hidden=true; sc.hidden=true;},420);
}
function subjectSheet(f){
  const qs=qsOf(f), topics=[...new Set(qs.map(q=>q.t))], due=qs.filter(q=>isDue(q.id)).length, fresh=qs.filter(q=>!card(q.id)).length;
  openSheet(`<div style="display:flex;gap:14px;align-items:center;margin-bottom:14px">${icon(f)}<div><h2>${FACH[f].n}</h2><p class="sub" style="margin:0">${qs.length} Fragen · ${fresh} neu · ${due} fällig</p></div></div>
    <button class="cta press" style="--accent:${cssC(f)}" data-act="start-subject" data-f="${f}">${I.play}Ganzes Fach · 10 Fragen</button>
    <div style="margin-top:18px">${topics.map(t=>{const tq=qs.filter(q=>q.t===t),m=mastery(tq);return `<button class="topic press" data-act="start-topic" data-f="${f}" data-t="${esc(t)}"><b>${esc(t)}</b><small>${tq.length} · ${Math.round(m*100)} %</small>${I.chev}</button>`}).join("")}</div>`);
}
function resetSheet(){
  openSheet(`<h2>Fortschritt zurücksetzen?</h2><p class="sub">Alle Lernstufen, die Serie und der Verlauf auf diesem Gerät werden gelöscht. Die Fragen bleiben erhalten.</p>
    <div class="btnrow"><button class="btn2 press" data-act="close">Abbrechen</button><button class="btn2 danger press" data-act="reset-yes">Zurücksetzen</button></div>`);
}
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),2000); }

/* quiz */
let Q = null;
function startQuiz(list, label){
  if(!list.length){ toast("Gerade keine Fragen in dieser Auswahl"); return; }
  closeSheet();
  Q = {list, i:0, res:[], label, t0:Date.now()};
  const el=$("#quiz"); el.hidden=false; document.body.style.overflow="hidden";
  renderQ();
}
function endQuiz(){ $("#quiz").hidden=true; $("#quiz").innerHTML=""; document.body.style.overflow=""; Q=null; render(); }
function segs(){ return Q.list.map((_,k)=>`<i class="${k<Q.i? (Q.res[k]?"r":"f") : k===Q.i?"cur":""}"></i>`).join(""); }
function renderQ(){
  const q=Q.list[Q.i], el=$("#quiz");
  Q.state = {done:false};
  let body="";
  if(q.typ==="mc"){
    Q.state.opts = shuffle(q.a.map((t,k)=>({t,ok:k===0})));
    body = `<div class="opts">${Q.state.opts.map((o,k)=>`<button class="opt glass press" data-act="mc" data-k="${k}"><span class="k">${"ABCD"[k]}</span><span>${esc(o.t)}</span></button>`).join("")}</div>`;
  } else if(q.typ==="wf"){
    body = `<div class="wfrow"><button class="wf glass press" data-act="wf" data-v="1">${I.check}Wahr</button><button class="wf glass press" data-act="wf" data-v="0">${I.x}Falsch</button></div>`;
  } else if(q.typ==="ord"){
    Q.state.pool = shuffle(q.steps.map((t,k)=>({t,k}))); Q.state.picked=[];
    body = `<div class="slots" id="slots"></div><div class="hint">Tippe die Schritte in der richtigen Reihenfolge an. Antippen eines Platzes nimmt den Schritt zurück.</div><div class="pool" id="pool"></div><div id="ordbtn"></div>`;
  } else {
    const L=shuffle(q.pairs.map((p,k)=>({t:p[0],k}))), R=shuffle(q.pairs.map((p,k)=>({t:p[1],k})));
    Q.state.L=L; Q.state.R=R; Q.state.sel=null; Q.state.matched={}; Q.state.miss=0;
    body = `<div class="hint">Tippe links einen Begriff an, dann rechts die passende Bedeutung.</div><div class="pairs"><div class="colp" id="pl"></div><div class="colp" id="pr"></div></div>`;
  }
  el.innerHTML = `<div class="ambient tint" style="--tint:${cssC(q.f)}"><i></i><i></i><i></i><i></i></div>
  <div class="qwrap"><div class="qtop"><button class="round glass press" data-act="quit" aria-label="Beenden">${I.close}</button><div class="seg">${segs()}</div><span class="qcount">${Q.i+1}/${Q.list.length}</span></div>
  <div class="qbody" id="qbody"><div class="qcard glass" style="--c:${cssC(q.f)}"><div class="qmeta"><span class="dot"></span><span class="lab">${FACH[q.f].n} · ${esc(q.t)}</span><span class="typ">${TYPNAME[q.typ]}</span></div><div class="qtext">${esc(q.q)}</div></div>${body}<div id="fb"></div></div>
  <div class="qfoot" id="qfoot"></div></div>`;
  if(q.typ==="ord") drawOrd(); if(q.typ==="pair") drawPairs();
  el.querySelector("#qbody").scrollTop=0;
}
function drawOrd(){
  const q=Q.list[Q.i], st=Q.state, n=q.steps.length;
  $("#slots").innerHTML = Array.from({length:n},(_,k)=>{const p=st.picked[k];
    const cls = p ? "filled"+(st.done ? (p.k===k?" ok":" no") : "") : "";
    return `<button class="slot ${cls}" style="--c:${cssC(q.f)}" data-act="unpick" data-k="${k}" ${!p||st.done?"disabled":""}><span class="n">${k+1}</span><span>${p?esc(p.t):""}</span></button>`}).join("");
  $("#pool").innerHTML = st.done ? "" : st.pool.map((p,k)=>`<button class="pchip glass press" data-act="pick" data-k="${k}">${esc(p.t)}</button>`).join("");
  $("#ordbtn").innerHTML = (!st.done && st.picked.length===n) ? `<button class="cta press" data-act="ord-check">Prüfen</button>` : "";
}
function drawPairs(){
  const st=Q.state, q=Q.list[Q.i], hues=["var(--c-hydro)","var(--c-bsk)","var(--c-phys)","var(--c-binf)","var(--c-stat)"];
  const mk=(side,arr)=>arr.map((p,k)=>{const m=st.matched[p.k]; const sel=st.sel&&st.sel.side===side&&st.sel.i===k;
    return `<button class="pc glass press${m!==undefined?" done":""}${sel?" sel":""}" style="--m:${hues[p.k%hues.length]}" data-act="pc" data-side="${side}" data-i="${k}" ${m!==undefined||st.done?"disabled":""}>${esc(p.t)}</button>`}).join("");
  $("#pl").innerHTML=mk("L",st.L); $("#pr").innerHTML=mk("R",st.R);
}
function haptic(ok){ try{ navigator.vibrate && navigator.vibrate(ok?12:[18,40,18]); }catch(e){} }
function record(ok){
  const q=Q.list[Q.i], c=S.cards[q.id]||{b:0,r:0,w:0}, dn=dayNum();
  if(ok){ c.b=Math.min(5,c.b+1); c.r++; } else { c.b=1; c.w++; }
  c.due = dn + (ok ? INTERVAL[c.b] : 0); c.last=ok; S.cards[q.id]=c;
  const k=dayKey(); const d=S.days[k]||{n:0,r:0}; d.n++; if(ok) d.r++; S.days[k]=d; save();
  Q.res[Q.i]=ok; Q.state.done=true; haptic(ok);
  const extra = q.typ==="ord" && !ok ? `<ol>${q.steps.map(s=>`<li>${esc(s)}</li>`).join("")}</ol>` : "";
  const pairExtra = q.typ==="pair" && !ok ? `<p style="color:var(--ink-2);font-size:14px">${Q.state.miss} ${Q.state.miss===1?"Fehlversuch":"Fehlversuche"} beim Zuordnen – die Frage kommt bald wieder.</p>` : "";
  $("#fb").innerHTML = `<div class="fb glass"><div class="fh"><span class="badge ${ok?"ok":"no"}">${ok?I.check:I.x}</span><b>${ok?["Richtig","Genau","Sitzt"][Math.floor(Math.random()*3)]:"Nicht ganz"}</b></div>
    ${extra}${pairExtra}<p>${q.typ==="wf" ? `<b>Die Aussage ist ${q.c?"wahr":"falsch"}.</b> `+esc(q.e.replace(/^(Richtig|Falsch)\s*[.–-]?\s*/,"").replace(/^./,c=>c.toUpperCase())) : esc(q.e)}</p><div class="src">${I.book}${esc(q.s)}</div></div>`;
  $("#qfoot").innerHTML = `<button class="cta press" data-act="next">${Q.i<Q.list.length-1?"Weiter":"Ergebnis ansehen"}</button>`;
  document.querySelector(".seg").innerHTML = segs().replace('class="cur"', `class="${ok?"r":"f"}"`);
  setTimeout(()=>{const b=$("#qbody"); b.scrollTo({top:b.scrollHeight,behavior:"smooth"});},60);
}
function next(){ if(Q.i<Q.list.length-1){ Q.i++; renderQ(); } else result(); }
function result(){
  const n=Q.list.length, r=Q.res.filter(Boolean).length, p=r/n, mins=Math.max(1,Math.round((Date.now()-Q.t0)/60000));
  const head = p===1?"Perfekte Runde":p>=.8?"Stark":p>=.5?"Gut dabei":"Dranbleiben";
  $("#quiz").innerHTML = `<div class="ambient"><i></i><i></i><i></i><i></i></div><div class="qwrap"><div class="qbody"><div class="res">
    ${ring(p,170,16,p>=.5?"#7fe8a0":"#ffb199",p>=.5?"var(--ok)":"var(--bad)",`<b>${r}/${n}</b><span>richtig</span>`)}
    <h1>${head}</h1><p class="sub">${Q.label} · ${mins} Min.</p>
    <div class="rlist glass">${Q.list.map((q,k)=>`<div class="ritem"><span class="m ${Q.res[k]?"ok":"no"}">${Q.res[k]?I.check:I.x}</span><div>${esc(q.q)}<small>${FACH[q.f].n} · ${esc(q.t)}</small></div></div>`).join("")}</div>
  </div></div><div class="qfoot" style="display:flex;flex-direction:column;gap:10px">
    ${r<n?`<button class="cta press" data-act="again-wrong">${I.redo}Fehler gleich wiederholen</button>`:""}
    <button class="btn2 glass press" style="height:56px;width:100%;flex:none" data-act="done">Fertig</button></div></div>`;
  Q.wrong = Q.list.filter((_,k)=>!Q.res[k]);
  animateRings($("#quiz"));
}

/* events */
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act],[data-tab]"); if(!b || b.disabled) return;
  if(b.dataset.tab){ tab=b.dataset.tab; render(); window.scrollTo({top:0}); return; }
  const a=b.dataset.act;
  if(a==="start-mix") startQuiz(buildSession(FRAGEN,10),"Training");
  else if(a==="start-quick") startQuiz(shuffle(FRAGEN).slice(0,5),"Schnelle Runde");
  else if(a==="start-wrong") startQuiz(interleave(shuffle(wrongNow()).slice(0,10)),"Fehler wiederholen");
  else if(a==="subject") subjectSheet(b.dataset.f);
  else if(a==="start-subject") startQuiz(buildSession(qsOf(b.dataset.f),10),FACH[b.dataset.f].n);
  else if(a==="start-topic"){ const f=b.dataset.f, t=b.dataset.t; startQuiz(buildSession(qsOf(f).filter(q=>q.t===t),10),`${FACH[f].n} · ${t}`); }
  else if(a==="reset") resetSheet();
  else if(a==="export") exportBackup();
  else if(a==="import") $("#importFile").click();
  else if(a==="reload") location.reload();
  else if(a==="reset-yes"){ S={cards:{},days:{}}; save(); closeSheet(); render(); toast("Fortschritt zurückgesetzt"); }
  else if(a==="close") closeSheet();
  else if(a==="quit"||a==="done") endQuiz();
  else if(a==="next") next();
  else if(a==="again-wrong"){ const w=Q.wrong; startQuiz(shuffle(w),"Fehler wiederholen"); }
  else if(Q && !Q.state.done){
    const q=Q.list[Q.i];
    if(a==="mc"){ const k=+b.dataset.k, ok=Q.state.opts[k].ok;
      document.querySelectorAll(".opt").forEach((o,j)=>{o.disabled=true; const oo=Q.state.opts[j]; if(oo.ok){o.classList.add("ok");o.querySelector(".k").innerHTML=I.check;} else if(j===k){o.classList.add("no");o.querySelector(".k").innerHTML=I.x;} else o.classList.add("dim");});
      record(ok); }
    else if(a==="wf"){ const v=b.dataset.v==="1", ok=v===q.c;
      document.querySelectorAll(".wf").forEach(o=>{o.disabled=true; const ov=o.dataset.v==="1"; if(ov===q.c) o.classList.add("ok"); else if(o===b) o.classList.add("no"); else o.classList.add("dim");});
      record(ok); }
    else if(a==="pick"){ const k=+b.dataset.k; Q.state.picked.push(Q.state.pool.splice(k,1)[0]); drawOrd(); }
    else if(a==="unpick"){ const k=+b.dataset.k; const p=Q.state.picked.splice(k,1)[0]; if(p) Q.state.pool.push(p); drawOrd(); }
    else if(a==="ord-check"){ const ok=Q.state.picked.every((p,k)=>p.k===k); Q.state.done=true; drawOrd(); Q.state.done=false; record(ok); }
    else if(a==="pc"){ const st=Q.state, side=b.dataset.side, i=+b.dataset.i;
      if(!st.sel || st.sel.side===side){ st.sel={side,i}; drawPairs(); return; }
      const l = side==="R" ? st.L[st.sel.i] : st.L[i], r = side==="R" ? st.R[i] : st.R[st.sel.i];
      if(l.k===r.k){ st.matched[l.k]=true; st.sel=null; drawPairs(); haptic(true);
        if(Object.keys(st.matched).length===q.pairs.length){ record(st.miss===0); } }
      else { st.miss++; st.sel=null; haptic(false); drawPairs(); const w=document.querySelectorAll(`.pc[data-side="${side}"]`)[i]; if(w){w.classList.add("wrong"); setTimeout(()=>w.classList.remove("wrong"),450);} }
    }
  }
});
$("#scrim").addEventListener("click", closeSheet);
document.addEventListener("keydown", e => {
  if(!Q || $("#quiz").hidden) return;
  if(e.key==="Escape"){ endQuiz(); return; }
  const q=Q.list[Q.i];
  if(Q.state && Q.state.done && (e.key==="Enter"||e.key===" ")){ e.preventDefault(); const n=document.querySelector('[data-act="next"]'); if(n) n.click(); return; }
  if(q && !Q.state.done && q.typ==="mc" && /^[1-4]$/.test(e.key)){ const o=document.querySelectorAll(".opt")[+e.key-1]; if(o) o.click(); }
  if(q && !Q.state.done && q.typ==="wf" && /^[wf]$/i.test(e.key)){ document.querySelector(`.wf[data-v="${e.key.toLowerCase()==="w"?1:0}"]`).click(); }
});
async function exportBackup(){
  if(framed){ toast("Backup gibt es in der installierten App"); return; }
  const data = JSON.stringify({app:"klausurduell", version:APP_VERSION, saved:new Date().toISOString(), state:S});
  const name = `Klausurduell Backup ${dayKey()}.json`;
  try{
    const file = new File([data], name, {type:"application/json"});
    if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:"Klausurduell Backup"}); return; }
  }catch(e){ if(e && e.name==="AbortError") return; }
  try{ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([data],{type:"application/json"})); a.download=name; document.body.appendChild(a); a.click(); a.remove(); toast("Backup gespeichert"); }
  catch(e){ toast("Speichern hier nicht möglich"); }
}
document.addEventListener("change", e => {
  if(e.target.id!=="importFile" || !e.target.files[0]) return;
  const r=new FileReader();
  r.onload=()=>{ try{ const d=JSON.parse(r.result); if(d.app!=="klausurduell"||!d.state||!d.state.cards) throw 0;
      S={cards:d.state.cards||{}, days:d.state.days||{}}; save(); render(); toast("Backup geladen"); }
    catch(err){ toast("Diese Datei ist kein Klausurduell-Backup"); } e.target.value=""; };
  r.readAsText(e.target.files[0]);
});
/* Offline-App: nur auf der eigenen Adresse, nicht im Artifact-Rahmen */
let framed=true; try{ framed = window.top!==window; }catch(e){}
if(!framed && "serviceWorker" in navigator && location.protocol==="https:"){
  navigator.serviceWorker.register("sw.js").then(reg=>{
    reg.addEventListener("updatefound",()=>{ const w=reg.installing; if(!w) return;
      w.addEventListener("statechange",()=>{ if(w.state==="installed" && navigator.serviceWorker.controller){
        const t=$("#toast"); t.innerHTML='Neue Version da · <button data-act="reload" style="color:var(--accent);font-weight:700">Aktualisieren</button>'; t.classList.add("show"); } }); });
  }).catch(()=>{});
  if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});
}
render();
})();
</script>

</body></html>
